<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker · SaaS dashboard</title>
  <!-- Google Fonts + Chart.js + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Poppins', sans-serif;
    }

    /* light theme (default) */
    :root {
      --bg-body: #f6f9fc;
      --bg-card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --border-light: #e2e8f0;
      --shadow-sm: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
      --shadow-hover: 0 20px 30px -10px rgba(0,100,200,0.15);
      --accent-blue: #2563eb;
      --accent-soft: #dbeafe;
      --badge-blue: #dbeafe; color: #1e40af;
      --badge-orange: #fed7aa; color: #9a3412;
      --badge-green: #dcfce7; color: #166534;
      --badge-red: #fee2e2; color: #991b1b;
      --input-bg: #ffffff;
      --toast-bg: #1e293b;
      --toast-text: #f8fafc;
      --chart-grid: #cbd5e1;
    }

    body.dark {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --border-light: #334155;
      --shadow-sm: 0 10px 25px -5px #00000055, 0 8px 10px -6px #00000040;
      --shadow-hover: 0 20px 30px -10px #1e3a8a80;
      --accent-blue: #3b82f6;
      --accent-soft: #1e3a5f;
      --badge-blue: #1e3a5f; color: #bfdbfe;
      --badge-orange: #854d0e; color: #fed7aa;
      --badge-green: #14532d; color: #bbf7d0;
      --badge-red: #7f1d1d; color: #fecaca;
      --input-bg: #0f172a;
      --toast-bg: #334155;
      --chart-grid: #475569;
    }

    body {
      background: var(--bg-body);
      color: var(--text-primary);
      transition: background 0.2s, color 0.2s;
      padding: 1.5rem;
      min-height: 100vh;
    }

    .app-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===== CUSTOM SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-body); }
    ::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 20px; opacity: 0.5; }
    ::-webkit-scrollbar-thumb:hover { background: #1d4ed8; }

    /* ===== GLASS CARDS (subtle) ===== */
    .card {
      background: var(--bg-card);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      padding: 1.5rem 1.8rem;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border-light);
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    /* ===== HEADER (sticky) ===== */
    .sticky-header {
      position: sticky;
      top: 1.5rem;
      z-index: 20;
      background: var(--bg-card);
      border-radius: 60px;
      padding: 0.8rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      backdrop-filter: blur(8px);
    }
    .logo h1 {
      font-weight: 600;
      font-size: 1.8rem;
    }
    .logo p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .nav-links {
      display: flex;
      gap: 0.8rem;
    }
    .nav-link {
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.2s;
      font-weight: 500;
    }
    .nav-link.active {
      background: var(--accent-soft);
      color: var(--accent-blue);
    }
    .theme-toggle {
      background: var(--border-light);
      border-radius: 40px;
      padding: 0.3rem 1rem;
      display: flex;
      gap: 0.5rem;
      cursor: pointer;
    }

    /* ===== SUMMARY CARDS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stat-left h3 {
      font-weight: 500;
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
    }
    .stat-number {
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .stat-icon {
      font-size: 2.5rem;
      opacity: 0.7;
      color: var(--accent-blue);
    }

    /* ===== FORM + MODAL ===== */
    .add-job-trigger {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    .btn-primary {
      background: var(--accent-blue);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.8rem 2rem;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 18px #2563eb50;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary:hover { opacity: 0.9; transform: scale(1.02);}

    /* Modal background */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--bg-card);
      border-radius: 32px;
      max-width: 600px;
      width: 90%;
      padding: 2rem;
      box-shadow: 0 30px 60px #00000040;
      animation: slideUp 0.3s;
    }
    .modal-content h2 { margin-bottom: 1.5rem; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 1.5rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .field.full { grid-column: span 2; }
    .field label { font-size: 0.85rem; color: var(--text-secondary); }
    .field input, .field select, .field textarea {
      background: var(--input-bg);
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 0.7rem 1.2rem;
      color: var(--text-primary);
      outline: none;
      transition: 0.2s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent-blue); }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 2rem;
    }

    .error-msg {
      color: #b91c1c;
      background: #fee2e280;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      margin-top: 1rem;
    }
    .hidden { display: none; }

    /* ===== APPLICATION LIST ===== */
    .list-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin: 1.5rem 0 1rem;
    }
    .filter-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 0.4rem 1.3rem;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .filter-btn.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border-light);
      border-radius: 60px;
      padding: 0.2rem 0.2rem 0.2rem 1.5rem;
    }
    .search-box input {
      background: transparent;
      border: none;
      padding: 0.5rem 1rem;
      color: var(--text-primary);
      outline: none;
    }

    /* table / card list */
    .applications-grid {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .app-row {
      background: var(--bg-card);
      border-radius: 50px;
      padding: 1rem 1.8rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      border: 1px solid var(--border-light);
      transition: 0.2s;
      animation: slideUp 0.25s;
    }
    .app-row:hover { background: var(--accent-soft); border-color: var(--accent-blue);}
    .app-info {
      flex: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: center;
    }
    .company { font-weight: 600; min-width: 130px; }
    .role { color: var(--text-secondary); min-width: 140px; }
    .date { font-size: 0.9rem; opacity: 0.7; width: 100px; }
    .badge {
      padding: 0.25rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.85rem;
      text-align: center;
      min-width: 90px;
    }
    .badge.Applied { background: var(--badge-blue); color: var(--badge-blue); }
    .badge.Interview { background: var(--badge-orange); color: var(--badge-orange); }
    .badge.Offer { background: var(--badge-green); color: var(--badge-green); }
    .badge.Rejected { background: var(--badge-red); color: var(--badge-red); }

    .follow-badge {
      background: #fde047; color: #0f172a; border-radius: 30px; padding: 0.2rem 1rem; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 4px;
    }
    .actions {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }
    .icon-btn {
      background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-secondary); padding: 0.4rem; border-radius: 50%;
    }
    .icon-btn:hover { background: #ffffff30; color: var(--accent-blue); }

    /* empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
    }

    /* ===== CHARTS ROW ===== */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin: 2.5rem 0;
    }
    .chart-card canvas { max-height: 250px; width: 100% !important; background: var(--bg-card); border-radius: 18px; padding: 0.5rem;}

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 2rem; right: 2rem;
      background: var(--toast-bg); color: var(--toast-text);
      padding: 1rem 2rem; border-radius: 60px; box-shadow: 0 10px 30px #00000050;
      transform: translateY(200%); transition: transform 0.3s;
      z-index: 200;
    }
    .toast.show { transform: translateY(0);}

    /* ===== FLOATING ACTION BUTTON (mobile) ===== */
    .fab {
      display: none;
      position: fixed; bottom: 2rem; right: 2rem;
      background: var(--accent-blue); color: white; width: 60px; height: 60px;
      border-radius: 40px; box-shadow: 0 10px 25px #2563eb; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer;
      z-index: 30;
    }

    @media (max-width: 800px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .fab { display: flex; }
      .nav-links { display: none; } /* simplify, but keep toggle */
      .sticky-header { border-radius: 30px; }
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- sticky header -->
    <header class="sticky-header">
      <div class="logo">
        <h1>JobTrackr</h1>
        <p>applications · follow-ups · analytics</p>
      </div>
      <div class="nav-links">
        <span class="nav-link active" data-section="all">All</span>
        <span class="nav-link" data-section="add" id="navAddJob">Add New</span>
        <span class="nav-link" data-section="analytics">Analytics</span>
      </div>
      <div class="theme-toggle" id="themeToggle">
        <span>☀️</span><span>🌙</span>
      </div>
    </header>

    <!-- summary cards -->
    <div class="stats-grid" id="summaryCards">
      <div class="card stat-card"><div class="stat-left"><h3>Total apps</h3><span class="stat-number" id="totalApps">0</span></div><i class="fas fa-briefcase stat-icon"></i></div>
      <div class="card stat-card"><div class="stat-left"><h3>Applied</h3><span class="stat-number" id="appliedCount">0</span></div><i class="fas fa-paper-plane stat-icon"></i></div>
      <div class="card stat-card"><div class="stat-left"><h3>Interview</h3><span class="stat-number" id="interviewCount">0</span></div><i class="fas fa-calendar-check stat-icon"></i></div>
      <div class="card stat-card"><div class="stat-left"><h3>Offer/Reject</h3><span class="stat-number" id="offerRejectCount">0</span></div><i class="fas fa-chart-simple stat-icon"></i></div>
    </div>

    <!-- Add job button (desktop) -->
    <div class="add-job-trigger">
      <button class="btn-primary" id="openModalBtn"><i class="fas fa-plus-circle"></i> Add application</button>
    </div>

    <!-- filter & search -->
    <div class="list-header">
      <div class="filter-group" id="statusFilterGroup">
        <span class="filter-btn active" data-filter="all">All</span>
        <span class="filter-btn" data-filter="Applied">Applied</span>
        <span class="filter-btn" data-filter="Interview">Interview</span>
        <span class="filter-btn" data-filter="Offer">Offer</span>
        <span class="filter-btn" data-filter="Rejected">Rejected</span>
      </div>
      <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Company or role"></div>
    </div>

    <!-- application list container -->
    <div class="applications-grid" id="applicationsList"></div>

    <!-- charts row -->
    <div class="charts-row">
      <div class="card chart-card"><canvas id="statusChart"></canvas></div>
      <div class="card chart-card"><canvas id="monthlyChart"></canvas></div>
    </div>

    <!-- floating action button mobile -->
    <div class="fab" id="fabBtn"><i class="fas fa-plus"></i></div>

    <!-- MODAL add/edit -->
    <div class="modal" id="jobModal">
      <div class="modal-content">
        <h2 id="modalTitle">Add job application</h2>
        <div class="form-grid" id="jobForm">
          <div class="field"><label>Company *</label><input id="company" placeholder="e.g. Google"></div>
          <div class="field"><label>Job Title *</label><input id="title" placeholder="Frontend dev"></div>
          <div class="field"><label>Location</label><input id="location" placeholder="Remote / NYC"></div>
          <div class="field"><label>Salary (optional)</label><input id="salary" type="text" placeholder="$120k"></div>
          <div class="field"><label>Application date *</label><input id="appDate" type="date"></div>
          <div class="field"><label>Status</label><select id="statusSelect"><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></div>
          <div class="field full"><label>Notes</label><textarea id="notes" rows="2"></textarea></div>
          <div class="field"><label>Follow-up date</label><input id="followUp" type="date"></div>
        </div>
        <div id="modalError" class="error-msg hidden"></div>
        <div class="modal-actions">
          <button class="btn-primary" id="saveJobBtn">Save</button>
          <button class="btn-primary" style="background: #64748b;" id="cancelModalBtn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- toast -->
    <div class="toast" id="toast">Application saved</div>
  </div>

  <script>
    (function() {
      // ----- STATE -----
      let applications = [];
      let currentFilter = 'all';
      let searchTerm = '';
      let editIndex = -1; // -1 = add mode

      // DOM elements
      const totalAppsEl = document.getElementById('totalApps');
      const appliedCountEl = document.getElementById('appliedCount');
      const interviewCountEl = document.getElementById('interviewCount');
      const offerRejectCountEl = document.getElementById('offerRejectCount');
      const listContainer = document.getElementById('applicationsList');
      const modal = document.getElementById('jobModal');
      const modalTitle = document.getElementById('modalTitle');
      const openModalBtn = document.getElementById('openModalBtn');
      const fabBtn = document.getElementById('fabBtn');
      const cancelModalBtn = document.getElementById('cancelModalBtn');
      const saveBtn = document.getElementById('saveJobBtn');
      const companyInp = document.getElementById('company');
      const titleInp = document.getElementById('title');
      const locationInp = document.getElementById('location');
      const salaryInp = document.getElementById('salary');
      const appDateInp = document.getElementById('appDate');
      const statusSel = document.getElementById('statusSelect');
      const notesInp = document.getElementById('notes');
      const followUpInp = document.getElementById('followUp');
      const modalError = document.getElementById('modalError');
      const filterBtns = document.querySelectorAll('.filter-btn');
      const searchInp = document.getElementById('searchInput');
      const themeToggle = document.getElementById('themeToggle');
      const toastEl = document.getElementById('toast');

      // charts
      let pieChart, barChart;

      // ---- storage ----
      function loadFromStorage() {
        const stored = localStorage.getItem('jobApps');
        applications = stored ? JSON.parse(stored) : [];
        applyFilterAndRender();
        updateCharts();
      }
      function saveToStorage() {
        localStorage.setItem('jobApps', JSON.stringify(applications));
      }

      // summary with animation
      function animateNumber(el, target) {
        let start = Number(el.innerText) || 0;
        const stepTime = 15, steps = 300/stepTime;
        const inc = (target - start)/steps;
        let step = 0;
        const interval = setInterval(()=>{
          step++;
          start += inc;
          el.innerText = Math.round(start);
          if(step>=steps){ el.innerText = target; clearInterval(interval); }
        }, stepTime);
      }

      function updateSummary() {
        const total = applications.length;
        const applied = applications.filter(a=>a.status==='Applied').length;
        const interview = applications.filter(a=>a.status==='Interview').length;
        const offerRej = applications.filter(a=>a.status==='Offer'||a.status==='Rejected').length;
        animateNumber(totalAppsEl, total);
        animateNumber(appliedCountEl, applied);
        animateNumber(interviewCountEl, interview);
        animateNumber(offerRejectCountEl, offerRej);
      }

      // render list based on filter & search
      function renderList() {
        let filtered = applications.filter(app => {
          if (currentFilter !== 'all' && app.status !== currentFilter) return false;
          if (searchTerm) {
            const term = searchTerm.toLowerCase();
            return app.company.toLowerCase().includes(term) || app.title.toLowerCase().includes(term);
          }
          return true;
        });

        if (filtered.length === 0) {
          listContainer.innerHTML = `<div class="empty-state"><i class="fas fa-inbox fa-3x"></i><p>No applications found</p></div>`;
          return;
        }

        let html = '';
        filtered.forEach((app, idx) => {
          const originalIndex = applications.indexOf(app);
          const today = new Date();
          const followDate = app.followUp ? new Date(app.followUp) : null;
          const isUpcoming = followDate && (followDate - today) / (1000*60*60*24) <= 7 && followDate >= today;
          html += `<div class="app-row" data-index="${originalIndex}">
            <div class="app-info">
              <span class="company">${app.company}</span>
              <span class="role">${app.title} ${app.location ? '· '+app.location : ''}</span>
              <span class="date">${app.appDate || ''}</span>
              <span class="badge ${app.status}">${app.status}</span>
              ${isUpcoming ? '<span class="follow-badge"><i class="fas fa-bell"></i> follow-up</span>' : ''}
            </div>
            <div class="actions">
              <button class="icon-btn edit-btn" data-index="${originalIndex}"><i class="fas fa-pen"></i></button>
              <button class="icon-btn delete-btn" data-index="${originalIndex}"><i class="fas fa-trash"></i></button>
            </div>
          </div>`;
        });
        listContainer.innerHTML = html;

        // attach edit/delete events
        document.querySelectorAll('.edit-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = btn.dataset.index;
            if (idx !== undefined) openEditModal(parseInt(idx));
          });
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = btn.dataset.index;
            if (idx !== undefined && confirm('Delete this application?')) {
              applications.splice(parseInt(idx),1);
              saveToStorage();
              applyFilterAndRender();
              updateCharts();
              showToast('Deleted');
            }
          });
        });
      }

      // filter and search handlers
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          renderList();
        });
      });
      searchInp.addEventListener('input', e => { searchTerm = e.target.value; renderList(); });

      // modal open/close
      function openAddModal() {
        editIndex = -1;
        modalTitle.innerText = 'Add job application';
        companyInp.value = titleInp.value = locationInp.value = salaryInp.value = appDateInp.value = notesInp.value = followUpInp.value = '';
        statusSel.value = 'Applied';
        modalError.classList.add('hidden');
        modal.classList.add('active');
      }
      function openEditModal(index) {
        const app = applications[index];
        if (!app) return;
        editIndex = index;
        modalTitle.innerText = 'Edit application';
        companyInp.value = app.company || '';
        titleInp.value = app.title || '';
        locationInp.value = app.location || '';
        salaryInp.value = app.salary || '';
        appDateInp.value = app.appDate || '';
        statusSel.value = app.status || 'Applied';
        notesInp.value = app.notes || '';
        followUpInp.value = app.followUp || '';
        modalError.classList.add('hidden');
        modal.classList.add('active');
      }

      function closeModal() { modal.classList.remove('active'); }

      // validation
      function validateModal() {
        if (!companyInp.value.trim() || !titleInp.value.trim() || !appDateInp.value) return 'Company, Title and Date are required.';
        return null;
      }

      function saveJob() {
        const err = validateModal();
        if (err) { modalError.innerText = err; modalError.classList.remove('hidden'); return; }
        modalError.classList.add('hidden');
        const jobData = {
          company: companyInp.value.trim(),
          title: titleInp.value.trim(),
          location: locationInp.value.trim(),
          salary: salaryInp.value.trim(),
          appDate: appDateInp.value,
          status: statusSel.value,
          notes: notesInp.value.trim(),
          followUp: followUpInp.value || null,
        };
        if (editIndex === -1) applications.push(jobData);
        else applications[editIndex] = jobData;

        saveToStorage();
        applyFilterAndRender();
        updateCharts();
        closeModal();
        showToast(editIndex===-1?'Added':'Updated');
      }

      function showToast(msg) {
        toastEl.innerText = msg; toastEl.classList.add('show');
        setTimeout(()=>toastEl.classList.remove('show'), 2000);
      }

      // apply + summary + list
      function applyFilterAndRender() {
        updateSummary();
        renderList();
      }

      // charts
      function updateCharts() {
        const statusCounts = {Applied:0, Interview:0, Offer:0, Rejected:0};
        applications.forEach(a=> { if(statusCounts.hasOwnProperty(a.status)) statusCounts[a.status]++; });
        if (pieChart) pieChart.destroy();
        pieChart = new Chart(document.getElementById('statusChart'), {
          type: 'doughnut',
          data: { labels: ['Applied','Interview','Offer','Rejected'], datasets: [{ data: [statusCounts.Applied, statusCounts.Interview, statusCounts.Offer, statusCounts.Rejected], backgroundColor: ['#3b82f6','#f97316','#22c55e','#ef4444'] }] }
        });
        // monthly: last 6 months simplified
        const months = ['Jan','Feb','Mar','Apr','May','Jun'];
        const monthly = Array(6).fill(0);
        applications.forEach(a => {
          if (a.appDate) {
            const m = new Date(a.appDate).getMonth();
            if (m < 6) monthly[m]++; 
          }
        });
        if (barChart) barChart.destroy();
        barChart = new Chart(document.getElementById('monthlyChart'), {
          type: 'bar',
          data: { labels: months, datasets: [{ label: 'Applications', data: monthly, backgroundColor: '#2563eb' }] }
        });
      }

      // clear all (with confirmation)
      window.clearAllData = function() {
        if (confirm('Delete ALL applications?')) { applications = []; saveToStorage(); applyFilterAndRender(); updateCharts(); showToast('All cleared'); }
      }

      // export json
      window.exportData = function() {
        const blob = new Blob([JSON.stringify(applications)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'job_applications.json'; a.click();
      }

      // theme toggle
      themeToggle.addEventListener('click', () => document.body.classList.toggle('dark'));

      // event listeners
      openModalBtn.addEventListener('click', openAddModal);
      fabBtn.addEventListener('click', openAddModal);
      cancelModalBtn.addEventListener('click', closeModal);
      saveBtn.addEventListener('click', saveJob);
      window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

      // nav add click
      document.getElementById('navAddJob').addEventListener('click', openAddModal);

      // optional clear/export buttons — we can add two small buttons in analytics but keep UI clean: add under charts?
      // we attach to window for console, but also create small bar under charts.
      const actionBar = document.createElement('div');
      actionBar.style.display = 'flex'; actionBar.style.gap = '1rem'; actionBar.style.margin = '1rem 0';
      actionBar.innerHTML = `<button class="btn-primary" onclick="clearAllData()" style="background:#ef4444;">Clear all</button>
                             <button class="btn-primary" onclick="exportData()">Export JSON</button>`;
      document.querySelector('.charts-row').insertAdjacentElement('afterend', actionBar);

      // start
      loadFromStorage();
    })();
  </script>
</body>
</html>
