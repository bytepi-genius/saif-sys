<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUBBLE SORT • VISUALIZER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-gradient-1: #06142E;
            --bg-gradient-2: #0B2447;
            --panel-bg: rgba(10, 25, 50, 0.45);
            --text-primary: #ffffff;
            --text-secondary: #b0d4f0;
            --accent-color: #00E5FF;
            --border-glow: rgba(0, 229, 255, 0.5);
            --shadow-neon: 0 0 20px #00E5FF;
            --bar-default: #4FC3F7;
            --bar-compare: #FFD700;
            --bar-swap: #FF4757;
            --bar-sorted: #00FF88;
            --control-bg: rgba(0, 20, 40, 0.7);
            --pillar-shadow: rgba(79, 195, 247, 0.3);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, var(--bg-gradient-1), var(--bg-gradient-2));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: var(--accent-color);
            border-radius: 50%;
            opacity: 0.2;
            pointer-events: none;
            animation: floatParticle 15s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(-100vh) translateX(0); opacity: 0; }
            50% { opacity: 0.3; }
            100% { transform: translateY(100vh) translateX(50px); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 3rem;
            padding: 2rem;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: var(--shadow-neon);
            letter-spacing: 3px;
            animation: titleGlow 2s infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 20px var(--accent-color); }
            50% { text-shadow: 0 0 40px var(--accent-color); }
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 4px;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(0,0,0,0.3);
            border-radius: 2rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .control-label span {
            color: var(--accent-color);
            font-weight: 700;
        }

        .control-select, .control-slider {
            background: var(--control-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 0.8rem 1rem;
            border-radius: 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .control-select:hover, .control-slider:hover {
            box-shadow: var(--shadow-neon);
            border-color: var(--accent-color);
        }

        .control-slider {
            padding: 0.5rem;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .button-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
            grid-column: span 2;
        }

        .btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 100px;
            justify-content: center;
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
            transform: scale(1.05);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: var(--text-secondary);
        }

        .btn.active {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
        }

        /* Stats Panel */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(0,0,0,0.2);
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
            padding: 0.5rem;
            background: rgba(255,255,255,0.05);
            border-radius: 1rem;
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-neon);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            color: var(--text-primary);
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: var(--shadow-neon);
            line-height: 1.2;
        }

        .stat-unit {
            color: var(--accent-color);
            font-size: 0.8rem;
            margin-left: 0.2rem;
        }

        .stat-desc {
            color: var(--text-secondary);
            font-size: 0.7rem;
            margin-top: 0.2rem;
        }

        /* Complexity Panel */
        .complexity-panel {
            background: rgba(0,0,0,0.2);
            border-radius: 1.5rem;
            padding: 1rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .complexity-item {
            text-align: center;
            padding: 0.5rem 1.5rem;
            background: rgba(255,255,255,0.05);
            border-radius: 2rem;
        }

        .complexity-title {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .complexity-value {
            color: var(--accent-color);
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: var(--shadow-neon);
        }

        /* Visualization Container */
        .visualization-container {
            background: rgba(0,0,0,0.2);
            border-radius: 2rem;
            padding: 2rem 1rem;
            margin-bottom: 2rem;
            min-height: 400px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        /* Pillar Styles */
        .pillar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
            transition: all 0.2s ease;
        }

        .pillar {
            width: 100%;
            background: linear-gradient(180deg, var(--bar-default), #1E88E5);
            border-radius: 6px 6px 0 0;
            transition: height 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 15px var(--pillar-shadow);
            position: relative;
            border: 1px solid rgba(255,255,255,0.3);
            border-bottom: none;
            min-height: 4px;
        }

        .pillar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.3), transparent);
            border-radius: 6px 6px 0 0;
            pointer-events: none;
        }

        .pillar-value {
            color: var(--text-primary);
            font-size: 0.7rem;
            margin-top: 0.3rem;
            text-shadow: 0 0 5px var(--accent-color);
            font-weight: 600;
            background: rgba(0,0,0,0.3);
            padding: 0.1rem 0.3rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Pillar States */
        .pillar.comparing {
            background: linear-gradient(180deg, var(--bar-compare), #FFA500);
            box-shadow: 0 0 25px var(--bar-compare);
            transform: scale(1.02);
        }

        .pillar.swapping {
            background: linear-gradient(180deg, var(--bar-swap), #FF0000);
            box-shadow: 0 0 30px var(--bar-swap);
            transform: scale(1.05);
            animation: swapPulse 0.3s ease;
        }

        @keyframes swapPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1.05); }
        }

        .pillar.sorted {
            background: linear-gradient(180deg, var(--bar-sorted), #00CC00);
            box-shadow: 0 0 25px var(--bar-sorted);
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .legend-color.default { background: var(--bar-default); }
        .legend-color.comparing { background: var(--bar-compare); }
        .legend-color.swapping { background: var(--bar-swap); }
        .legend-color.sorted { background: var(--bar-sorted); }

        .legend-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 2rem;
            letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .title { font-size: 2rem; }
            .control-panel { grid-template-columns: 1fr; }
            .button-group { grid-column: span 1; }
            .btn { width: 100%; }
            .stat-value { font-size: 1.4rem; }
            .pillar-value { font-size: 0.6rem; }
        }

        @media (max-width: 480px) {
            .stats-panel { grid-template-columns: 1fr; }
            .complexity-panel { flex-direction: column; gap: 0.5rem; }
            .legend { gap: 1rem; }
        }
    </style>
</head>
<body>
    <!-- Particles -->
    <div id="particles"></div>

    <div class="container">
        <div class="header">
            <div class="title">BUBBLE • SORT</div>
            <div class="subtitle">VISUAL • ALGORITHM</div>
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color default"></div>
                <span class="legend-text">Default</span>
            </div>
            <div class="legend-item">
                <div class="legend-color comparing"></div>
                <span class="legend-text">Comparing</span>
            </div>
            <div class="legend-item">
                <div class="legend-color swapping"></div>
                <span class="legend-text">Swapping</span>
            </div>
            <div class="legend-item">
                <div class="legend-color sorted"></div>
                <span class="legend-text">Sorted</span>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="control-group">
                <div class="control-label">
                    ARRAY SIZE <span id="sizeValue">30</span>
                </div>
                <input type="range" class="control-slider" id="sizeSlider" min="5" max="50" value="30" step="1">
            </div>

            <div class="control-group">
                <div class="control-label">
                    SPEED <span id="speedValue">50</span>
                </div>
                <input type="range" class="control-slider" id="speedSlider" min="1" max="100" value="50" step="1">
            </div>

            <div class="button-group">
                <button class="btn" id="generateBtn">🔄 New Array</button>
                <button class="btn" id="startBtn">▶ Start</button>
                <button class="btn" id="pauseBtn" disabled>⏸️ Pause</button>
                <button class="btn" id="resumeBtn" disabled>▶ Resume</button>
                <button class="btn" id="resetBtn">⏹️ Reset</button>
            </div>
        </div>

        <!-- Stats Panel -->
        <div class="stats-panel">
            <div class="stat-item">
                <div class="stat-label">COMPARISONS</div>
                <div class="stat-value" id="comparisons">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">SWAPS</div>
                <div class="stat-value" id="swaps">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">EXECUTION TIME</div>
                <div class="stat-value" id="execTime">0<span class="stat-unit">ms</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-label">ARRAY SIZE</div>
                <div class="stat-value" id="arraySize">30</div>
            </div>
        </div>

        <!-- Complexity Panel -->
        <div class="complexity-panel">
            <div class="complexity-item">
                <div class="complexity-title">ALGORITHM</div>
                <div class="complexity-value">Bubble Sort</div>
            </div>
            <div class="complexity-item">
                <div class="complexity-title">TIME COMPLEXITY</div>
                <div class="complexity-value">O(n²)</div>
            </div>
            <div class="complexity-item">
                <div class="complexity-title">SPACE COMPLEXITY</div>
                <div class="complexity-value">O(1)</div>
            </div>
        </div>

        <!-- Visualization Area -->
        <div class="visualization-container" id="visualization"></div>

        <div class="footer">⚡ COMPARE • SWAP • SORT ⚡</div>
    </div>

    <script>
        // ========== GLOBAL VARIABLES ==========
        let array = [];
        let arraySize = 30;
        let speed = 50;
        let comparisons = 0;
        let swaps = 0;
        let startTime = 0;
        let isPaused = false;
        let isSorting = false;
        let pausePromise;
        let pauseResolve;
        let animationId;

        // DOM Elements
        const visualization = document.getElementById('visualization');
        const sizeSlider = document.getElementById('sizeSlider');
        const speedSlider = document.getElementById('speedSlider');
        const sizeValue = document.getElementById('sizeValue');
        const speedValue = document.getElementById('speedValue');
        const comparisonsEl = document.getElementById('comparisons');
        const swapsEl = document.getElementById('swaps');
        const execTimeEl = document.getElementById('execTime');
        const arraySizeEl = document.getElementById('arraySize');
        const generateBtn = document.getElementById('generateBtn');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = 10 + Math.random() * 20 + 's';
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        // ========== ARRAY GENERATION ==========
        function generateArray() {
            array = [];
            for (let i = 0; i < arraySize; i++) {
                array.push(Math.floor(Math.random() * 90) + 10); // Values between 10-99
            }
            comparisons = 0;
            swaps = 0;
            execTimeEl.textContent = '0';
            updateStats();
            renderPillars();
        }

        function renderPillars() {
            visualization.innerHTML = '';
            const maxValue = Math.max(...array);
            
            array.forEach((value, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'pillar-wrapper';
                wrapper.style.width = `${90 / arraySize}%`;
                
                const pillar = document.createElement('div');
                pillar.className = 'pillar';
                pillar.style.height = `${(value / maxValue) * 100}%`;
                pillar.setAttribute('data-index', index);
                pillar.setAttribute('data-value', value);
                
                const valueLabel = document.createElement('div');
                valueLabel.className = 'pillar-value';
                valueLabel.textContent = value;
                
                wrapper.appendChild(pillar);
                wrapper.appendChild(valueLabel);
                visualization.appendChild(wrapper);
            });
        }

        // ========== PILLAR STATE MANAGEMENT ==========
        function setPillarState(indices, state) {
            const pillars = document.querySelectorAll('.pillar');
            
            indices.forEach(index => {
                pillars[index].classList.remove('comparing', 'swapping', 'sorted');
                if (state) {
                    pillars[index].classList.add(state);
                }
            });
        }

        function markSorted(indices) {
            const pillars = document.querySelectorAll('.pillar');
            indices.forEach(index => {
                pillars[index].classList.remove('comparing', 'swapping');
                pillars[index].classList.add('sorted');
            });
        }

        function resetPillarStates() {
            const pillars = document.querySelectorAll('.pillar');
            pillars.forEach(pillar => {
                pillar.classList.remove('comparing', 'swapping', 'sorted');
            });
        }

        // ========== ANIMATION DELAY ==========
        async function delay() {
            if (isPaused) {
                await new Promise(resolve => {
                    pauseResolve = resolve;
                });
            }
            // Convert speed (1-100) to delay (200ms - 10ms)
            const delayTime = Math.max(10, 200 - (speed * 1.8));
            await new Promise(resolve => setTimeout(resolve, delayTime));
        }

        // ========== STATS UPDATE ==========
        function updateStats() {
            comparisonsEl.textContent = comparisons;
            swapsEl.textContent = swaps;
            arraySizeEl.textContent = arraySize;
        }

        // ========== BUBBLE SORT IMPLEMENTATION ==========
        async function bubbleSort() {
            const n = array.length;
            
            for (let i = 0; i < n - 1; i++) {
                for (let j = 0; j < n - i - 1; j++) {
                    if (!isSorting) return;
                    
                    // Highlight comparing elements
                    setPillarState([j, j + 1], 'comparing');
                    comparisons++;
                    updateStats();
                    await delay();

                    if (array[j] > array[j + 1]) {
                        // Swap
                        setPillarState([j, j + 1], 'swapping');
                        
                        // Perform swap
                        [array[j], array[j + 1]] = [array[j + 1], array[j]];
                        swaps++;
                        updateStats();
                        
                        // Update visualization
                        renderPillars();
                        await delay();
                    }
                    
                    // Remove comparing state
                    setPillarState([j, j + 1], null);
                }
                // Mark the last element as sorted
                markSorted([n - i - 1]);
            }
            // Mark first element as sorted
            markSorted([0]);
        }

        // ========== SORTING CONTROLS ==========
        async function startSorting() {
            if (isSorting) return;
            
            isSorting = true;
            isPaused = false;
            startTime = Date.now();
            
            // Disable controls
            disableControls(true);
            
            // Start execution timer
            const timerInterval = setInterval(() => {
                if (isSorting && !isPaused) {
                    const elapsed = Date.now() - startTime;
                    execTimeEl.textContent = elapsed;
                }
            }, 10);
            
            // Run bubble sort
            await bubbleSort();
            
            // Clean up
            clearInterval(timerInterval);
            
            if (isSorting) {
                const endTime = Date.now();
                execTimeEl.textContent = endTime - startTime;
            }
            
            isSorting = false;
            disableControls(false);
        }

        function pauseSorting() {
            if (isSorting && !isPaused) {
                isPaused = true;
                pauseBtn.disabled = true;
                resumeBtn.disabled = false;
            }
        }

        function resumeSorting() {
            if (isSorting && isPaused) {
                isPaused = false;
                pauseBtn.disabled = false;
                resumeBtn.disabled = true;
                if (pauseResolve) {
                    pauseResolve();
                    pauseResolve = null;
                }
            }
        }

        function resetSorting() {
            isSorting = false;
            isPaused = false;
            comparisons = 0;
            swaps = 0;
            execTimeEl.textContent = '0';
            updateStats();
            generateArray();
            resetPillarStates();
            disableControls(false);
            
            if (pauseResolve) {
                pauseResolve();
                pauseResolve = null;
            }
        }

        function disableControls(disable) {
            generateBtn.disabled = disable;
            startBtn.disabled = disable;
            sizeSlider.disabled = disable;
            pauseBtn.disabled = !disable;
            resumeBtn.disabled = true;
            
            if (!disable) {
                pauseBtn.disabled = true;
                resumeBtn.disabled = true;
            }
        }

        // ========== EVENT LISTENERS ==========
        sizeSlider.addEventListener('input', (e) => {
            arraySize = parseInt(e.target.value);
            sizeValue.textContent = arraySize;
            if (!isSorting) {
                generateArray();
            }
        });

        speedSlider.addEventListener('input', (e) => {
            speed = parseInt(e.target.value);
            speedValue.textContent = speed;
        });

        generateBtn.addEventListener('click', () => {
            if (!isSorting) {
                generateArray();
                resetPillarStates();
            }
        });

        startBtn.addEventListener('click', startSorting);
        pauseBtn.addEventListener('click', pauseSorting);
        resumeBtn.addEventListener('click', resumeSorting);
        resetBtn.addEventListener('click', resetSorting);

        // Window resize handling
        window.addEventListener('resize', () => {
            if (!isSorting) {
                renderPillars();
            }
        });

        // Initialize
        generateArray();
        updateStats();
    </script>
</body>
</html>
