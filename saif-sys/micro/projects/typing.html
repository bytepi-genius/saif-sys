<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYPE • SPEED TEST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Courier New', monospace;
        }

        /* Theme variables - Default Neon Blue */
        :root {
            --bg-gradient-1: #06142E;
            --bg-gradient-2: #0B2447;
            --panel-bg: rgba(10, 25, 50, 0.45);
            --text-primary: #ffffff;
            --text-secondary: #b0d4f0;
            --accent-color: #00E5FF;
            --correct-color: #00ff88;
            --wrong-color: #ff4d4d;
            --border-glow: rgba(0, 229, 255, 0.5);
            --shadow-neon: 0 0 20px #00E5FF;
            --input-bg: rgba(0, 20, 40, 0.7);
            --word-bg: rgba(255,255,255,0.05);
        }

        /* Minimal Light Theme */
        [data-theme="light"] {
            --bg-gradient-1: #E8F0F2;
            --bg-gradient-2: #B8D8E3;
            --panel-bg: rgba(255, 255, 255, 0.7);
            --text-primary: #2C3E50;
            --text-secondary: #34495E;
            --accent-color: #3498DB;
            --correct-color: #27AE60;
            --wrong-color: #E74C3C;
            --border-glow: rgba(52, 152, 219, 0.5);
            --shadow-neon: 0 0 20px #3498DB;
            --input-bg: rgba(255,255,255,0.9);
            --word-bg: rgba(44,62,80,0.05);
        }

        /* Retro Terminal Theme */
        [data-theme="retro"] {
            --bg-gradient-1: #0D0208;
            --bg-gradient-2: #1A0F1A;
            --panel-bg: rgba(0, 255, 0, 0.1);
            --text-primary: #00FF00;
            --text-secondary: #008000;
            --accent-color: #00FF00;
            --correct-color: #00FF00;
            --wrong-color: #FF0000;
            --border-glow: rgba(0, 255, 0, 0.5);
            --shadow-neon: 0 0 20px #00FF00;
            --input-bg: rgba(0, 20, 0, 0.8);
            --word-bg: rgba(0,255,0,0.1);
        }

        /* Sunset Orange Theme */
        [data-theme="sunset"] {
            --bg-gradient-1: #441E0A;
            --bg-gradient-2: #7A3E1A;
            --panel-bg: rgba(68, 30, 10, 0.7);
            --text-primary: #FFE5D0;
            --text-secondary: #FFB085;
            --accent-color: #FF8C42;
            --correct-color: #6BFF6B;
            --wrong-color: #FF6B6B;
            --border-glow: rgba(255, 140, 66, 0.5);
            --shadow-neon: 0 0 20px #FF8C42;
            --input-bg: rgba(68, 30, 10, 0.8);
            --word-bg: rgba(255,140,66,0.1);
        }

        /* Cyberpunk Purple Theme */
        [data-theme="cyber"] {
            --bg-gradient-1: #120458;
            --bg-gradient-2: #20063B;
            --panel-bg: rgba(18, 4, 88, 0.7);
            --text-primary: #FF00FF;
            --text-secondary: #B967FF;
            --accent-color: #00FFFF;
            --correct-color: #00FF9F;
            --wrong-color: #FF386D;
            --border-glow: rgba(0, 255, 255, 0.5);
            --shadow-neon: 0 0 20px #00FFFF;
            --input-bg: rgba(18, 4, 88, 0.8);
            --word-bg: rgba(255,0,255,0.1);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, var(--bg-gradient-1), var(--bg-gradient-2));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: var(--accent-color);
            border-radius: 50%;
            opacity: 0.2;
            pointer-events: none;
            animation: floatParticle 15s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(-100vh) translateX(0); opacity: 0; }
            50% { opacity: 0.3; }
            100% { transform: translateY(100vh) translateX(50px); opacity: 0; }
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 3rem;
            padding: 2rem;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: var(--shadow-neon);
            letter-spacing: 3px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 4px;
        }

        /* Theme Selection Screen */
        .theme-screen {
            text-align: center;
        }

        .theme-title {
            color: var(--text-primary);
            font-size: 2rem;
            margin-bottom: 2rem;
            text-shadow: var(--shadow-neon);
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .theme-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--accent-color);
            border-radius: 1.5rem;
            padding: 1.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-neon);
            background: rgba(255,255,255,0.1);
        }

        .theme-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .theme-name {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Mode Selection */
        .mode-selector {
            background: rgba(0,0,0,0.3);
            border-radius: 2rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .mode-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            justify-content: center;
        }

        .mode-tab {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .mode-tab.active {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
        }

        .mode-options {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .mode-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
        }

        .custom-input {
            background: var(--input-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            width: 100px;
            text-align: center;
            font-size: 1rem;
        }

        .custom-input:focus {
            outline: none;
            box-shadow: var(--shadow-neon);
        }

        /* Difficulty Selector */
        .difficulty-selector {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .difficulty-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .difficulty-btn.active {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
        }

        .start-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--accent-color);
            color: var(--text-primary);
            padding: 1rem 3rem;
            border-radius: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            font-size: 1.2rem;
            margin-top: 1rem;
        }

        .start-btn:hover {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
            transform: scale(1.05);
        }

        /* Game Screen */
        .game-screen {
            display: none;
        }

        /* Stats Panel */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(0,0,0,0.2);
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
        }

        .stat-value {
            color: var(--text-primary);
            font-size: 2rem;
            font-weight: 700;
            text-shadow: var(--shadow-neon);
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: var(--shadow-neon);
        }

        /* Words Container */
        .words-container {
            background: var(--word-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2rem;
            padding: 2rem;
            margin-bottom: 2rem;
            min-height: 150px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 1.5rem;
            line-height: 2.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            scroll-behavior: smooth;
        }

        .word {
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .word.current {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
            animation: pulse 1s infinite;
        }

        .word.correct {
            color: var(--correct-color);
            text-shadow: 0 0 10px var(--correct-color);
        }

        .word.wrong {
            color: var(--wrong-color);
            text-shadow: 0 0 10px var(--wrong-color);
            text-decoration: line-through;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .typing-input {
            flex: 1;
            background: var(--input-bg);
            border: 2px solid var(--accent-color);
            color: var(--text-primary);
            padding: 1.2rem 1.5rem;
            border-radius: 3rem;
            font-size: 1.2rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .typing-input:focus {
            box-shadow: var(--shadow-neon);
        }

        .typing-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .restart-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.2s ease;
        }

        .restart-btn:hover {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
            transform: rotate(180deg);
        }

        /* Result Screen */
        .result-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        .result-card {
            background: var(--panel-bg);
            border: 2px solid var(--accent-color);
            border-radius: 3rem;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: slideUp 0.5s ease;
        }

        .result-title {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 2rem;
            text-shadow: var(--shadow-neon);
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .result-stat {
            text-align: center;
        }

        .result-stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .result-stat-value {
            color: var(--text-primary);
            font-size: 2rem;
            font-weight: 700;
        }

        .high-score {
            color: var(--accent-color);
            font-size: 1.2rem;
            margin-bottom: 2rem;
            animation: glow 1s infinite;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 10px var(--accent-color); }
            50% { text-shadow: 0 0 30px var(--accent-color); }
            100% { text-shadow: 0 0 10px var(--accent-color); }
        }

        .result-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .result-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 1rem 2rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .result-btn:hover {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
        }

        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 600px) {
            .container { padding: 1rem; }
            .title { font-size: 2rem; }
            .stats-panel { grid-template-columns: repeat(2, 1fr); }
            .words-container { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <!-- Particles -->
    <div id="particles"></div>

    <!-- Result Screen -->
    <div id="resultScreen" class="result-screen">
        <div class="result-card">
            <div class="result-title">📊 RESULTS</div>
            <div class="result-stats">
                <div class="result-stat">
                    <div class="result-stat-label">WPM</div>
                    <div class="result-stat-value" id="finalWPM">0</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-label">ACCURACY</div>
                    <div class="result-stat-value" id="finalAccuracy">0%</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-label">CORRECT</div>
                    <div class="result-stat-value" id="finalCorrect">0</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-label">MISTAKES</div>
                    <div class="result-stat-value" id="finalMistakes">0</div>
                </div>
            </div>
            <div id="highScoreMsg" class="high-score" style="display: none;">🏆 NEW HIGH SCORE! 🏆</div>
            <div class="result-buttons">
                <button class="result-btn" onclick="restartTest()">Try Again</button>
                <button class="result-btn" onclick="backToMenu()">Main Menu</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Theme Selection Screen -->
        <div id="themeScreen" class="theme-screen">
            <div class="title">⚡ TYPE</div>
            <div class="subtitle">SPEED • TEST</div>
            
            <div class="theme-title">Choose Theme</div>
            <div class="theme-grid">
                <div class="theme-card" onclick="setTheme('neon')">
                    <div class="theme-icon">🌌</div>
                    <div class="theme-name">Neon Blue</div>
                </div>
                <div class="theme-card" onclick="setTheme('light')">
                    <div class="theme-icon">☀️</div>
                    <div class="theme-name">Minimal Light</div>
                </div>
                <div class="theme-card" onclick="setTheme('retro')">
                    <div class="theme-icon">💻</div>
                    <div class="theme-name">Retro Terminal</div>
                </div>
                <div class="theme-card" onclick="setTheme('sunset')">
                    <div class="theme-icon">🌅</div>
                    <div class="theme-name">Sunset Orange</div>
                </div>
                <div class="theme-card" onclick="setTheme('cyber')">
                    <div class="theme-icon">🤖</div>
                    <div class="theme-name">Cyberpunk</div>
                </div>
            </div>

            <!-- Mode Selection -->
            <div class="mode-selector">
                <div class="mode-tabs">
                    <button class="mode-tab active" onclick="switchMode('time')" id="timeTab">⏱️ Time</button>
                    <button class="mode-tab" onclick="switchMode('words')" id="wordsTab">📝 Words</button>
                </div>
                
                <div id="timeOptions" class="mode-options">
                    <button class="mode-btn" onclick="setTimeMode(30)">30s</button>
                    <button class="mode-btn active" onclick="setTimeMode(60)">60s</button>
                    <button class="mode-btn" onclick="setTimeMode(120)">120s</button>
                    <input type="number" class="custom-input" id="customTime" placeholder="Custom" min="10" max="300" step="10">
                </div>

                <div id="wordsOptions" class="mode-options" style="display: none;">
                    <button class="mode-btn" onclick="setWordsMode(25)">25 words</button>
                    <button class="mode-btn active" onclick="setWordsMode(50)">50 words</button>
                    <button class="mode-btn" onclick="setWordsMode(100)">100 words</button>
                </div>
            </div>

            <!-- Difficulty -->
            <div class="difficulty-selector">
                <button class="difficulty-btn" onclick="setDifficulty('easy')" id="diffEasy">🟢 Easy</button>
                <button class="difficulty-btn active" onclick="setDifficulty('medium')" id="diffMedium">🟡 Medium</button>
                <button class="difficulty-btn" onclick="setDifficulty('hard')" id="diffHard">🔴 Hard</button>
            </div>
            
            <button class="start-btn" onclick="startTest()">START TEST</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="game-screen">
            <div class="header">
                <div class="title">TYPE</div>
                <div class="subtitle">SPEED • TEST</div>
            </div>

            <!-- Stats Panel -->
            <div class="stats-panel">
                <div class="stat-item">
                    <div class="stat-label">WPM</div>
                    <div class="stat-value" id="wpm">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">CPM</div>
                    <div class="stat-value" id="cpm">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">ACCURACY</div>
                    <div class="stat-value" id="accuracy">100%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">MISTAKES</div>
                    <div class="stat-value" id="mistakes">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" id="timeLabel">TIME</div>
                    <div class="stat-value" id="time">00</div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>

            <!-- Words Container -->
            <div class="words-container" id="wordsContainer"></div>

            <!-- Input Area -->
            <div class="input-area">
                <input type="text" class="typing-input" id="typingInput" placeholder="Start typing..." autocomplete="off" disabled>
                <button class="restart-btn" onclick="restartTest()">↻</button>
            </div>

            <div class="footer">SPACE → NEXT WORD • BACKSPACE → CORRECT</div>
        </div>
    </div>

    <script>
        // ========== GLOBAL VARIABLES ==========
        let currentTheme = 'neon';
        let currentMode = 'time';
        let currentTimeMode = 60;
        let currentWordsMode = 50;
        let currentDifficulty = 'medium';
        let testActive = false;
        let timer = 0;
        let timerInterval;
        let words = [];
        let currentWordIndex = 0;
        let typedWord = '';
        let correctWords = 0;
        let wrongWords = 0;
        let totalChars = 0;
        let correctChars = 0;
        let mistakes = 0;
        let bestWPM = localStorage.getItem('bestWPM') || 0;
        let testStartTime;
        let totalTime = 60;

        // Word banks by difficulty
        const wordBanks = {
            easy: [
                'cat', 'dog', 'sun', 'car', 'book', 'house', 'tree', 'fish', 'bird', 'happy',
                'run', 'jump', 'play', 'red', 'blue', 'green', 'big', 'small', 'hot', 'cold',
                'eat', 'drink', 'sleep', 'walk', 'talk', 'see', 'hear', 'love', 'hate', 'good'
            ],
            medium: [
                'computer', 'programming', 'keyboard', 'monitor', 'internet', 'software', 'hardware',
                'network', 'database', 'algorithm', 'function', 'variable', 'constant', 'interface',
                'beautiful', 'mountain', 'ocean', 'forest', 'desert', 'island', 'journey', 'adventure',
                'language', 'culture', 'history', 'science', 'nature', 'universe', 'galaxy', 'planet'
            ],
            hard: [
                'incomprehensible', 'simultaneously', 'extraordinary', 'communication', 'revolutionary',
                'sophisticated', 'infrastructure', 'acknowledgment', 'accommodation', 'entrepreneur',
                'philosophical', 'psychological', 'mathematical', 'representative', 'understanding',
                'accomplishment', 'disappointment', 'misunderstanding', 'qualification', 'recommendation'
            ]
        };

        // Particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = 10 + Math.random() * 20 + 's';
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        // ========== THEME SYSTEM ==========
        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
        }

        // ========== MODE SWITCHING ==========
        function switchMode(mode) {
            currentMode = mode;
            
            document.getElementById('timeTab').classList.remove('active');
            document.getElementById('wordsTab').classList.remove('active');
            
            if (mode === 'time') {
                document.getElementById('timeTab').classList.add('active');
                document.getElementById('timeOptions').style.display = 'flex';
                document.getElementById('wordsOptions').style.display = 'none';
                document.getElementById('timeLabel').textContent = 'TIME';
            } else {
                document.getElementById('wordsTab').classList.add('active');
                document.getElementById('wordsOptions').style.display = 'flex';
                document.getElementById('timeOptions').style.display = 'none';
                document.getElementById('timeLabel').textContent = 'LEFT';
            }
        }

        function setTimeMode(seconds) {
            currentTimeMode = seconds;
            document.querySelectorAll('#timeOptions .mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('customTime').value = '';
        }

        function setWordsMode(count) {
            currentWordsMode = count;
            document.querySelectorAll('#wordsOptions .mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function setDifficulty(difficulty) {
            currentDifficulty = difficulty;
            document.getElementById('diffEasy').classList.remove('active');
            document.getElementById('diffMedium').classList.remove('active');
            document.getElementById('diffHard').classList.remove('active');
            document.getElementById('diff' + difficulty.charAt(0).toUpperCase() + difficulty.slice(1)).classList.add('active');
        }

        // ========== GAME INITIALIZATION ==========
        function startTest() {
            document.getElementById('themeScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            
            // Check custom time
            const customTime = document.getElementById('customTime').value;
            if (customTime && currentMode === 'time') {
                currentTimeMode = parseInt(customTime);
            }
            
            generateWords();
            resetTest();
            
            // Focus input
            setTimeout(() => {
                document.getElementById('typingInput').focus();
            }, 100);
        }

        function generateWords() {
            const wordBank = wordBanks[currentDifficulty];
            const wordCount = currentMode === 'words' ? currentWordsMode : 100;
            
            words = [];
            for (let i = 0; i < wordCount; i++) {
                words.push(wordBank[Math.floor(Math.random() * wordBank.length)]);
            }
            
            displayWords();
        }

        function displayWords() {
            const container = document.getElementById('wordsContainer');
            container.innerHTML = words.map((word, index) => 
                `<span class="word ${index === currentWordIndex ? 'current' : ''}" data-index="${index}">${word}</span>`
            ).join('');
        }

        function resetTest() {
            testActive = true;
            currentWordIndex = 0;
            typedWord = '';
            correctWords = 0;
            wrongWords = 0;
            totalChars = 0;
            correctChars = 0;
            mistakes = 0;
            timer = 0;
            totalTime = currentMode === 'time' ? currentTimeMode : currentWordsMode * 2; // Estimate time
            
            updateStats();
            displayWords();
            
            document.getElementById('typingInput').disabled = false;
            document.getElementById('typingInput').value = '';
            document.getElementById('progress').style.width = '0%';
            
            testStartTime = Date.now();
            
            if (currentMode === 'time') {
                startTimer();
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (!testActive) return;
                
                if (currentMode === 'time') {
                    const elapsed = Math.floor((Date.now() - testStartTime) / 1000);
                    timer = elapsed;
                    document.getElementById('time').textContent = timer;
                    
                    // Update progress
                    const progress = (timer / totalTime) * 100;
                    document.getElementById('progress').style.width = progress + '%';
                    
                    if (timer >= totalTime) {
                        endTest();
                    }
                } else {
                    // Words mode - show remaining time estimate
                    const elapsed = Math.floor((Date.now() - testStartTime) / 1000);
                    const remaining = Math.max(0, totalTime - elapsed);
                    document.getElementById('time').textContent = remaining;
                    
                    if (currentWordIndex >= words.length) {
                        endTest();
                    }
                }
                
                updateWPM();
            }, 100);
        }

        // ========== TYPING LOGIC ==========
        document.getElementById('typingInput').addEventListener('input', (e) => {
            if (!testActive) return;
            
            typedWord = e.target.value;
            
            // Check if space pressed (word completed)
            if (typedWord.endsWith(' ')) {
                const word = typedWord.trim();
                if (word) {
                    checkWord(word);
                }
                e.target.value = '';
                typedWord = '';
            }
        });

        document.getElementById('typingInput').addEventListener('keydown', (e) => {
            if (e.key === ' ' && !typedWord) {
                e.preventDefault(); // Prevent space at beginning
            }
            
            if (e.key === 'Backspace') {
                // Handle backspace normally
            }
        });

        function checkWord(word) {
            const currentWord = words[currentWordIndex];
            const wordElement = document.querySelector(`[data-index="${currentWordIndex}"]`);
            
            // Check if correct
            if (word === currentWord) {
                wordElement.classList.add('correct');
                correctWords++;
                correctChars += currentWord.length;
            } else {
                wordElement.classList.add('wrong');
                wrongWords++;
                mistakes++;
                
                // Count wrong characters
                for (let i = 0; i < Math.min(word.length, currentWord.length); i++) {
                    if (word[i] !== currentWord[i]) {
                        mistakes++;
                    }
                }
                // Extra characters
                if (word.length > currentWord.length) {
                    mistakes += (word.length - currentWord.length);
                }
            }
            
            totalChars += currentWord.length;
            
            // Move to next word
            currentWordIndex++;
            
            if (currentWordIndex >= words.length) {
                if (currentMode === 'words') {
                    endTest();
                } else {
                    // Generate more words for time mode
                    const wordBank = wordBanks[currentDifficulty];
                    for (let i = 0; i < 20; i++) {
                        words.push(wordBank[Math.floor(Math.random() * wordBank.length)]);
                    }
                }
            }
            
            // Update display
            displayWords();
            updateStats();
            
            // Scroll to current word
            const currentElement = document.querySelector(`[data-index="${currentWordIndex}"]`);
            if (currentElement) {
                currentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // ========== STATS UPDATES ==========
        function updateStats() {
            updateWPM();
            
            const cpm = correctChars * (60 / Math.max(1, timer));
            document.getElementById('cpm').textContent = Math.round(cpm);
            
            const accuracy = totalChars > 0 ? ((correctChars / totalChars) * 100).toFixed(1) : 100;
            document.getElementById('accuracy').textContent = accuracy + '%';
            
            document.getElementById('mistakes').textContent = mistakes;
        }

        function updateWPM() {
            const minutes = Math.max(0.1, timer / 60);
            const wpm = Math.round(correctWords / minutes);
            document.getElementById('wpm').textContent = wpm;
        }

        // ========== TEST END ==========
        function endTest() {
            testActive = false;
            clearInterval(timerInterval);
            document.getElementById('typingInput').disabled = true;
            
            const wpm = parseInt(document.getElementById('wpm').textContent);
            const accuracy = document.getElementById('accuracy').textContent;
            const correct = correctWords;
            const mistakeCount = mistakes;
            
            // Update result screen
            document.getElementById('finalWPM').textContent = wpm;
            document.getElementById('finalAccuracy').textContent = accuracy;
            document.getElementById('finalCorrect').textContent = correct;
            document.getElementById('finalMistakes').textContent = mistakeCount;
            
            // Check high score
            if (wpm > bestWPM) {
                bestWPM = wpm;
                localStorage.setItem('bestWPM', bestWPM);
                document.getElementById('highScoreMsg').style.display = 'block';
            } else {
                document.getElementById('highScoreMsg').style.display = 'none';
            }
            
            document.getElementById('resultScreen').style.display = 'flex';
        }

        // ========== CONTROL FUNCTIONS ==========
        function restartTest() {
            document.getElementById('resultScreen').style.display = 'none';
            resetTest();
        }

        function backToMenu() {
            clearInterval(timerInterval);
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('themeScreen').style.display = 'block';
        }

        // Prevent copy paste
        document.addEventListener('copy', (e) => e.preventDefault());
        document.addEventListener('paste', (e) => e.preventDefault());
        document.addEventListener('cut', (e) => e.preventDefault());

        // Initialize
        setTheme('neon');
    </script>
</body>
</html>
