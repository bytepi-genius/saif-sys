<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excuse Generator Pro 😂 · meme edition</title>
  <!-- Google Fonts + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Fredoka', 'Inter', sans-serif;
    }

    /* vibrant gradient background (purple → pink) */
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #A78BFA, #EC4899, #FBBF24);
      background-size: 300% 300%;
      animation: gradientShift 8s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* glassmorphism card */
    .glass-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 40px;
      box-shadow: 0 30px 60px -15px rgba(0,0,0,0.4);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 800px;
      transition: transform 0.3s;
    }

    .glass-card:hover {
      transform: scale(1.02) translateY(-5px);
      box-shadow: 0 40px 80px -10px #EC4899;
    }

    /* header */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 3.2rem;
      font-weight: 800;
      color: white;
      text-shadow: 0 4px 12px rgba(0,0,0,0.3);
      letter-spacing: -0.5px;
    }

    .header h1 i {
      font-size: 3rem;
      margin: 0 0.5rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-10px); }
    }

    .header p {
      color: rgba(255,255,255,0.9);
      font-size: 1.3rem;
      font-weight: 500;
    }

    /* category tabs */
    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 2rem;
    }

    .cat-btn {
      background: rgba(255,255,255,0.3);
      border: 2px solid white;
      padding: 0.8rem 1.5rem;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .cat-btn i {
      font-size: 1.4rem;
    }

    .cat-btn:hover {
      background: white;
      color: #A78BFA;
      transform: scale(1.05) rotate(-1deg);
    }

    .cat-btn.active {
      background: white;
      color: #A78BFA;
      box-shadow: 0 0 0 5px rgba(255,255,255,0.5);
    }

    /* mode toggles */
    .mode-toggles {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .mode-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0,0,0,0.2);
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      color: white;
      font-weight: 600;
    }

    .mode-item input {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    /* generate button */
    .gen-btn {
      width: 100%;
      background: linear-gradient(145deg, #F59E0B, #EF4444);
      border: none;
      padding: 2rem 1rem;
      border-radius: 80px;
      font-size: 2.5rem;
      font-weight: 800;
      color: white;
      text-shadow: 0 2px 12px black;
      box-shadow: 0 20px 40px #dc2626;
      cursor: pointer;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      transition: 0.2s;
    }

    .gen-btn i {
      font-size: 3rem;
      animation: wiggle 1s infinite;
    }

    @keyframes wiggle {
      0%,100%{ transform: rotate(0deg); }
      25%{ transform: rotate(10deg); }
      75%{ transform: rotate(-10deg); }
    }

    .gen-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 30px 50px #b91c1c;
    }

    .gen-btn:active {
      transform: scale(0.97);
    }

    /* result card */
    .result-card {
      background: rgba(255,255,255,0.25);
      border-radius: 50px;
      padding: 2.5rem 2rem;
      text-align: center;
      border: 2px solid white;
      margin-bottom: 1.5rem;
    }

    .excuse-text {
      font-size: 2.2rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 8px black;
      margin-bottom: 1rem;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    .excute-emoji {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    /* action buttons */
    .action-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .action-btn {
      background: white;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1.2rem;
      color: #1e293b;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      transition: 0.2s;
    }

    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px black;
    }

    /* history log */
    .history-log {
      background: rgba(0,0,0,0.15);
      border-radius: 30px;
      padding: 1rem;
      margin-top: 2rem;
    }

    .history-log h3 {
      color: white;
      margin-bottom: 0.5rem;
    }

    #historyList {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .history-item {
      background: rgba(255,255,255,0.3);
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-size: 0.9rem;
      color: white;
    }

    /* confetti canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    /* responsive */
    @media (max-width: 600px) {
      .glass-card { padding: 1.5rem; }
      .header h1 { font-size: 2.3rem; }
      .gen-btn { font-size: 1.8rem; padding: 1.5rem; }
      .excuse-text { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="header">
      <h1>
        <i class="fas fa-face-smile"></i> 
        Excuse Generator Pro 
        <i class="fas fa-face-savory"></i>
      </h1>
      <p>Blame it on anything 😂</p>
    </div>

    <!-- category tabs -->
    <div class="category-tabs" id="categoryTabs">
      <div class="cat-btn active" data-cat="school"><i class="fas fa-graduation-cap"></i> School</div>
      <div class="cat-btn" data-cat="office"><i class="fas fa-briefcase"></i> Office</div>
      <div class="cat-btn" data-cat="gym"><i class="fas fa-dumbbell"></i> Gym</div>
      <div class="cat-btn" data-cat="family"><i class="fas fa-family"></i> Family</div>
      <div class="cat-btn" data-cat="random"><i class="fas fa-dice"></i> Random</div>
    </div>

    <!-- mode toggles -->
    <div class="mode-toggles">
      <div class="mode-item">
        <label for="seriousMode">😐 Serious Mode</label>
        <input type="checkbox" id="seriousMode">
      </div>
      <div class="mode-item">
        <label for="savageMode">🔥 Savage Mode</label>
        <input type="checkbox" id="savageMode">
      </div>
    </div>

    <!-- big generate button -->
    <button class="gen-btn" id="generateBtn">
      <i class="fas fa-dice"></i> GENERATE EXCUSE <i class="fas fa-face-laugh-squint"></i>
    </button>

    <!-- result display -->
    <div class="result-card" id="resultCard">
      <div class="excute-emoji" id="excuseEmoji">🤔</div>
      <div class="excuse-text" id="excuseText">Click generate for a lame excuse</div>
    </div>

    <!-- action buttons -->
    <div class="action-buttons">
      <button class="action-btn" id="copyBtn"><i class="fas fa-copy"></i> Copy</button>
      <button class="action-btn" id="shareBtn"><i class="fas fa-share-alt"></i> Share</button>
      <button class="action-btn" id="favoriteBtn"><i class="fas fa-heart"></i> Favorite</button>
    </div>

    <!-- history log -->
    <div class="history-log">
      <h3><i class="fas fa-clock-rotate-left"></i> Excuse history</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- confetti canvas -->
  <canvas id="confetti-canvas"></canvas>

  <script>
    (function() {
      // ---------- EXCUSE DATABASE ----------
      const excuses = {
        school: [
          "My dog ate my homework... and then ate my backup copy.",
          "I accidentally joined the wrong Zoom meeting for 3 hours.",
          "My WiFi went into meditation mode.",
          "Aliens abducted my textbook.",
          "I was busy binge-watching 'How to Study' tutorials.",
          "My pen ran out of ink and I took it as a sign.",
          "I thought 'homework' meant work done at home, so I did nothing.",
          "My cat walked across the keyboard and deleted my essay."
        ],
        office: [
          "My internet provider had a 'spiritual awakening'.",
          "I was in a very important meeting... with my pillow.",
          "My coffee machine unionized and went on strike.",
          "I accidentally joined a different company's Zoom and nobody noticed.",
          "My computer updated and forgot who I was.",
          "I had to attend my pet rock's funeral.",
          "My email is in a parallel universe.",
          "My focus is on backorder."
        ],
        gym: [
          "My gains needed a rest day... from existing.",
          "I'm on a carb-loading diet that never ends.",
          "The gym was closed due to a gravitational wave.",
          "My workout playlist is still downloading.",
          "I pulled a muscle while flexing in the mirror.",
          "I'm saving my energy for the apocalypse.",
          "My protein shake hasn't arrived yet.",
          "I'm in peak condition... for sitting on the couch."
        ],
        family: [
          "I was busy folding laundry into tiny origami animals.",
          "My goldfish needed emotional support.",
          "I had to supervise the cat's Zoom call.",
          "I was trapped under a heavy blanket.",
          "My family started a gossip session and I couldn't escape.",
          "I accidentally joined a family reunion 3000 miles away.",
          "I had to explain memes to my grandma for 6 hours.",
          "The wifi password changed and I took it personally."
        ]
      };

      // savage mode extras (overrides)
      const savageExtras = [
        "Because I don't care, that's why.",
        "Your face made me forget.",
        "I was busy being awesome.",
        "I was on a date with your mom.",
        "I overslept because your voice is my lullaby.",
        "My motivation went on vacation and left no forwarding address."
      ];

      // ---------- STATE ----------
      let currentCategory = 'school';
      let lastExcuse = '';
      let history = JSON.parse(localStorage.getItem('excuseHistory')) || [];
      let favorites = JSON.parse(localStorage.getItem('excuseFavorites')) || [];
      let seriousMode = false;
      let savageMode = false;

      // DOM elements
      const catBtns = document.querySelectorAll('.cat-btn');
      const generateBtn = document.getElementById('generateBtn');
      const excuseText = document.getElementById('excuseText');
      const excuseEmoji = document.getElementById('excuseEmoji');
      const seriousCheck = document.getElementById('seriousMode');
      const savageCheck = document.getElementById('savageMode');
      const copyBtn = document.getElementById('copyBtn');
      const shareBtn = document.getElementById('shareBtn');
      const favoriteBtn = document.getElementById('favoriteBtn');
      const historyList = document.getElementById('historyList');
      const confettiCanvas = document.getElementById('confetti-canvas');
      const ctx = confettiCanvas.getContext('2d');

      // ---------- confetti ----------
      let particles = [];
      let confettiActive = false;

      function startConfetti() {
        confettiActive = true;
        particles = [];
        for (let i = 0; i < 60; i++) {
          particles.push({
            x: Math.random() * confettiCanvas.width,
            y: Math.random() * confettiCanvas.height * 0.5,
            size: Math.random() * 8 + 4,
            speedY: Math.random() * 5 + 2,
            color: `hsl(${Math.random() * 360}, 80%, 60%)`
          });
        }
        drawConfetti();
      }

      function drawConfetti() {
        if (!confettiActive) return;
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        particles.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          p.y += p.speedY;
          if (p.y > confettiCanvas.height) p.y = 0;
        });
        requestAnimationFrame(drawConfetti);
      }

      function stopConfetti() {
        confettiActive = false;
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }

      // ---------- get random excuse ----------
      function getRandomExcuse() {
        let pool = [];
        if (currentCategory === 'random') {
          const all = [...excuses.school, ...excuses.office, ...excuses.gym, ...excuses.family];
          pool = all;
        } else {
          pool = excuses[currentCategory] || excuses.school;
        }

        // savage mode adds savage extras
        if (savageMode) {
          pool = [...pool, ...savageExtras];
        }

        // serious mode: use less funny version (just prefix with "Seriously:")
        let excuse = pool[Math.floor(Math.random() * pool.length)];
        while (excuse === lastExcuse && pool.length > 1) {
          excuse = pool[Math.floor(Math.random() * pool.length)];
        }

        if (seriousMode) {
          excuse = "Seriously: " + excuse.replace(/[!\.]/, '') + " (professional excuse).";
        }

        lastExcuse = excuse;
        return excuse;
      }

      // ---------- render with typewriter ----------
      function typeWriter(text, element, speed = 30) {
        let i = 0;
        element.innerHTML = '';
        function write() {
          if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(write, speed);
          }
        }
        write();
      }

      // ---------- update result ----------
      function generateExcuse() {
        // shake effect on button
        generateBtn.style.transform = 'scale(0.95)';
        setTimeout(() => generateBtn.style.transform = '', 150);

        // random emoji
        const emojis = ['😂','🤣','😭','😅','😱','🤪','😈','💀','👻','🤡'];
        excuseEmoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];

        const excuse = getRandomExcuse();

        // typewriter effect
        typeWriter(excuse, excuseText, 25);

        // add to history
        history.unshift(excuse);
        if (history.length > 8) history.pop();
        localStorage.setItem('excuseHistory', JSON.stringify(history));
        renderHistory();

        // confetti on dramatic excuses (random)
        if (Math.random() > 0.5) {
          startConfetti();
          setTimeout(stopConfetti, 1500);
        }
      }

      // ---------- render history ----------
      function renderHistory() {
        let html = '';
        history.forEach(h => {
          html += `<span class="history-item">${h.substring(0,20)}…</span>`;
        });
        historyList.innerHTML = html;
      }

      // ---------- copy to clipboard ----------
      function copyExcuse() {
        const text = excuseText.innerText;
        navigator.clipboard.writeText(text).then(() => {
          alert('Copied to clipboard!');
        });
      }

      // ---------- share (web share) ----------
      function shareExcuse() {
        const text = excuseText.innerText;
        if (navigator.share) {
          navigator.share({ title: 'Excuse Generator', text: text });
        } else {
          alert('Share not supported, copied instead: ' + text);
          copyExcuse();
        }
      }

      // ---------- favorite ----------
      function toggleFavorite() {
        const current = excuseText.innerText;
        if (favorites.includes(current)) {
          favorites = favorites.filter(f => f !== current);
          alert('Removed from favorites');
        } else {
          favorites.push(current);
          alert('Added to favorites');
        }
        localStorage.setItem('excuseFavorites', JSON.stringify(favorites));
      }

      // ---------- event listeners ----------
      catBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          catBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.cat;
        });
      });

      generateBtn.addEventListener('click', generateExcuse);
      copyBtn.addEventListener('click', copyExcuse);
      shareBtn.addEventListener('click', shareExcuse);
      favoriteBtn.addEventListener('click', toggleFavorite);

      seriousCheck.addEventListener('change', (e) => seriousMode = e.target.checked);
      savageCheck.addEventListener('change', (e) => savageMode = e.target.checked);

      // resize canvas
      window.addEventListener('resize', () => {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
      });
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;

      // initial history render
      renderHistory();
    })();
  </script>
</body>
</html>
