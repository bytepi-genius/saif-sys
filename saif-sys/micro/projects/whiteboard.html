<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WHITEBOARD • PRO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-gradient-1: #141E30;
            --bg-gradient-2: #243B55;
            --toolbar-bg: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-color: #00E5FF;
            --border-glow: rgba(0, 229, 255, 0.5);
            --shadow-neon: 0 0 20px #00E5FF;
            --toolbar-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            --transition-speed: 0.3s;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, var(--bg-gradient-1), var(--bg-gradient-2));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
            animation: gradientMove 15s ease infinite;
            background-size: 400% 400%;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--toolbar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--card-bg);
            border-radius: 3rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tool-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            color: var(--text-primary);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            position: relative;
        }

        .tool-btn:hover {
            transform: translateY(-2px) scale(1.1);
            border-color: var(--accent-color);
            box-shadow: var(--shadow-neon);
        }

        .tool-btn.active {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            border-color: var(--accent-color);
        }

        .tool-btn.active:hover {
            transform: translateY(-2px) scale(1.1);
            box-shadow: var(--shadow-neon);
        }

        .color-picker-wrapper {
            position: relative;
            width: 45px;
            height: 45px;
        }

        .color-picker {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--accent-color);
            background: transparent;
            padding: 2px;
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(255,255,255,0.1);
            padding: 0.5rem 1.2rem;
            border-radius: 3rem;
        }

        .slider-icon {
            color: var(--accent-color);
            font-size: 1rem;
        }

        .brush-slider {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            outline: none;
        }

        .brush-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            border: 2px solid white;
        }

        .brush-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: var(--shadow-neon);
        }

        .brush-value {
            color: var(--text-primary);
            font-size: 0.9rem;
            min-width: 35px;
            text-align: center;
        }

        /* Canvas Container */
        .canvas-container {
            position: relative;
            width: 100%;
            background: white;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2);
            aspect-ratio: 16/9;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: white;
            cursor: crosshair;
            touch-action: none; /* Prevent scrolling while drawing */
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            background: var(--card-bg);
            border-radius: 3rem;
            backdrop-filter: blur(10px);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .status-info {
            display: flex;
            gap: 1.5rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Footer */
        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .title { font-size: 1.8rem; }
            .toolbar { border-radius: 2rem; }
            .tool-group { justify-content: center; }
            .slider-container { width: 100%; }
            .brush-slider { width: 100%; }
            .status-bar { flex-direction: column; gap: 0.5rem; }
            .status-info { flex-wrap: wrap; justify-content: center; }
        }

        @media (max-width: 480px) {
            .tool-btn { width: 40px; height: 40px; font-size: 1rem; }
            .color-picker-wrapper { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">DIGITAL WHITEBOARD</div>
            <div class="subtitle">DRAW • CREATE • INNOVATE</div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <!-- Color Picker -->
            <div class="tool-group">
                <div class="color-picker-wrapper">
                    <input type="color" class="color-picker" id="colorPicker" value="#00E5FF">
                </div>
            </div>

            <!-- Brush Size -->
            <div class="tool-group">
                <div class="slider-container">
                    <span class="slider-icon">🖌️</span>
                    <input type="range" class="brush-slider" id="brushSlider" min="1" max="50" value="5">
                    <span class="brush-value" id="brushValue">5</span>
                </div>
            </div>

            <!-- Tools -->
            <div class="tool-group">
                <button class="tool-btn" id="eraserBtn" title="Eraser">
                    <span>🧽</span>
                </button>
                <button class="tool-btn" id="clearBtn" title="Clear Canvas">
                    <span>🗑️</span>
                </button>
                <button class="tool-btn" id="saveBtn" title="Save as PNG">
                    <span>💾</span>
                </button>
                <button class="tool-btn" id="undoBtn" title="Undo">
                    <span>↩</span>
                </button>
                <button class="tool-btn" id="redoBtn" title="Redo">
                    <span>↪</span>
                </button>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-info">
                <div class="status-item">
                    <span class="status-dot"></span>
                    <span>Drawing Mode</span>
                </div>
                <div class="status-item">
                    <span>🎨</span>
                    <span id="currentColor">#00E5FF</span>
                </div>
                <div class="status-item">
                    <span>📏</span>
                    <span id="currentSize">5px</span>
                </div>
            </div>
            <div class="status-info">
                <div class="status-item">
                    <span>↩</span>
                    <span id="undoCount">0</span>
                </div>
                <div class="status-item">
                    <span>↪</span>
                    <span id="redoCount">0</span>
                </div>
            </div>
        </div>

        <div class="footer">
            ✨ Draw with mouse or finger • Supports undo/redo • Save your artwork
        </div>
    </div>

    <script>
        // ========== GLOBAL VARIABLES ==========
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Drawing state
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentColor = '#00E5FF';
        let currentSize = 5;
        let isEraser = false;
        
        // History for undo/redo
        let history = [];
        let historyIndex = -1;
        const MAX_HISTORY = 50;

        // DOM Elements
        const colorPicker = document.getElementById('colorPicker');
        const brushSlider = document.getElementById('brushSlider');
        const brushValue = document.getElementById('brushValue');
        const eraserBtn = document.getElementById('eraserBtn');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const currentColorEl = document.getElementById('currentColor');
        const currentSizeEl = document.getElementById('currentSize');
        const undoCount = document.getElementById('undoCount');
        const redoCount = document.getElementById('redoCount');

        // ========== INITIALIZATION ==========
        function initCanvas() {
            // Set canvas dimensions for Retina displays
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            // Initial canvas settings
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Save initial state
            saveState();
        }

        // Handle resize
        window.addEventListener('resize', () => {
            // Save current drawing
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // Resize canvas
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            // Restore settings
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.putImageData(imageData, 0, 0);
        });

        // ========== DRAWING FUNCTIONS ==========
        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            
            const pos = getCoordinates(e);
            lastX = pos.x;
            lastY = pos.y;
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
        }

        function draw(e) {
            e.preventDefault();
            if (!isDrawing) return;
            
            const pos = getCoordinates(e);
            const currentX = pos.x;
            const currentY = pos.y;
            
            // Set drawing style
            ctx.strokeStyle = isEraser ? '#ffffff' : currentColor;
            ctx.lineWidth = currentSize;
            
            // Draw line
            ctx.lineTo(currentX, currentY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(currentX, currentY);
            
            lastX = currentX;
            lastY = currentY;
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                saveState();
            }
        }

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX, clientY;
            
            if (e.touches) {
                // Touch event
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                // Mouse event
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            
            return { x, y };
        }

        // ========== TOOL FUNCTIONS ==========
        function changeColor() {
            currentColor = colorPicker.value;
            isEraser = false;
            updateActiveTools();
            currentColorEl.textContent = currentColor;
        }

        function changeBrushSize() {
            currentSize = parseInt(brushSlider.value);
            brushValue.textContent = currentSize;
            currentSizeEl.textContent = currentSize + 'px';
        }

        function toggleEraser() {
            isEraser = !isEraser;
            updateActiveTools();
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveState();
        }

        function saveCanvas() {
            // Create download link
            const link = document.createElement('a');
            link.download = `whiteboard-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // ========== UNDO/REDO FUNCTIONS ==========
        function saveState() {
            // Remove any future states if we're not at the end
            if (historyIndex < history.length - 1) {
                history = history.slice(0, historyIndex + 1);
            }
            
            // Save current state
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            history.push(imageData);
            historyIndex++;
            
            // Limit history size
            if (history.length > MAX_HISTORY) {
                history.shift();
                historyIndex--;
            }
            
            updateHistoryCounters();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                ctx.putImageData(history[historyIndex], 0, 0);
            }
            updateHistoryCounters();
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                ctx.putImageData(history[historyIndex], 0, 0);
            }
            updateHistoryCounters();
        }

        function updateHistoryCounters() {
            undoCount.textContent = historyIndex;
            redoCount.textContent = history.length - historyIndex - 1;
        }

        function updateActiveTools() {
            eraserBtn.classList.toggle('active', isEraser);
        }

        // ========== EVENT LISTENERS ==========
        // Mouse events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        // Touch events
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);

        // Tool events
        colorPicker.addEventListener('input', changeColor);
        brushSlider.addEventListener('input', changeBrushSize);
        eraserBtn.addEventListener('click', toggleEraser);
        clearBtn.addEventListener('click', clearCanvas);
        saveBtn.addEventListener('click', saveCanvas);
        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        // Prevent context menu on canvas
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') {
                    e.preventDefault();
                    undo();
                }
                if (e.key === 'y') {
                    e.preventDefault();
                    redo();
                }
            }
            
            if (e.key === 'Delete') {
                clearCanvas();
            }
        });

        // Initialize canvas
        initCanvas();

        // Save initial state
        setTimeout(() => {
            saveState();
        }, 100);
    </script>
</body>
</html>
