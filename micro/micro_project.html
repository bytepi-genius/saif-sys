    /* ---------------------------------------------
      CSS VARIABLES – premium dark + neon palette
    --------------------------------------------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg-dark: #06142E;
      --bg-light: #0B2447;
      --neon-blue: #4FC3F7;
      --bright-cyan: #00E5FF;
      --card-bg: rgba(10, 25, 50, 0.4);
      --glass-border: rgba(79, 195, 247, 0.2);
      --border-glow: rgba(79, 195, 247, 0.6);
      --text-primary: #eef5ff;
      --text-secondary: #b0d4f0;
      --shadow-neon: 0 8px 32px rgba(0, 229, 255, 0.2);
      --transition-smooth: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    body {
      background: linear-gradient(145deg, var(--bg-dark), var(--bg-light));
      min-height: 100vh;
      color: var(--text-primary);
      overflow-x: hidden;
      position: relative;
      scroll-behavior: smooth;
    }

    /* ---------- floating particles & mouse glow ---------- */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .mouse-glow {
      position: fixed;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle at center, rgba(0, 229, 255, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: screen;
      transition: opacity 0.2s;
      filter: blur(30px);
    }

    /* ---------- loading animation (disappears after load) ---------- */
    #loader-wrapper {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    .loader-hidden {
      opacity: 0;
      visibility: hidden;
    }
    .counter-loader {
      font-size: 4rem;
      font-weight: 800;
      color: transparent;
      -webkit-text-stroke: 2px var(--bright-cyan);
      text-shadow: 0 0 20px var(--neon-blue);
      animation: pulseGlow 1.2s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px var(--neon-blue); }
      100% { text-shadow: 0 0 40px var(--bright-cyan), 0 0 60px #0088ff; }
    }

    /* ---------- main wrapper ---------- */
    .site-wrapper {
      position: relative;
      z-index: 5;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem 4rem;
    }

    /* ---------- sticky navbar ---------- */
    .navbar {
      position: sticky;
      top: 1rem;
      z-index: 100;
      backdrop-filter: blur(16px) saturate(180%);
      background: rgba(6, 20, 46, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 60px;
      padding: 0.8rem 2rem;
      margin-bottom: 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.7), 0 0 0 1px rgba(79,195,247,0.2) inset;
    }
    .logo {
      font-weight: 600;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff, var(--bright-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.3rem;
    }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.95rem;
      transition: var(--transition-smooth);
      border-bottom: 1px solid transparent;
    }
    .nav-links a:hover {
      color: var(--bright-cyan);
      border-bottom-color: var(--bright-cyan);
    }

    /* ---------- hero section ---------- */
    .hero {
      text-align: center;
      margin: 3rem 0 4rem;
      position: relative;
    }
    .hero h1 {
      font-size: clamp(2.8rem, 10vw, 5.2rem);
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, var(--bright-cyan), #a0e7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px var(--neon-blue);
      margin-bottom: 0.5rem;
      animation: textFloat 3s infinite alternate ease-in-out;
    }
    @keyframes textFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
    .hero .sub {
      font-size: 1.4rem;
      color: var(--text-secondary);
      letter-spacing: 2px;
      display: inline-block;
      position: relative;
    }
    .underline-glow {
      width: 180px;
      height: 4px;
      background: var(--bright-cyan);
      margin: 1.2rem auto 0;
      border-radius: 4px;
      filter: drop-shadow(0 0 12px var(--neon-blue));
      position: relative;
      overflow: hidden;
    }
    .underline-glow::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, white, transparent);
      animation: shimmer 2.5s infinite;
    }
    @keyframes shimmer { 100% { left: 100%; } }

    /* ---------- filter section ---------- */
    .filter-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      margin: 2rem 0 3rem;
    }
    .search-bar {
      flex: 2 1 260px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      padding: 0.7rem 1.5rem;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .search-bar i {
      color: var(--neon-blue);
      margin-right: 12px;
      font-size: 1.2rem;
    }
    .search-bar input {
      background: transparent;
      border: none;
      width: 100%;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    .search-bar input::placeholder {
      color: rgba(255,255,255,0.4);
      font-weight: 300;
    }
    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: var(--transition-smooth);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--neon-blue);
      border-color: var(--bright-cyan);
      color: #06142E;
      box-shadow: 0 0 20px var(--neon-blue);
      transform: scale(1.05);
    }

    /* ---------- projects grid (glassmorphism cards) ---------- */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      margin: 2rem 0 4rem;
      opacity: 1;
    }
    .project-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 1.8rem 1.4rem 1.8rem;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5), 0 0 0 1px rgba(79,195,247,0.2) inset;
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
      transform-style: preserve-3d;
      will-change: transform;
      opacity: 0;
      animation: fadeSlideUp 0.5s forwards;
      animation-delay: calc(0.02s * var(--i, 0));
    }
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .project-card:hover {
      border-color: var(--neon-blue);
      box-shadow: 0 0 28px var(--border-glow), 0 20px 40px -10px black;
      transform: translateY(-8px) scale(1.02) rotateX(2deg) rotateY(1deg);
      background: rgba(15, 35, 65, 0.6);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1rem;
    }
    .category-badge {
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid rgba(79,195,247,0.6);
      color: var(--bright-cyan);
      padding: 0.25rem 1rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .project-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0.6rem 0 0.4rem;
      background: linear-gradient(to bottom, #fff, #d0ecff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .project-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.2rem;
      flex: 1;
    }
    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.6rem;
      margin: 1rem 0 1.2rem;
    }
    .tech-tag {
      background: rgba(79,195,247,0.08);
      border: 1px solid rgba(79,195,247,0.3);
      border-radius: 20px;
      padding: 0.2rem 0.8rem;
      font-size: 0.7rem;
      font-weight: 500;
      color: #b2e6ff;
    }
    .view-btn {
      background: transparent;
      border: 1.5px solid var(--neon-blue);
      color: var(--neon-blue);
      text-decoration: none;
      padding: 0.7rem 0;
      border-radius: 40px;
      font-weight: 600;
      text-align: center;
      transition: var(--transition-smooth);
      margin-top: 0.5rem;
      box-shadow: 0 0 8px rgba(79,195,247,0.3);
      display: inline-block;
      width: 100%;
    }
    .view-btn:hover {
      background: var(--neon-blue);
      color: #06142E;
      box-shadow: 0 0 30px var(--neon-blue);
      border-color: var(--bright-cyan);
      transform: scale(1.02);
    }

    /* ---------- back to top ---------- */
    .back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--neon-blue);
      color: var(--bright-cyan);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      transition: var(--transition-smooth);
      opacity: 0;
      visibility: hidden;
      z-index: 99;
      box-shadow: 0 0 20px rgba(0,229,255,0.3);
    }
    .back-to-top.show {
      opacity: 1;
      visibility: visible;
    }
    .back-to-top:hover {
      background: var(--neon-blue);
      color: #06142E;
      transform: scale(1.15) rotate(360deg);
    }

    /* ---------- responsive ---------- */
    @media (max-width: 700px) {
      .filter-section { flex-direction: column; align-items: stretch; }
      .navbar { flex-direction: column; gap: 0.7rem; }
      .nav-links a { margin: 0 1rem; }
      .projects-grid { grid-template-columns: 1fr; }
    }
    /* floating shapes */
    .shape {
      position: fixed;
      background: rgba(79,195,247,0.03);
      border-radius: 50%;
      filter: blur(40px);
      z-index: 1;
      pointer-events: none;
    }
  </style>

      // ---------------------------------------------
      // 2. RENDER PROJECTS
      // ---------------------------------------------
      const grid = document.getElementById('projectsGrid');
      const searchInput = document.getElementById('searchInput');
      const filterButtons = document.querySelectorAll('.filter-btn');

      function renderProjects(filterCategory = 'all', searchTerm = '') {
        const filtered = projects.filter(p => {
          const matchesCat = filterCategory === 'all' || p.category === filterCategory;
          const matchesSearch = p.title.toLowerCase().includes(searchTerm) || p.desc.toLowerCase().includes(searchTerm) || p.tags.some(t => t.toLowerCase().includes(searchTerm));
          return matchesCat && matchesSearch;
        });

        grid.innerHTML = filtered.map((p, idx) => `
          <div class="project-card" style="--i: ${idx}" data-category="${p.category}">
            <div class="card-header">
              <span class="category-badge">${p.category}</span>
              <i class="fas fa-arrow-right" style="color: var(--neon-blue);"></i>
            </div>
            <h3 class="project-title">${p.title}</h3>
            <p class="project-desc">${p.desc}</p>
            <div class="tech-tags">
              ${p.tags.map(t => `<span class="tech-tag">${t}</span>`).join('')}
            </div>
                <a href="${p.link || '#'}" class="view-btn">view project →</a>          </div>
        `).join('');
      }

      // initial render
      renderProjects();

      // ---------------------------------------------
      // 3. FILTER & SEARCH HANDLING
      // ---------------------------------------------
      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          filterButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const cat = btn.dataset.category;
          renderProjects(cat, searchInput.value.toLowerCase().trim());
        });
      });

      searchInput.addEventListener('input', (e) => {
        const activeCat = document.querySelector('.filter-btn.active').dataset.category;
        renderProjects(activeCat, e.target.value.toLowerCase().trim());
      });

      // 4. BACK TO TOP
      // ---------------------------------------------
      const backBtn = document.getElementById('backToTop');

        else backBtn.classList.remove('show');

      // 5. MOUSE GLOW
      // ---------------------------------------------
      const glow = document.getElementById('mouseGlow');
      document.addEventListener('mousemove', (e) => {
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
      });

      // ---------------------------------------------
      // 6. LOADER (simulate loading)
      // ---------------------------------------------
      window.addEventListener('load', () => {
        const loader = document.getElementById('loader-wrapper');
        loader.classList.add('loader-hidden');
        setTimeout(() => loader.style.display = 'none', 700);
      });

      // ---------------------------------------------
      // 7. PARTICLES (smooth floating)
      // ---------------------------------------------
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];

      function initParticles() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        particles = [];
        for (let i = 0; i < 60; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 3 + 1.5,
            speedX: (Math.random() - 0.5) * 0.5,
            speedY: (Math.random() - 0.5) * 0.5,
            color: `rgba(79, 195, 247, ${Math.random() * 0.4 + 0.2})`
          });
        }
      }

      function drawParticles() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowColor = '#00E5FF';
          ctx.shadowBlur = 12;
          ctx.fill();
          
          p.x += p.speedX;
          p.y += p.speedY;
          
          if (p.x < 0 || p.x > width) p.speedX *= -1;
          if (p.y < 0 || p.y > height) p.speedY *= -1;
        });
        requestAnimationFrame(drawParticles);
      }

      window.addEventListener('resize', () => {
        initParticles();
      });
      initParticles();
      drawParticles();

      // ---------------------------------------------
      // 8. CARD TILT (subtle on hover) – via css already + extra vanilla? we keep css
      // ---------------------------------------------
      // already handled in .project-card:hover transform

      // ---------------------------------------------
      // 9. SMOOTH SCROLL REVEAL (cards already fade on load)
      // ---------------------------------------------

      // Extra: floating shape animation not necessary
    })();
  </script>

  <!-- small style addition for tilt & stagger smoothness -->
  <style>
    /* extra smoothness */
    .project-card {
      transition: transform 0.25s ease-out, box-shadow 0.3s, border-color 0.2s, background 0.2s;
    }
    .filter-btn, .view-btn, .back-to-top {
      transition: all 0.2s ease;
    }
    /* animated gradient text (already on hero) */
    .hero h1 {
      background-size: 200% 200%;
      animation: gradientShift 6s infinite alternate, textFloat 3s infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    /* prevent flicker */
    .mouse-glow { will-change: left, top; }
  </style>
</body>
