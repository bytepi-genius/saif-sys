<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Analyzer · cybersecurity SaaS</title>
  <!-- Google Fonts + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE (dark theme, cyber accents) ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'IBM Plex Sans', 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b1120, #1e1a3a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* glassmorphism card */
    .glass-card {
      background: rgba(18, 25, 45, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 40px;
      box-shadow: 0 30px 60px -15px #0f0f2f, 0 0 0 1px #6366f120;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 650px;
      transition: box-shadow 0.3s;
    }

    .glass-card:hover {
      box-shadow: 0 40px 80px -12px #3b82f660, 0 0 0 2px #6366f140;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .header i {
      font-size: 3rem;
      color: #6366f1;
      filter: drop-shadow(0 0 12px #6366f1);
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* password input area */
    .input-group {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.03);
      border: 2px solid #334155;
      border-radius: 60px;
      padding: 0.2rem 0.2rem 0.2rem 1.8rem;
      margin-bottom: 1.8rem;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .input-group:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 20px #6366f180;
    }

    .input-group input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 1.2rem 0.5rem;
      font-size: 1.3rem;
      color: white;
      outline: none;
    }

    .input-group button {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
    }

    .input-group button:hover {
      color: #818cf8;
      background: rgba(255,255,255,0.05);
    }

    /* strength meter */
    .meter-section {
      margin: 2rem 0;
    }

    .strength-labels {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .meter-bar {
      height: 16px;
      background: #1e293b;
      border-radius: 30px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 30px;
      transition: width 0.4s, background 0.2s;
    }

    .strength-text {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 1.2rem;
      font-weight: 600;
    }

    /* criteria checklist */
    .criteria-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 2rem 0;
      background: rgba(0,0,0,0.2);
      padding: 1.5rem;
      border-radius: 30px;
    }

    .criterion {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: #cbd5e1;
      font-size: 1rem;
    }

    .criterion i {
      width: 24px;
      font-size: 1.2rem;
    }

    .valid { color: #22c55e; }
    .invalid { color: #ef4444; }

    /* feedback panel */
    .feedback-panel {
      background: rgba(0,0,0,0.3);
      border-radius: 30px;
      padding: 1.5rem;
      margin: 2rem 0;
      border-left: 6px solid #6366f1;
    }

    .feedback-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #a5b4fc;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .feedback-text {
      color: #e2e8f0;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .crack-time {
      background: #1e293b;
      padding: 0.5rem 1.5rem;
      border-radius: 60px;
      display: inline-block;
      margin-top: 1rem;
      font-weight: 600;
    }

    /* generator section */
    .generator {
      background: rgba(0,0,0,0.2);
      border-radius: 30px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }

    .generator h3 {
      color: #e2e8f0;
      margin-bottom: 1rem;
    }

    .gen-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .gen-controls input[type="range"] {
      flex: 1;
      min-width: 150px;
    }

    .gen-password {
      background: #1e293b;
      padding: 1rem 1.5rem;
      border-radius: 60px;
      color: #94a3f8;
      font-family: monospace;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

    .gen-password button {
      background: transparent;
      border: none;
      color: #818cf8;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .btn-primary {
      background: #4f46e5;
      border: none;
      color: white;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 18px #4f46e5;
    }

    .btn-primary:hover {
      background: #6366f1;
      transform: scale(1.02);
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #1e293b;
      color: white;
      padding: 1rem 2rem;
      border-radius: 60px;
      box-shadow: 0 10px 30px black;
      transform: translateY(200%);
      transition: transform 0.3s;
      z-index: 1000;
    }

    .toast.show { transform: translateY(0); }

    /* responsive */
    @media (max-width: 500px) {
      .glass-card { padding: 1.5rem; }
      .criteria-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="header">
      <i class="fas fa-shield-halved"></i>
      <div>
        <h1>Password Analyzer</h1>
        <p>Real-time security audit & generator</p>
      </div>
    </div>

    <!-- password input -->
    <div class="input-group" id="inputGroup">
      <input type="password" id="passwordInput" placeholder="Enter password..." autocomplete="off">
      <button id="toggleVisibility"><i class="fas fa-eye"></i></button>
      <button id="clearBtn"><i class="fas fa-times-circle"></i></button>
    </div>

    <!-- strength meter -->
    <div class="meter-section">
      <div class="strength-labels">
        <span>Very weak</span>
        <span>Weak</span>
        <span>Medium</span>
        <span>Strong</span>
        <span>Very strong</span>
      </div>
      <div class="meter-bar">
        <div class="meter-fill" id="strengthMeter" style="width: 0%; background: #ef4444;"></div>
      </div>
      <div class="strength-text" id="strengthText">
        <i class="fas fa-shield" id="strengthIcon"></i>
        <span id="strengthLabel">No password</span>
      </div>
    </div>

    <!-- live criteria checklist -->
    <div class="criteria-grid" id="criteriaList">
      <!-- filled by js -->
    </div>

    <!-- feedback & suggestions panel -->
    <div class="feedback-panel" id="feedbackPanel">
      <div class="feedback-title"><i class="fas fa-lightbulb"></i> Security feedback</div>
      <div class="feedback-text" id="feedbackText">Enter a password to get started.</div>
      <div class="crack-time" id="crackTime">⏱️ Estimated crack time: —</div>
    </div>

    <!-- password generator -->
    <div class="generator">
      <h3><i class="fas fa-key"></i> Strong password generator</h3>
      <div class="gen-controls">
        <label>Length: <span id="lengthVal">12</span></label>
        <input type="range" id="lengthSlider" min="6" max="24" value="12">
      </div>
      <div class="gen-controls">
        <label><input type="checkbox" id="includeUpper" checked> A-Z</label>
        <label><input type="checkbox" id="includeLower" checked> a-z</label>
        <label><input type="checkbox" id="includeNumbers" checked> 0-9</label>
        <label><input type="checkbox" id="includeSymbols" checked> !@#</label>
      </div>
      <button class="btn-primary" id="generateBtn"><i class="fas fa-bolt"></i> Generate secure password</button>
      <div class="gen-password" id="genPasswordDisplay">
        <span id="generatedPassword">P@ssw0rd!23</span>
        <button id="copyGenBtn"><i class="fas fa-copy"></i></button>
      </div>
    </div>
  </div>

  <!-- toast -->
  <div class="toast" id="toast">Password copied</div>

  <script>
    (function() {
      // ---------- DOM elements ----------
      const passwordInput = document.getElementById('passwordInput');
      const toggleVis = document.getElementById('toggleVisibility');
      const clearBtn = document.getElementById('clearBtn');
      const strengthMeter = document.getElementById('strengthMeter');
      const strengthLabel = document.getElementById('strengthLabel');
      const strengthIcon = document.getElementById('strengthIcon');
      const criteriaList = document.getElementById('criteriaList');
      const feedbackText = document.getElementById('feedbackText');
      const crackTimeSpan = document.getElementById('crackTime');
      const lengthSlider = document.getElementById('lengthSlider');
      const lengthVal = document.getElementById('lengthVal');
      const includeUpper = document.getElementById('includeUpper');
      const includeLower = document.getElementById('includeLower');
      const includeNumbers = document.getElementById('includeNumbers');
      const includeSymbols = document.getElementById('includeSymbols');
      const generateBtn = document.getElementById('generateBtn');
      const generatedPasswordSpan = document.getElementById('generatedPassword');
      const copyGenBtn = document.getElementById('copyGenBtn');
      const toast = document.getElementById('toast');

      // ---------- common password list (simplified) ----------
      const commonPasswords = ['password', '123456', 'qwerty', 'abc123', 'password123', 'admin', 'letmein', 'welcome', 'monkey', '123456789'];

      // ---------- render criteria checklist ----------
      const criteriaConfig = [
        { id: 'length', label: 'At least 8 characters', check: (pwd) => pwd.length >= 8 },
        { id: 'upper', label: 'Contains uppercase letter', check: (pwd) => /[A-Z]/.test(pwd) },
        { id: 'lower', label: 'Contains lowercase letter', check: (pwd) => /[a-z]/.test(pwd) },
        { id: 'number', label: 'Contains number', check: (pwd) => /[0-9]/.test(pwd) },
        { id: 'special', label: 'Contains special character', check: (pwd) => /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pwd) },
        { id: 'common', label: 'Not a common password', check: (pwd) => !commonPasswords.includes(pwd.toLowerCase()) }
      ];

      function renderCriteria(password) {
        let html = '';
        criteriaConfig.forEach(c => {
          const valid = c.check(password);
          html += `<div class="criterion"><i class="fas ${valid ? 'fa-check-circle valid' : 'fa-times-circle invalid'}"></i> ${c.label}</div>`;
        });
        criteriaList.innerHTML = html;
      }

      // ---------- strength calculation (0-5) ----------
      function calculateStrength(password) {
        if (!password) return 0;
        let score = 0;
        // length
        if (password.length >= 8) score++;
        if (password.length >= 12) score++;
        // uppercase
        if (/[A-Z]/.test(password)) score++;
        // lowercase
        if (/[a-z]/.test(password)) score++;
        // number
        if (/[0-9]/.test(password)) score++;
        // special
        if (/[^A-Za-z0-9]/.test(password)) score++;
        // avoid common
        if (!commonPasswords.includes(password.toLowerCase())) score++;
        return Math.min(score, 5);
      }

      // ---------- update strength meter, label, feedback ----------
      function analyzePassword() {
        const pwd = passwordInput.value;
        renderCriteria(pwd);

        const strength = calculateStrength(pwd);
        let percent = (strength / 5) * 100;
        strengthMeter.style.width = percent + '%';

        // set color and label
        let color = '#ef4444'; // very weak
        let label = 'Very Weak';
        let icon = 'fa-shield-halved';
        if (strength === 1) { color = '#f97316'; label = 'Weak'; }
        else if (strength === 2) { color = '#facc15'; label = 'Medium'; }
        else if (strength === 3) { color = '#3b82f6'; label = 'Strong'; }
        else if (strength >= 4) { color = '#22c55e'; label = 'Very Strong'; }

        strengthMeter.style.background = color;
        strengthLabel.innerText = pwd ? label : 'No password';
        strengthIcon.style.color = color;

        // feedback text
        if (!pwd) {
          feedbackText.innerText = 'Enter a password to analyze.';
          crackTimeSpan.innerText = '⏱️ Estimated crack time: —';
          return;
        }

        // generate suggestions
        let suggestions = [];
        if (pwd.length < 8) suggestions.push('Add at least 8 characters (longer is better).');
        if (!/[A-Z]/.test(pwd)) suggestions.push('Include uppercase letters.');
        if (!/[a-z]/.test(pwd)) suggestions.push('Include lowercase letters.');
        if (!/[0-9]/.test(pwd)) suggestions.push('Add numbers.');
        if (!/[^A-Za-z0-9]/.test(pwd)) suggestions.push('Use special characters (!@#...).');
        if (commonPasswords.includes(pwd.toLowerCase())) suggestions.push('This password is too common. Choose something unique.');
        if (/(.)\1{2,}/.test(pwd)) suggestions.push('Avoid repeated characters (e.g., "aaa").');
        if (/123|abc|qwerty|asdf/.test(pwd)) suggestions.push('Avoid sequential patterns (123, abc).');

        if (suggestions.length === 0) suggestions.push('Excellent! This password is strong.');

        feedbackText.innerText = suggestions.join(' ');

        // crack time estimate (very simplified)
        let crackTime = 'instant';
        if (strength === 0) crackTime = 'instant';
        else if (strength === 1) crackTime = 'seconds';
        else if (strength === 2) crackTime = 'minutes';
        else if (strength === 3) crackTime = 'days';
        else if (strength === 4) crackTime = 'years';
        else if (strength === 5) crackTime = 'centuries';
        crackTimeSpan.innerText = `⏱️ Estimated crack time: ${crackTime}`;
      }

      // ---------- password generator ----------
      function generatePassword() {
        const length = parseInt(lengthSlider.value);
        let chars = '';
        if (includeUpper.checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        if (includeLower.checked) chars += 'abcdefghijklmnopqrstuvwxyz';
        if (includeNumbers.checked) chars += '0123456789';
        if (includeSymbols.checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

        if (chars === '') {
          alert('Select at least one character type');
          return;
        }

        let password = '';
        for (let i = 0; i < length; i++) {
          const rand = Math.floor(Math.random() * chars.length);
          password += chars[rand];
        }
        generatedPasswordSpan.innerText = password;
      }

      // ---------- copy to clipboard ----------
      function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2000);
        });
      }

      // ---------- event listeners ----------
      passwordInput.addEventListener('input', analyzePassword);

      toggleVis.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        toggleVis.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
      });

      clearBtn.addEventListener('click', () => {
        passwordInput.value = '';
        analyzePassword();
      });

      lengthSlider.addEventListener('input', () => {
        lengthVal.innerText = lengthSlider.value;
      });

      generateBtn.addEventListener('click', generatePassword);

      copyGenBtn.addEventListener('click', () => {
        copyToClipboard(generatedPasswordSpan.innerText);
      });

      // initial render
      analyzePassword();
      generatePassword();
    })();
  </script>
</body>
</html>
