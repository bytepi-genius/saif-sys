<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Expense Tracker · Fintech UI</title>
  <!-- Google Fonts & Chart.js -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* RESET & BASE — modern, smooth */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Poppins', sans-serif;
    }

    /* custom scrollbar (glass-like) */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 20px; }
    ::-webkit-scrollbar-thumb { background: rgba(100,180,255,0.3); border-radius: 20px; backdrop-filter: blur(4px); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(70,150,255,0.6); }

    /* light & dark theme variables — default dark (premium navy->blue) */
    :root {
      --bg-gradient: linear-gradient(145deg, #0b1120 0%, #153b6f 100%);
      --card-bg: rgba(18, 28, 45, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: rgba(220, 240, 255, 0.8);
      --shadow-color: rgba(0, 30, 60, 0.5);
      --income: #2acf8b;
      --expense: #ff5f7c;
      --accent-blue: #3b82f6;
      --accent-teal: #38b2ac;
      --input-bg: rgba(255,255,255,0.05);
      --border-light: rgba(255,255,255,0.1);
      --hover-scale: 1.02;
      --chart-bg: rgba(0,0,0,0.2);
    }

    body.light {
      --bg-gradient: linear-gradient(145deg, #eef2f6 0%, #cddff7 100%);
      --card-bg: rgba(255, 255, 255, 0.5);
      --glass-border: rgba(0, 30, 60, 0.1);
      --text-primary: #0b1e33;
      --text-secondary: #1e3a5f;
      --shadow-color: rgba(0, 30, 60, 0.1);
      --input-bg: rgba(255,255,255,0.8);
      --border-light: rgba(0,0,0,0.1);
      --chart-bg: rgba(255,255,255,0.3);
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background 0.3s ease, color 0.2s;
      backdrop-filter: blur(2px);
      line-height: 1.5;
      padding: 1rem;
    }

    .app-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    /* glassmorphism cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 20px 35px -8px var(--shadow-color), 0 0 0 1px rgba(255,255,255,0.02) inset;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }

    .glass-card:hover {
      transform: translateY(-4px) scale(var(--hover-scale));
      box-shadow: 0 30px 45px -12px rgba(0, 40, 80, 0.6);
    }

    /* STICKY HEADER */
    header {
      position: sticky;
      top: 1rem;
      z-index: 10;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 60px;
      box-shadow: 0 15px 30px -12px #00000050;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo-icon {
      background: linear-gradient(130deg, #3b82f6, #2dd4bf);
      width: 48px; height: 48px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
      box-shadow: 0 8px 18px #3b82f650;
    }
    .title h1 {
      font-weight: 600;
      font-size: 1.9rem;
      letter-spacing: -0.5px;
    }
    .title p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .theme-toggle {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      padding: 0.5rem 1rem;
      display: flex;
      gap: 0.5rem;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }
    .theme-toggle span { font-size: 1.2rem; }

    /* dashboard summary cards */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.8rem;
      margin: 1rem 0 0.5rem;
    }

    .stat-card {
      padding: 1.8rem 1.5rem;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .stat-left h3 {
      font-size: 1rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }
    .stat-number {
      font-size: 2.7rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .stat-icon {
      font-size: 2.8rem;
      opacity: 0.8;
      color: var(--accent-teal);
    }

    /* floating add button (mobile) + hidden checkbox trick */
    .fab-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 20;
    }
    .fab {
      width: 64px; height: 64px;
      background: linear-gradient(145deg, #2563eb, #0891b2);
      border-radius: 40px;
      box-shadow: 0 15px 25px #0b1120aa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .fab:hover { transform: scale(1.1) rotate(90deg); }

    /* form row */
    .form-card {
      padding: 2rem 2rem;
      border-radius: 28px;
    }
    .form-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    .input-field {
      flex: 1 1 160px;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .input-field label {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-left: 0.5rem;
    }
    .input-field input, .input-field select {
      background: var(--input-bg);
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 0.8rem 1.4rem;
      color: var(--text-primary);
      font-size: 1rem;
      backdrop-filter: blur(4px);
      outline: none;
      transition: 0.2s;
    }
    .input-field input:focus, .input-field select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px #3b82f630;
    }
    .btn-add {
      background: linear-gradient(130deg, #2563eb, #2d9cdb);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.9rem 2.4rem;
      border-radius: 40px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 8px 18px #1e3a8a60;
      transition: 0.15s;
      position: relative;
      overflow: hidden;
    }
    .btn-add:active { transform: scale(0.96); }
    .btn-add::after {
      content: '';
      position: absolute;
      width: 100%; height: 100%;
      top: 0; left: 0;
      background: radial-gradient(circle at center, white 10%, transparent 80%);
      opacity: 0; transition: 0.3s;
    }
    .btn-add:active::after { opacity: 0.5; transform: scale(2); }

    /* error message */
    .error-msg {
      color: #ff8a8a;
      background: rgba(255, 70, 70, 0.2);
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      font-size: 0.9rem;
      backdrop-filter: blur(4px);
      display: inline-block;
      margin-top: 0.5rem;
      border: 1px solid #ff5f7f60;
    }

    /* transaction history */
    .history-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0 1.5rem;
    }
    .filters {
      display: flex;
      gap: 0.8rem;
    }
    .filter-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-secondary);
    }
    .filter-btn.active {
      background: var(--accent-blue);
      color: white;
      border-color: transparent;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border-radius: 40px;
      padding: 0.2rem 0.2rem 0.2rem 1.5rem;
      border: 1px solid var(--border-light);
    }
    .search-box i { opacity: 0.6; }
    .search-box input {
      background: transparent;
      border: none;
      padding: 0.6rem 1rem;
      color: var(--text-primary);
      outline: none;
    }

    /* transaction list */
    .transaction-list {
      list-style: none;
      margin: 1.5rem 0 0;
    }
    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.8rem;
      margin: 0.5rem 0;
      border-radius: 60px;
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(4px);
      border: 1px solid var(--glass-border);
      transition: 0.2s;
      animation: slideUp 0.3s ease;
    }
    .tx-item:hover { background: rgba(255,255,255,0.08); }
    .tx-info { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
    .tx-title { font-weight: 500; }
    .tx-date { font-size: 0.8rem; opacity: 0.6; }
    .tx-amount {
      font-weight: 700;
      margin-left: auto;
      margin-right: 1.5rem;
    }
    .income-text { color: var(--income); }
    .expense-text { color: var(--expense); }
    .delete-btn {
      background: transparent;
      border: none;
      color: #ff8a9f;
      font-size: 1.3rem;
      cursor: pointer;
      transition: 0.15s;
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .delete-btn:hover {
      background: #ff5f7f30;
      color: #ff5f7f;
      transform: scale(1.1);
    }

    /* charts row */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8rem;
    }
    .chart-card {
      padding: 1.5rem;
      border-radius: 28px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
    }
    .chart-card canvas {
      max-height: 260px;
      width: 100% !important;
      background: var(--chart-bg);
      border-radius: 20px;
      padding: 0.5rem;
    }

    /* clear data button & loading */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .clear-btn {
      background: rgba(255, 100, 100, 0.2);
      border: 1px solid #ff5f7f;
      padding: 0.6rem 2rem;
      border-radius: 30px;
      color: #ffaeae;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .clear-btn:hover { background: #ff5f7f40; }

    .loading-skeleton {
      text-align: center;
      padding: 3rem;
      font-size: 1.5rem;
    }
    .hidden { display: none !important; }

    /* animations */
    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .fade-slide {
      animation: slideUp 0.6s cubic-bezier(0.2, 0.9, 0.1, 1) both;
    }

    /* responsiveness */
    @media (max-width: 700px) {
      .charts-row { grid-template-columns: 1fr; }
      .form-grid { flex-direction: column; align-items: stretch; }
      .btn-add { width: 100%; }
      header { border-radius: 30px; }
      .stat-number { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="app-wrapper" id="app">
    <!-- sticky header -->
    <header class="fade-slide">
      <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-chart-pie"></i></div>
        <div class="title">
          <h1>Smart Expense Tracker</h1>
          <p>fintech · glass · realtime</p>
        </div>
      </div>
      <div class="theme-toggle" id="themeToggle">
        <span>🌙</span><span>☀️</span>
      </div>
    </header>

    <!-- dashboard cards -->
    <div class="stats-row fade-slide">
      <div class="stat-card glass-card" id="totalBalanceCard"><div class="stat-left"><h3>Total balance</h3><span class="stat-number" id="totalBalance">0</span></div><i class="fas fa-wallet stat-icon"></i></div>
      <div class="stat-card glass-card" id="totalIncomeCard"><div class="stat-left"><h3>Income</h3><span class="stat-number" id="totalIncome">0</span></div><i class="fas fa-circle-up stat-icon" style="color:#2acf8b"></i></div>
      <div class="stat-card glass-card" id="totalExpenseCard"><div class="stat-left"><h3>Expenses</h3><span class="stat-number" id="totalExpense">0</span></div><i class="fas fa-circle-down stat-icon" style="color:#ff5f7c"></i></div>
    </div>

    <!-- add transaction form -->
    <div class="glass-card form-card fade-slide">
      <div class="form-grid" id="transactionForm">
        <div class="input-field"><label>Title</label><input type="text" id="titleInput" placeholder="e.g. Salary"></div>
        <div class="input-field"><label>Amount (₹)</label><input type="number" id="amountInput" placeholder="0.00"></div>
        <div class="input-field"><label>Type</label><select id="typeSelect"><option value="income">Income</option><option value="expense">Expense</option></select></div>
        <div class="input-field"><label>Date</label><input type="date" id="dateInput"></div>
        <button class="btn-add" id="addBtn"><i class="fas fa-plus" style="margin-right:8px;"></i>Add</button>
      </div>
      <div id="formError" class="error-msg hidden"></div>
    </div>

    <!-- transaction history + filter & search -->
    <div class="glass-card form-card fade-slide" style="padding: 1.8rem;">
      <div class="history-header">
        <div class="filters" id="filterGroup">
          <span class="filter-btn active" data-filter="all">All</span>
          <span class="filter-btn" data-filter="income">Income</span>
          <span class="filter-btn" data-filter="expense">Expense</span>
        </div>
        <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search transaction"></div>
      </div>
      <div id="transactionContainer">
        <ul class="transaction-list" id="transactionList"></ul>
      </div>
      <div class="action-bar"><span></span><button class="clear-btn" id="clearAllBtn"><i class="fas fa-trash-alt"></i> Clear all data</button></div>
    </div>

    <!-- charts row -->
    <div class="charts-row fade-slide">
      <div class="chart-card glass-card"><canvas id="pieChart"></canvas></div>
      <div class="chart-card glass-card"><canvas id="barChart"></canvas></div>
    </div>

    <!-- floating action button (duplicate add trigger) -->
    <div class="fab-container"><div class="fab" id="fabBtn"><i class="fas fa-plus"></i></div></div>
  </div>

  <!-- loading overlay removed, we use skeleton but just hide content initially?  we'll simulate smooth loading -->
  <script>
    (function() {
      // ----- DATA & STATE -----
      let transactions = [];
      let currentFilter = 'all';
      let searchTerm = '';

      // DOM elements
      const totalBalanceEl = document.getElementById('totalBalance');
      const totalIncomeEl = document.getElementById('totalIncome');
      const totalExpenseEl = document.getElementById('totalExpense');
      const transactionListEl = document.getElementById('transactionList');
      const titleInp = document.getElementById('titleInput');
      const amountInp = document.getElementById('amountInput');
      const typeSel = document.getElementById('typeSelect');
      const dateInp = document.getElementById('dateInput');
      const addBtn = document.getElementById('addBtn');
      const fabBtn = document.getElementById('fabBtn');
      const errorDiv = document.getElementById('formError');
      const filterBtns = document.querySelectorAll('.filter-btn');
      const searchInp = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearAllBtn');
      const themeToggle = document.getElementById('themeToggle');

      // chart instances
      let pieChart, barChart;

      // ---- LocalStorage helpers ----
      function loadFromStorage() {
        const stored = localStorage.getItem('transactions');
        if (stored) {
          try { transactions = JSON.parse(stored); } catch(e){ transactions = []; }
        } else transactions = [];
        applyFilterAndRender();
      }
      function saveToStorage() {
        localStorage.setItem('transactions', JSON.stringify(transactions));
      }

      // numbers animation (simple)
      function animateNumber(el, target) {
        let start = parseFloat(el.innerText.replace('₹','') || 0);
        const duration = 400;
        const stepTime = 15;
        const steps = duration / stepTime;
        const increment = (target - start) / steps;
        let step = 0;
        const interval = setInterval(() => {
          step++;
          start += increment;
          el.innerText = '₹' + start.toFixed(2);
          if (step >= steps) { el.innerText = '₹' + target.toFixed(2); clearInterval(interval); }
        }, stepTime);
      }

      // update summary cards
      function updateSummary() {
        const income = transactions.filter(t=>t.type==='income').reduce((acc,t)=>acc+Number(t.amount),0);
        const expense = transactions.filter(t=>t.type==='expense').reduce((acc,t)=>acc+Number(t.amount),0);
        const balance = income - expense;
        animateNumber(totalBalanceEl, balance);
        animateNumber(totalIncomeEl, income);
        animateNumber(totalExpenseEl, expense);
      }

      // render transaction list based on filter & search
      function renderList() {
        let filtered = transactions.filter(t => {
          if (currentFilter !== 'all' && t.type !== currentFilter) return false;
          if (searchTerm && !t.title.toLowerCase().includes(searchTerm.toLowerCase())) return false;
          return true;
        });
        if (filtered.length===0) { transactionListEl.innerHTML = `<li class="tx-item" style="justify-content:center;">No transactions</li>`; return; }
        let html = '';
        filtered.forEach((t, idx) => {
          const sign = t.type==='income' ? '+' : '-';
          const cls = t.type==='income' ? 'income-text' : 'expense-text';
          html += `<li class="tx-item" data-index="₹{transactions.indexOf(t)}">
            <div class="tx-info"><span class="tx-title">₹{t.title}</span><span class="tx-date">${t.date || 'no date'}</span></div>
            <span class="tx-amount ₹{cls}">₹{sign}₹{Number(t.amount).toFixed(2)}</span>
            <button class="delete-btn" data-index="₹{transactions.indexOf(t)}"><i class="fas fa-times-circle"></i></button>
          </li>`;
        });
        transactionListEl.innerHTML = html;
        // attach delete events
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = btn.getAttribute('data-index');
            if (idx!==null) {
              transactions.splice(idx,1);
              saveToStorage();
              applyFilterAndRender();
              updateCharts();
            }
          });
        });
      }

      // refresh: filter+search+summary+charts
      function applyFilterAndRender() {
        renderList();
        updateSummary();
        updateCharts();
      }

      // validation
      function validateForm() {
        if (!titleInp.value.trim() || !amountInp.value || !dateInp.value) return 'All fields required';
        if (Number(amountInp.value) <= 0) return 'Amount must be positive';
        return null;
      }

      function addTransaction() {
        const err = validateForm();
        if (err) { errorDiv.innerText = err; errorDiv.classList.remove('hidden'); return; }
        errorDiv.classList.add('hidden');
        const newTx = {
          title: titleInp.value.trim(),
          amount: Number(amountInp.value).toFixed(2),
          type: typeSel.value,
          date: dateInp.value
        };
        transactions.push(newTx);
        saveToStorage();
        applyFilterAndRender();
        updateCharts();
        titleInp.value = ''; amountInp.value = ''; dateInp.value = '';
      }

      // ----- CHARTS (pie+bar) -----
      function updateCharts() {
        const incomeTotal = transactions.filter(t=>t.type==='income').reduce((a,b)=>a+Number(b.amount),0);
        const expenseTotal = transactions.filter(t=>t.type==='expense').reduce((a,b)=>a+Number(b.amount),0);
        if (pieChart) pieChart.destroy();
        const pieCtx = document.getElementById('pieChart').getContext('2d');
        pieChart = new Chart(pieCtx, {
          type: 'doughnut',
          data: { labels: ['Income', 'Expense'], datasets: [{ data: [incomeTotal, expenseTotal], backgroundColor: ['#2acf8b', '#ff5f7c'], borderRadius: 10 }] },
          options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#fff' } } } }
        });

        // monthly bar chart (last 6 months simplified)
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const monthlyIncome = Array(12).fill(0);
        const monthlyExpense = Array(12).fill(0);
        transactions.forEach(t => {
          if (t.date) {
            const m = new Date(t.date).getMonth();
            if (t.type==='income') monthlyIncome[m] += Number(t.amount);
            else monthlyExpense[m] += Number(t.amount);
          }
        });
        if (barChart) barChart.destroy();
        const barCtx = document.getElementById('barChart').getContext('2d');
        barChart = new Chart(barCtx, {
          type: 'bar',
          data: {
            labels: months.slice(0,6), // just half for clarity
            datasets: [
              { label: 'Income', data: monthlyIncome.slice(0,6), backgroundColor: '#2acf8b', borderRadius: 8 },
              { label: 'Expense', data: monthlyExpense.slice(0,6), backgroundColor: '#ff5f7c', borderRadius: 8 }
            ]
          },
          options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } } }
        });
      }

      // filter & search events
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          renderList();
        });
      });
      searchInp.addEventListener('input', (e) => { searchTerm = e.target.value; renderList(); });

      // clear all
      clearBtn.addEventListener('click', () => {
        if (confirm('Delete all transactions?')) { transactions = []; saveToStorage(); applyFilterAndRender(); }
      });

      // theme toggle
      themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light');
      });

      // add events
      addBtn.addEventListener('click', addTransaction);
      fabBtn.addEventListener('click', addTransaction);

      // initial load & charts
      loadFromStorage();
      updateCharts();

      // smooth loading: just show after micro delay (nothing heavy)
      window.addEventListener('load', () => {
        document.body.style.opacity = '1'; 
      });
    })();
  </script>
</body>
</html>
