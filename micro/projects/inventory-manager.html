<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Manager · business dashboard</title>
  <!-- Google Fonts + Chart.js + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE (professional navy/charcoal + white) ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Poppins', sans-serif;
    }

    :root {
      /* Light theme (default) */
      --sidebar-bg: #1e293b;
      --sidebar-hover: #2d3a4f;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-light: #e2e8f0;
      --accent-blue: #2563eb;
      --accent-soft: #dbeafe;
      --badge-low: #dc2626;
      --shadow-sm: 0 8px 20px -6px rgba(0,0,0,0.05);
      --shadow-hover: 0 20px 30px -12px #2563eb30;
    }

    body.dark {
      --sidebar-bg: #0b1120;
      --sidebar-hover: #1e2a3a;
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --border-light: #334155;
      --accent-blue: #3b82f6;
      --accent-soft: #1e3a5f;
      --badge-low: #ef4444;
    }

    body {
      background: var(--bg-main);
      color: var(--text-primary);
      transition: background 0.2s, color 0.2s;
    }

    .app-wrapper {
      display: flex;
      min-height: 100vh;
    }

    /* ===== SIDEBAR (collapsible) ===== */
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      color: #e2e8f0;
      transition: width 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 20px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .sidebar.collapsed {
      width: 80px;
    }
    .sidebar-header {
      padding: 1.8rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow: hidden;
    }
    .logo-icon {
      background: var(--accent-blue);
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: white;
    }
    .logo-text {
      font-weight: 700;
      font-size: 1.3rem;
      white-space: nowrap;
      color: white;
    }
    .collapse-btn {
      background: transparent;
      border: none;
      color: #a0b3cc;
      font-size: 1.3rem;
      cursor: pointer;
    }
    .nav-menu {
      flex: 1;
      padding: 1rem 0.8rem;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.2rem;
      border-radius: 14px;
      margin: 0.3rem 0;
      color: #cbd5e1;
      transition: 0.2s;
      cursor: pointer;
    }
    .nav-item i { font-size: 1.3rem; width: 28px; }
    .nav-item span { white-space: nowrap; }
    .nav-item.active {
      background: var(--accent-blue);
      color: white;
      box-shadow: 0 8px 16px #2563eb60;
    }
    .nav-item:hover:not(.active) { background: var(--sidebar-hover); color: white; }
    .sidebar.collapsed .nav-item span { display: none; }
    .sidebar.collapsed .logo-text { display: none; }
    .sidebar-footer {
      padding: 1.5rem 1rem;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      flex: 1;
      padding: 2rem 2.5rem;
      overflow-y: auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .page-title h1 { font-weight: 600; }
    .theme-toggle {
      background: var(--card-bg);
      border-radius: 40px;
      padding: 0.5rem 1.2rem;
      display: flex;
      gap: 0.5rem;
      cursor: pointer;
      border: 1px solid var(--border-light);
    }

    /* ===== SUMMARY CARDS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.8rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: 0.2s;
    }
    .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
    .stat-left h3 { font-size: 0.95rem; font-weight: 500; color: var(--text-secondary); }
    .stat-number { font-size: 2.5rem; font-weight: 700; }
    .stat-icon { font-size: 2.5rem; color: var(--accent-blue); opacity: 0.8; }

    /* ===== CARDS & TABLES ===== */
    .section-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 1.8rem;
      margin-bottom: 2.5rem;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .btn-primary {
      background: var(--accent-blue);
      border: none;
      color: white;
      font-weight: 500;
      padding: 0.7rem 1.8rem;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 8px 16px #2563eb60;
    }
    .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 60px;
      padding: 0.2rem 0.2rem 0.2rem 1.5rem;
    }
    .search-box input {
      background: transparent;
      border: none;
      padding: 0.5rem 1rem;
      color: var(--text-primary);
      outline: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      padding: 1rem 0.5rem;
      color: var(--text-secondary);
      font-weight: 500;
      border-bottom: 1px solid var(--border-light);
    }
    td {
      padding: 1rem 0.5rem;
      border-bottom: 1px solid var(--border-light);
    }
    .badge {
      background: #f1f5f9;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      font-size: 0.85rem;
    }
    .badge.low { background: #fee2e2; color: #b91c1c; }
    .status-active { color: #10b981; }
    .actions i { margin: 0 0.3rem; cursor: pointer; color: var(--text-secondary); }
    .actions i:hover { color: var(--accent-blue); }

    /* modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border-radius: 32px;
      max-width: 500px;
      width: 90%;
      padding: 2rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .field label { font-size: 0.85rem; color: var(--text-secondary); }
    .field input, .field select {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 0.7rem 1.2rem;
      color: var(--text-primary);
      outline: none;
    }
    .error-msg { color: #b91c1c; background: #fee2e2; padding: 0.5rem; border-radius: 30px; }
    .hidden { display: none; }

    /* toast */
    .toast {
      position: fixed; bottom: 2rem; right: 2rem;
      background: var(--accent-blue); color: white; padding: 1rem 2rem; border-radius: 60px; box-shadow: 0 10px 30px #00000050;
      transform: translateY(200%); transition: transform 0.3s; z-index: 2000;
    }
    .toast.show { transform: translateY(0); }

    /* responsive */
    @media (max-width: 1000px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .sidebar { width: 80px; }
      .sidebar .logo-text, .sidebar .nav-item span { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <!-- sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-area">
          <div class="logo-icon"><i class="fas fa-boxes"></i></div>
          <span class="logo-text">StockMaster</span>
        </div>
        <button class="collapse-btn" id="collapseBtn"><i class="fas fa-bars"></i></button>
      </div>
      <div class="nav-menu">
        <div class="nav-item active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></div>
        <div class="nav-item" data-page="products"><i class="fas fa-box"></i><span>Products</span></div>
        <div class="nav-item" data-page="sales"><i class="fas fa-chart-line"></i><span>Sales</span></div>
        <div class="nav-item" data-page="reports"><i class="fas fa-file-alt"></i><span>Reports</span></div>
        <div class="nav-item" data-page="settings"><i class="fas fa-cog"></i><span>Settings</span></div>
      </div>
      <div class="sidebar-footer">
        <i class="fas fa-user-circle"></i>
        <span>Admin</span>
      </div>
    </aside>

    <!-- main content -->
    <main class="main-content" id="mainContent">
      <div class="top-bar">
        <div class="page-title"><h1 id="pageTitle">Dashboard</h1></div>
        <div class="theme-toggle" id="themeToggle"><span>☀️</span><span>🌙</span></div>
      </div>

      <!-- dynamic sections will be injected by js, but we'll build dashboard directly for brevity -->
      <div id="dashboardSection">
        <!-- summary cards -->
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-left"><h3>Total Products</h3><span class="stat-number" id="totalProducts">0</span></div><i class="fas fa-cubes stat-icon"></i></div>
          <div class="stat-card"><div class="stat-left"><h3>Total Stock</h3><span class="stat-number" id="totalStock">0</span></div><i class="fas fa-warehouse stat-icon"></i></div>
          <div class="stat-card"><div class="stat-left"><h3>Low Stock Items</h3><span class="stat-number" id="lowStockCount">0</span></div><i class="fas fa-exclamation-triangle stat-icon"></i></div>
          <div class="stat-card"><div class="stat-left"><h3>Total Revenue</h3><span class="stat-number" id="totalRevenue">$0</span></div><i class="fas fa-dollar-sign stat-icon"></i></div>
        </div>

        <!-- quick add product (floating action later) + products table -->
        <div class="section-card">
          <div class="section-header">
            <h2>Product Management</h2>
            <button class="btn-primary" id="addProductBtn"><i class="fas fa-plus"></i> Add Product</button>
          </div>
          <div class="search-box" style="margin-bottom:1.5rem; max-width:300px;"><i class="fas fa-search"></i><input id="searchProduct" placeholder="Search product"></div>
          <div style="overflow-x:auto;">
            <table id="productTable">
              <thead><tr><th>Name</th><th>SKU</th><th>Category</th><th>Stock</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody id="productTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- sales recording card -->
        <div class="section-card">
          <h2>Record Sale</h2>
          <div style="display:flex; gap:1rem; flex-wrap:wrap; margin:1rem 0;">
            <select id="saleProductSelect" style="flex:2; padding:0.7rem; border-radius:30px; background:var(--card-bg); border:1px solid var(--border-light);"><option>Select product</option></select>
            <input type="number" id="saleQty" placeholder="Quantity" min="1" style="flex:1; padding:0.7rem; border-radius:30px;">
            <button class="btn-primary" id="recordSaleBtn">Record Sale</button>
          </div>
          <div id="saleError" class="error-msg hidden"></div>
        </div>

        <!-- charts row -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.8rem;">
          <div class="section-card"><canvas id="salesChart"></canvas></div>
          <div class="section-card"><canvas id="categoryChart"></canvas></div>
        </div>
      </div>

      <!-- floating action button (add product) -->
      <div class="fab" style="position:fixed; bottom:2rem; right:2rem; background:#2563eb; width:60px; height:60px; border-radius:40px; display:flex; align-items:center; justify-content:center; color:white; font-size:2rem; cursor:pointer; box-shadow:0 15px 30px #2563eb;" id="fabBtn"><i class="fas fa-plus"></i></div>
    </main>
  </div>

  <!-- MODAL add/edit product -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <h2 id="modalTitle">Add Product</h2>
      <div class="form-grid">
        <div class="field"><label>Product Name *</label><input id="prodName"></div>
        <div class="field"><label>Category *</label><input id="prodCategory"></div>
        <div class="field"><label>SKU *</label><input id="prodSku"></div>
        <div class="field"><label>Cost Price</label><input id="prodCost" type="number" min="0"></div>
        <div class="field"><label>Selling Price *</label><input id="prodPrice" type="number" min="0"></div>
        <div class="field"><label>Stock Qty *</label><input id="prodStock" type="number" min="0"></div>
        <div class="field"><label>Supplier</label><input id="prodSupplier"></div>
        <div class="field"><label>Date Added</label><input type="date" id="prodDate"></div>
      </div>
      <div id="modalError" class="error-msg hidden"></div>
      <div style="display:flex; gap:1rem; justify-content:flex-end; margin-top:1.5rem;">
        <button class="btn-primary" id="saveProductBtn">Save</button>
        <button class="btn-primary" style="background:#64748b;" id="cancelModalBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- toast -->
  <div class="toast" id="toast">Action completed</div>

  <script>
    (function() {
      // ---------- STATE ----------
      let products = [];
      let sales = []; // sales history
      let editId = null;

      // DOM elements
      const totalProductsEl = document.getElementById('totalProducts');
      const totalStockEl = document.getElementById('totalStock');
      const lowStockEl = document.getElementById('lowStockCount');
      const totalRevenueEl = document.getElementById('totalRevenue');
      const productTbody = document.getElementById('productTableBody');
      const saleProductSelect = document.getElementById('saleProductSelect');
      const modal = document.getElementById('productModal');
      const modalTitle = document.getElementById('modalTitle');
      const prodName = document.getElementById('prodName');
      const prodCategory = document.getElementById('prodCategory');
      const prodSku = document.getElementById('prodSku');
      const prodCost = document.getElementById('prodCost');
      const prodPrice = document.getElementById('prodPrice');
      const prodStock = document.getElementById('prodStock');
      const prodSupplier = document.getElementById('prodSupplier');
      const prodDate = document.getElementById('prodDate');
      const modalError = document.getElementById('modalError');
      const saveBtn = document.getElementById('saveProductBtn');
      const cancelBtn = document.getElementById('cancelModalBtn');
      const addProductBtn = document.getElementById('addProductBtn');
      const fab = document.getElementById('fabBtn');
      const searchInp = document.getElementById('searchProduct');
      const recordSaleBtn = document.getElementById('recordSaleBtn');
      const saleQty = document.getElementById('saleQty');
      const saleError = document.getElementById('saleError');
      const themeToggle = document.getElementById('themeToggle');
      const toastEl = document.getElementById('toast');
      const collapseBtn = document.getElementById('collapseBtn');
      const sidebar = document.getElementById('sidebar');

      // Chart instances
      let salesChart, categoryChart;

      // ---------- LOCALSTORAGE ----------
      function loadData() {
        const storedProducts = localStorage.getItem('inventory_products');
        products = storedProducts ? JSON.parse(storedProducts) : [];
        const storedSales = localStorage.getItem('inventory_sales');
        sales = storedSales ? JSON.parse(storedSales) : [];
        renderAll();
      }
      function saveProducts() { localStorage.setItem('inventory_products', JSON.stringify(products)); }
      function saveSales() { localStorage.setItem('inventory_sales', JSON.stringify(sales)); }

      // ---------- ANIMATE NUMBER ----------
      function animateNumber(el, target, prefix='', suffix='') {
        let start = parseFloat(el.innerText.replace(/[$,]/g,'')) || 0;
        const steps = 300/15;
        const inc = (target - start)/steps;
        let step = 0;
        const interval = setInterval(() => {
          step++;
          start += inc;
          el.innerText = prefix + (target%1===0 ? Math.round(start) : start.toFixed(2)) + suffix;
          if(step>=steps) { el.innerText = prefix + (target%1===0 ? target : target.toFixed(2)) + suffix; clearInterval(interval); }
        },15);
      }

      // update dashboard cards
      function updateSummary() {
        const totalProd = products.length;
        const totalStock = products.reduce((acc,p)=>acc + (p.stock||0),0);
        const lowStock = products.filter(p => p.stock < 5).length; // threshold
        const revenue = sales.reduce((acc,s)=>acc + (s.total||0),0);
        animateNumber(totalProductsEl, totalProd);
        animateNumber(totalStockEl, totalStock);
        animateNumber(lowStockEl, lowStock);
        animateNumber(totalRevenueEl, revenue, '$', '');
      }

      // render product table
      function renderProductTable(filter='') {
        const term = filter.toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(term) || p.sku.toLowerCase().includes(term));
        let html = '';
        filtered.forEach((p, idx) => {
          const status = p.stock < 5 ? '<span class="badge low">Low stock</span>' : '<span class="badge">In stock</span>';
          html += `<tr>
            <td>${p.name}</td><td>${p.sku}</td><td>${p.category}</td><td>${p.stock}</td><td>$${p.price}</td>
            <td>${status}</td>
            <td class="actions">
              <i class="fas fa-edit edit-product" data-id="${p.id}"></i>
              <i class="fas fa-trash delete-product" data-id="${p.id}"></i>
            </td>
          </tr>`;
        });
        productTbody.innerHTML = html || '<tr><td colspan="7">No products</td></tr>';
        // attach edit/delete
        document.querySelectorAll('.edit-product').forEach(btn => btn.addEventListener('click', (e) => openEditModal(btn.dataset.id)));
        document.querySelectorAll('.delete-product').forEach(btn => btn.addEventListener('click', (e) => { if(confirm('Delete product?')) { products = products.filter(p=>p.id!=btn.dataset.id); saveProducts(); renderAll(); showToast('Deleted'); }}));
      }

      // populate sale dropdown
      function updateSaleDropdown() {
        let options = '<option value="">Select product</option>';
        products.forEach(p => options += `<option value="${p.id}">${p.name} (stock: ${p.stock})</option>`);
        saleProductSelect.innerHTML = options;
      }

      // charts
      function updateCharts() {
        const ctxSales = document.getElementById('salesChart').getContext('2d');
        const ctxCat = document.getElementById('categoryChart').getContext('2d');
        if (salesChart) salesChart.destroy();
        if (categoryChart) categoryChart.destroy();
        // dummy monthly sales
        salesChart = new Chart(ctxSales, { type:'bar', data: { labels: ['Jan','Feb','Mar','Apr','May'], datasets: [{ label:'Sales', data:[1200,900,1500,2100,1800], backgroundColor:'#2563eb'}]}});
        // category distribution
        const cats = {};
        products.forEach(p => cats[p.category] = (cats[p.category]||0)+1);
        categoryChart = new Chart(ctxCat, { type:'doughnut', data: { labels: Object.keys(cats), datasets: [{ data: Object.values(cats), backgroundColor: ['#2563eb','#f97316','#10b981','#8b5cf6']}]}});
      }

      function renderAll() {
        updateSummary();
        renderProductTable(searchInp.value);
        updateSaleDropdown();
        updateCharts();
      }

      // modal open/close
      function openAddModal() {
        editId = null; modalTitle.innerText = 'Add Product';
        prodName.value = prodCategory.value = prodSku.value = prodCost.value = prodPrice.value = prodStock.value = prodSupplier.value = '';
        prodDate.value = new Date().toISOString().split('T')[0];
        modalError.classList.add('hidden'); modal.classList.add('active');
      }
      function openEditModal(id) {
        const p = products.find(p=>p.id==id); if(!p) return;
        editId = id; modalTitle.innerText = 'Edit Product';
        prodName.value = p.name; prodCategory.value = p.category; prodSku.value = p.sku; prodCost.value = p.cost||'';
        prodPrice.value = p.price; prodStock.value = p.stock; prodSupplier.value = p.supplier||''; prodDate.value = p.dateAdded||'';
        modalError.classList.add('hidden'); modal.classList.add('active');
      }
      function closeModal() { modal.classList.remove('active'); }

      function saveProduct() {
        if (!prodName.value || !prodCategory.value || !prodSku.value || !prodPrice.value || prodStock.value==='') {
          modalError.innerText = 'Name, Category, SKU, Price and Stock are required.'; modalError.classList.remove('hidden'); return;
        }
        if (parseFloat(prodPrice.value)<0 || parseInt(prodStock.value)<0) { modalError.innerText = 'No negative values'; return; }
        modalError.classList.add('hidden');
        const product = {
          id: editId || Date.now() + Math.random(),
          name: prodName.value.trim(),
          category: prodCategory.value.trim(),
          sku: prodSku.value.trim(),
          cost: parseFloat(prodCost.value) || 0,
          price: parseFloat(prodPrice.value),
          stock: parseInt(prodStock.value),
          supplier: prodSupplier.value.trim(),
          dateAdded: prodDate.value || new Date().toISOString().split('T')[0],
        };
        if (editId) {
          const idx = products.findIndex(p=>p.id==editId);
          if (idx!==-1) products[idx] = product;
        } else products.push(product);
        saveProducts(); renderAll(); closeModal(); showToast(editId?'Updated':'Added');
      }

      // record sale
      function recordSale() {
        const prodId = saleProductSelect.value;
        const qty = parseInt(saleQty.value);
        if (!prodId || !qty || qty<=0) { saleError.innerText='Select product and valid quantity'; saleError.classList.remove('hidden'); return; }
        const product = products.find(p=>p.id==prodId);
        if (!product) return;
        if (product.stock < qty) { saleError.innerText='Insufficient stock'; saleError.classList.remove('hidden'); return; }
        saleError.classList.add('hidden');
        product.stock -= qty;
        const sale = { productId:prodId, productName:product.name, qty, total: product.price * qty, date: new Date().toISOString() };
        sales.push(sale);
        saveProducts(); saveSales(); renderAll(); showToast('Sale recorded');
        saleQty.value = '';
      }

      function showToast(msg) { toastEl.innerText=msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),2000); }

      // search
      searchInp.addEventListener('input', (e) => renderProductTable(e.target.value));

      // event listeners
      addProductBtn.addEventListener('click', openAddModal);
      fab.addEventListener('click', openAddModal);
      cancelBtn.addEventListener('click', closeModal);
      saveBtn.addEventListener('click', saveProduct);
      recordSaleBtn.addEventListener('click', recordSale);
      themeToggle.addEventListener('click', () => document.body.classList.toggle('dark'));
      collapseBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

      // load initial
      loadData();
    })();
  </script>
</body>
</html>
