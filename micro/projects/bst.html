<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BST • VISUALIZER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-gradient-1: #141E30;
            --bg-gradient-2: #243B55;
            --panel-bg: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-color: #00E5FF;
            --success-color: #00ff88;
            --error-color: #ff4d4d;
            --node-bg: #00E5FF;
            --node-border: #ffffff;
            --node-text: #141E30;
            --line-color: rgba(255, 255, 255, 0.3);
            --highlight-color: #00ff88;
            --border-glow: rgba(0, 229, 255, 0.5);
            --shadow-neon: 0 0 20px #00E5FF;
            --transition-speed: 0.3s;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, var(--bg-gradient-1), var(--bg-gradient-2));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
            animation: gradientMove 15s ease infinite;
            background-size: 400% 400%;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--card-bg);
            border-radius: 3rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 0.3rem;
            border-radius: 3rem;
        }

        .input-field {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            outline: none;
            width: 100px;
        }

        .input-field::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--accent-color);
            color: var(--text-primary);
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
        }

        .btn-success {
            border-color: var(--success-color);
        }

        .btn-success:hover {
            background: var(--success-color);
        }

        .traversal-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* Stats Panel */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--card-bg);
            border-radius: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-item {
            text-align: center;
            padding: 0.8rem;
            background: rgba(255,255,255,0.05);
            border-radius: 1.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .stat-value {
            color: var(--text-primary);
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-unit {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-left: 0.2rem;
        }

        /* Tree Container */
        .tree-container {
            background: var(--card-bg);
            border-radius: 2rem;
            padding: 2rem;
            margin-bottom: 1.5rem;
            min-height: 400px;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #treeCanvas {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 400px;
            background: transparent;
        }

        /* Traversal Output */
        .output-panel {
            background: var(--card-bg);
            border-radius: 2rem;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .output-title {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .output-content {
            color: var(--text-primary);
            font-size: 1.1rem;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 1rem;
            min-height: 50px;
            word-break: break-all;
        }

        .highlight {
            color: var(--success-color);
            font-weight: 600;
            animation: highlightPulse 1s infinite;
        }

        @keyframes highlightPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Error Message */
        .error-message {
            color: var(--error-color);
            text-align: center;
            padding: 0.5rem;
            margin: 0.5rem 0;
            background: rgba(255, 77, 77, 0.1);
            border-radius: 2rem;
            border: 1px solid var(--error-color);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        /* Footer */
        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .title { font-size: 1.8rem; }
            .control-panel { border-radius: 2rem; }
            .btn { padding: 0.6rem 1rem; font-size: 0.8rem; }
            .stats-panel { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">BST VISUALIZER</div>
            <div class="subtitle">BINARY SEARCH TREE • ALGORITHMS</div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="input-group">
                <input type="number" class="input-field" id="valueInput" placeholder="Enter value" step="1">
                <button class="btn btn-primary" id="insertBtn">➕ Insert</button>
            </div>
            
            <div class="traversal-group">
                <button class="btn" id="inorderBtn">🌿 Inorder</button>
                <button class="btn" id="preorderBtn">🌱 Preorder</button>
                <button class="btn" id="postorderBtn">🍃 Postorder</button>
                <button class="btn" id="levelorderBtn">📊 Level Order</button>
            </div>
            
            <button class="btn" id="resetBtn">🔄 Reset Tree</button>
        </div>

        <!-- Stats Panel -->
        <div class="stats-panel">
            <div class="stat-item">
                <div class="stat-label">Total Nodes</div>
                <div class="stat-value" id="totalNodes">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Tree Height</div>
                <div class="stat-value" id="treeHeight">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Last Operation</div>
                <div class="stat-value" id="operationTime">0<span class="stat-unit">ms</span></div>
            </div>
        </div>

        <!-- Tree Visualization -->
        <div class="tree-container">
            <canvas id="treeCanvas"></canvas>
        </div>

        <!-- Traversal Output -->
        <div class="output-panel">
            <div class="output-title">
                <span>📝 Traversal Output</span>
                <span id="traversalType" class="highlight">None</span>
            </div>
            <div class="output-content" id="traversalOutput">-</div>
        </div>

        <!-- Error Display -->
        <div id="errorDisplay" style="display: none;"></div>

        <div class="footer">
            ⚡ Insert values • Watch the tree grow • Explore traversals
        </div>
    </div>

    <script>
        // ========== NODE CLASS ==========
        class Node {
            constructor(value) {
                this.value = value;
                this.left = null;
                this.right = null;
                this.x = 0;
                this.y = 0;
            }
        }

        // ========== BST CLASS ==========
        class BinarySearchTree {
            constructor() {
                this.root = null;
                this.totalNodes = 0;
            }

            insert(value) {
                // Check for duplicate
                if (this.find(value)) {
                    throw new Error(`Value ${value} already exists in the tree`);
                }

                const newNode = new Node(value);
                
                if (this.root === null) {
                    this.root = newNode;
                } else {
                    this.insertNode(this.root, newNode);
                }
                
                this.totalNodes++;
                return newNode;
            }

            insertNode(node, newNode) {
                if (newNode.value < node.value) {
                    if (node.left === null) {
                        node.left = newNode;
                    } else {
                        this.insertNode(node.left, newNode);
                    }
                } else {
                    if (node.right === null) {
                        node.right = newNode;
                    } else {
                        this.insertNode(node.right, newNode);
                    }
                }
            }

            find(value) {
                return this.findNode(this.root, value);
            }

            findNode(node, value) {
                if (node === null) return null;
                
                if (value < node.value) {
                    return this.findNode(node.left, value);
                } else if (value > node.value) {
                    return this.findNode(node.right, value);
                } else {
                    return node;
                }
            }

            inorder(node = this.root, result = []) {
                if (node !== null) {
                    this.inorder(node.left, result);
                    result.push(node.value);
                    this.inorder(node.right, result);
                }
                return result;
            }

            preorder(node = this.root, result = []) {
                if (node !== null) {
                    result.push(node.value);
                    this.preorder(node.left, result);
                    this.preorder(node.right, result);
                }
                return result;
            }

            postorder(node = this.root, result = []) {
                if (node !== null) {
                    this.postorder(node.left, result);
                    this.postorder(node.right, result);
                    result.push(node.value);
                }
                return result;
            }

            levelOrder() {
                const result = [];
                if (this.root === null) return result;
                
                const queue = [this.root];
                
                while (queue.length) {
                    const node = queue.shift();
                    result.push(node.value);
                    
                    if (node.left) queue.push(node.left);
                    if (node.right) queue.push(node.right);
                }
                
                return result;
            }

            getHeight(node = this.root) {
                if (node === null) return 0;
                const leftHeight = this.getHeight(node.left);
                const rightHeight = this.getHeight(node.right);
                return Math.max(leftHeight, rightHeight) + 1;
            }

            reset() {
                this.root = null;
                this.totalNodes = 0;
            }
        }

        // ========== GLOBAL VARIABLES ==========
        const bst = new BinarySearchTree();
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d');
        
        // DOM Elements
        const valueInput = document.getElementById('valueInput');
        const insertBtn = document.getElementById('insertBtn');
        const inorderBtn = document.getElementById('inorderBtn');
        const preorderBtn = document.getElementById('preorderBtn');
        const postorderBtn = document.getElementById('postorderBtn');
        const levelorderBtn = document.getElementById('levelorderBtn');
        const resetBtn = document.getElementById('resetBtn');
        const totalNodesEl = document.getElementById('totalNodes');
        const treeHeightEl = document.getElementById('treeHeight');
        const operationTimeEl = document.getElementById('operationTime');
        const traversalOutput = document.getElementById('traversalOutput');
        const traversalType = document.getElementById('traversalType');
        const errorDisplay = document.getElementById('errorDisplay');

        // Node positions
        const NODE_RADIUS = 25;
        const LEVEL_HEIGHT = 70;
        const HORIZONTAL_SPACING = 60;

        // ========== CANVAS SETUP ==========
        function resizeCanvas() {
            const container = document.querySelector('.tree-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            drawTree();
        }

        window.addEventListener('resize', resizeCanvas);

        // ========== TREE RENDERING ==========
        function calculatePositions(node, level, minX, maxX, positions = []) {
            if (node === null) return;
            
            const x = (minX + maxX) / 2;
            const y = level * LEVEL_HEIGHT + 50;
            
            positions.push({
                node,
                x,
                y
            });
            
            calculatePositions(node.left, level + 1, minX, x, positions);
            calculatePositions(node.right, level + 1, x, maxX, positions);
            
            return positions;
        }

        function drawTree() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (bst.root === null) return;
            
            const positions = calculatePositions(bst.root, 0, 50, canvas.width - 50);
            
            // Draw connections first
            ctx.beginPath();
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line-color').trim();
            ctx.lineWidth = 2;
            
            positions.forEach(pos => {
                const node = pos.node;
                
                if (node.left) {
                    const leftPos = positions.find(p => p.node === node.left);
                    if (leftPos) {
                        ctx.beginPath();
                        ctx.moveTo(pos.x, pos.y + NODE_RADIUS);
                        ctx.lineTo(leftPos.x, leftPos.y - NODE_RADIUS);
                        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line-color').trim();
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
                
                if (node.right) {
                    const rightPos = positions.find(p => p.node === node.right);
                    if (rightPos) {
                        ctx.beginPath();
                        ctx.moveTo(pos.x, pos.y + NODE_RADIUS);
                        ctx.lineTo(rightPos.x, rightPos.y - NODE_RADIUS);
                        ctx.stroke();
                    }
                }
            });
            
            // Draw nodes
            positions.forEach(pos => {
                const node = pos.node;
                
                // Draw node circle
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, NODE_RADIUS, 0, 2 * Math.PI);
                
                // Fill with gradient
                const gradient = ctx.createRadialGradient(pos.x - 5, pos.y - 5, 5, pos.x, pos.y, NODE_RADIUS);
                gradient.addColorStop(0, getComputedStyle(document.documentElement).getPropertyValue('--node-bg').trim());
                gradient.addColorStop(1, '#00b8ff');
                
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--node-border').trim();
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Add shadow
                ctx.shadowColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim();
                ctx.shadowBlur = 10;
                
                // Draw value
                ctx.shadowBlur = 0;
                ctx.font = 'bold 14px "Segoe UI"';
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--node-text').trim();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(node.value, pos.x, pos.y);
            });
        }

        // ========== ANIMATION FUNCTIONS ==========
        async function animateInsertion(value) {
            const startTime = performance.now();
            
            try {
                const newNode = bst.insert(value);
                drawTree();
                
                // Highlight new node
                const positions = calculatePositions(bst.root, 0, 50, canvas.width - 50);
                const newNodePos = positions.find(p => p.node === newNode);
                
                if (newNodePos) {
                    // Animate the new node
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.arc(newNodePos.x, newNodePos.y, NODE_RADIUS + 5, 0, 2 * Math.PI);
                        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--success-color').trim();
                        ctx.lineWidth = 3;
                        ctx.stroke();
                        await sleep(100);
                        drawTree();
                        await sleep(100);
                    }
                }
                
                updateStats(startTime);
                hideError();
                
            } catch (error) {
                showError(error.message);
            }
        }

        async function animateTraversal(type, values) {
            traversalType.textContent = type;
            traversalOutput.innerHTML = '';
            
            for (let i = 0; i < values.length; i++) {
                const value = values[i];
                
                // Highlight current value
                const span = document.createElement('span');
                span.className = 'highlight';
                span.textContent = value + ' ';
                traversalOutput.appendChild(span);
                
                // Find and highlight node
                const node = bst.find(value);
                if (node) {
                    await highlightNode(node);
                }
                
                await sleep(500);
            }
        }

        async function highlightNode(node) {
            const positions = calculatePositions(bst.root, 0, 50, canvas.width - 50);
            const nodePos = positions.find(p => p.node === node);
            
            if (nodePos) {
                for (let i = 0; i < 2; i++) {
                    // Draw highlight circle
                    ctx.beginPath();
                    ctx.arc(nodePos.x, nodePos.y, NODE_RADIUS + 8, 0, 2 * Math.PI);
                    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--success-color').trim();
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    // Draw inner glow
                    ctx.beginPath();
                    ctx.arc(nodePos.x, nodePos.y, NODE_RADIUS + 3, 0, 2 * Math.PI);
                    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim();
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    await sleep(200);
                    drawTree();
                    await sleep(100);
                }
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ========== STATS UPDATE ==========
        function updateStats(startTime) {
            const endTime = performance.now();
            const timeTaken = (endTime - startTime).toFixed(2);
            
            totalNodesEl.textContent = bst.totalNodes;
            treeHeightEl.textContent = bst.getHeight();
            operationTimeEl.textContent = timeTaken;
        }

        // ========== ERROR HANDLING ==========
        function showError(message) {
            errorDisplay.style.display = 'block';
            errorDisplay.className = 'error-message';
            errorDisplay.textContent = `⚠️ ${message}`;
        }

        function hideError() {
            errorDisplay.style.display = 'none';
        }

        // ========== RESET TREE ==========
        function resetTree() {
            bst.reset();
            drawTree();
            totalNodesEl.textContent = '0';
            treeHeightEl.textContent = '0';
            operationTimeEl.textContent = '0';
            traversalOutput.textContent = '-';
            traversalType.textContent = 'None';
            hideError();
            valueInput.value = '';
        }

        // ========== EVENT LISTENERS ==========
        insertBtn.addEventListener('click', async () => {
            const value = parseInt(valueInput.value);
            if (isNaN(value)) {
                showError('Please enter a valid number');
                return;
            }
            
            valueInput.value = '';
            await animateInsertion(value);
        });

        inorderBtn.addEventListener('click', async () => {
            const startTime = performance.now();
            const values = bst.inorder();
            await animateTraversal('Inorder', values);
            updateStats(startTime);
        });

        preorderBtn.addEventListener('click', async () => {
            const startTime = performance.now();
            const values = bst.preorder();
            await animateTraversal('Preorder', values);
            updateStats(startTime);
        });

        postorderBtn.addEventListener('click', async () => {
            const startTime = performance.now();
            const values = bst.postorder();
            await animateTraversal('Postorder', values);
            updateStats(startTime);
        });

        levelorderBtn.addEventListener('click', async () => {
            const startTime = performance.now();
            const values = bst.levelOrder();
            await animateTraversal('Level Order', values);
            updateStats(startTime);
        });

        resetBtn.addEventListener('click', resetTree);

        valueInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                insertBtn.click();
            }
        });

        // Initialize
        resizeCanvas();

        // Insert some sample values
        (async function init() {
            await animateInsertion(50);
            await sleep(500);
            await animateInsertion(30);
            await sleep(500);
            await animateInsertion(70);
            await sleep(500);
            await animateInsertion(20);
            await sleep(500);
            await animateInsertion(40);
            await sleep(500);
            await animateInsertion(60);
            await sleep(500);
            await animateInsertion(80);
        })();
    </script>
</body>
</html>
