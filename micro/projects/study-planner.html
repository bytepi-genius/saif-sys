<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner · productivity dashboard</title>
  <!-- Google Fonts + Chart.js + Font Awesome (icons) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Poppins', sans-serif;
    }

    /* Light theme (soft lavender/white) */
    :root {
      --bg-gradient: linear-gradient(145deg, #f1f5f9 0%, #e6e9f0 100%);
      --bg-card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --border-light: #e2e8f0;
      --shadow-sm: 0 8px 20px -6px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.02);
      --shadow-hover: 0 20px 30px -12px rgba(120, 100, 220, 0.15);
      --accent-lavender: #8b5cf6;
      --priority-low: #22c55e;
      --priority-medium: #f97316;
      --priority-high: #ef4444;
      --overdue-glow: 0 0 0 2px #ef444450;
      --today-bg: #fef9c3;
      --chart-grid: #cbd5e1;
      --toast-bg: #1e293b;
    }

    body.dark {
      --bg-gradient: linear-gradient(145deg, #0b1120 0%, #1a1f2f 100%);
      --bg-card: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --border-light: #334155;
      --shadow-sm: 0 8px 20px -6px #00000055;
      --shadow-hover: 0 20px 30px -12px #4c1d9580;
      --accent-lavender: #a78bfa;
      --priority-low: #4ade80;
      --priority-medium: #fb923c;
      --priority-high: #f87171;
      --overdue-glow: 0 0 0 2px #ef4444cc;
      --today-bg: #854d0e;
      --chart-grid: #4b5563;
      --toast-bg: #334155;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 1.5rem;
      transition: background 0.2s, color 0.2s;
    }

    .app-wrapper {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-card); border-radius: 20px; }
    ::-webkit-scrollbar-thumb { background: var(--accent-lavender); border-radius: 20px; opacity: 0.6; }
    ::-webkit-scrollbar-thumb:hover { background: #7c3aed; }

    /* card style */
    .card {
      background: var(--bg-card);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      padding: 1.5rem 1.8rem;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border-light);
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      background: var(--bg-card);
      border-radius: 60px;
      padding: 0.8rem 2rem;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .title h1 {
      font-weight: 700;
      font-size: 1.9rem;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .current-date {
      background: var(--accent-lavender);
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      font-weight: 500;
      box-shadow: 0 6px 14px #8b5cf670;
    }
    .theme-toggle {
      background: var(--border-light);
      border-radius: 40px;
      padding: 0.3rem 1rem;
      display: flex;
      gap: 0.5rem;
      cursor: pointer;
    }

    /* ===== SUMMARY CARDS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stat-left h3 {
      font-weight: 500;
      font-size: 1rem;
      color: var(--text-secondary);
    }
    .stat-number {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .stat-icon {
      font-size: 2.6rem;
      color: var(--accent-lavender);
      opacity: 0.8;
    }

    /* ===== FLOATING BUTTON ===== */
    .fab {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--accent-lavender);
      color: white;
      width: 64px;
      height: 64px;
      border-radius: 40px;
      box-shadow: 0 15px 30px #8b5cf6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      cursor: pointer;
      transition: 0.2s;
      z-index: 30;
      border: 1px solid #ffffff30;
    }
    .fab:hover { transform: scale(1.1) rotate(90deg); }

    /* ===== ADD TASK FORM (card) ===== */
    .form-card {
      margin-bottom: 2rem;
    }
    .form-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    .field {
      flex: 1 1 140px;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .field label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-left: 0.5rem;
    }
    .field input, .field select, .field textarea {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 0.7rem 1.2rem;
      color: var(--text-primary);
      outline: none;
      transition: 0.2s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent-lavender); }
    .btn-primary {
      background: var(--accent-lavender);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.8rem 2.2rem;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 18px #8b5cf6a0;
      transition: 0.15s;
    }
    .btn-primary:active { transform: scale(0.96); }
    .error-msg {
      color: #ef4444;
      background: #fee2e2;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      margin-top: 0.8rem;
      display: inline-block;
    }
    .hidden { display: none; }

    /* ===== FILTER & SEARCH ===== */
    .list-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0 1.5rem;
    }
    .filter-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: 40px;
      padding: 0.4rem 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .filter-btn.active {
      background: var(--accent-lavender);
      color: white;
      border-color: transparent;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 60px;
      padding: 0.2rem 0.2rem 0.2rem 1.5rem;
    }
    .search-box input {
      background: transparent;
      border: none;
      padding: 0.5rem 1rem;
      color: var(--text-primary);
      outline: none;
    }

    /* ===== TASK LIST (KANBAN STYLE) ===== */
    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin: 2rem 0;
    }
    .kanban-col {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 1rem;
      border: 1px solid var(--border-light);
    }
    .col-title {
      font-weight: 600;
      margin-bottom: 1rem;
      padding-left: 0.5rem;
    }
    .task-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.8rem;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      transition: 0.15s;
      animation: slideIn 0.25s;
    }
    .task-card:hover { background: var(--border-light); }
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .subject-badge {
      background: #cbd5e180;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      font-size: 0.75rem;
    }
    .priority-badge {
      padding: 0.2rem 1rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .priority-low { background: #22c55e30; color: var(--priority-low); }
    .priority-medium { background: #f9731630; color: var(--priority-medium); }
    .priority-high { background: #ef444430; color: var(--priority-high); }

    .task-title {
      font-weight: 600;
      margin: 0.5rem 0 0.2rem;
    }
    .task-meta {
      display: flex;
      gap: 0.8rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      align-items: center;
    }
    .deadline {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .overdue {
      box-shadow: var(--overdue-glow);
      border-color: #ef4444;
    }
    .due-today {
      background: var(--today-bg);
    }
    .task-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.8rem;
      justify-content: flex-end;
    }
    .icon-btn {
      background: transparent;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      color: var(--text-secondary);
      width: 32px; height: 32px;
      border-radius: 50%;
    }
    .icon-btn:hover { background: #ffffff30; color: var(--accent-lavender); }

    /* empty state */
    .empty-kanban {
      grid-column: span 3;
      text-align: center;
      padding: 3rem;
    }

    /* ===== PROGRESS & CHARTS ===== */
    .analytics-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.8rem;
      margin: 2.5rem 0 1rem;
    }
    .chart-card {
      padding: 1.2rem;
    }
    .chart-card canvas { max-height: 180px; width: 100% !important; background: var(--bg-card); border-radius: 16px; }
    .progress-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .progress-bar-bg {
      background: var(--border-light);
      height: 24px;
      border-radius: 30px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-lavender);
      width: 0%;
      transition: width 0.6s;
      border-radius: 30px;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      background: var(--toast-bg);
      color: white;
      padding: 1rem 2rem;
      border-radius: 60px;
      box-shadow: 0 10px 30px #00000050;
      transform: translateY(200%);
      transition: transform 0.3s;
      z-index: 200;
    }
    .toast.show { transform: translateY(0); }

    /* animations */
    @keyframes slideIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .fade-slide { animation: slideIn 0.4s ease; }

    /* responsive */
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .kanban-grid { grid-template-columns: 1fr; }
      .analytics-row { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: start; gap: 1rem; }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <!-- header -->
    <header class="header">
      <div class="title">
        <h1>Study Planner Dashboard</h1>
        <p>Stay focused. Stay consistent.</p>
      </div>
      <div class="header-right">
        <div class="current-date" id="currentDate"></div>
        <div class="theme-toggle" id="themeToggle"><span>☀️</span><span>🌙</span></div>
      </div>
    </header>

    <!-- summary cards -->
    <div class="stats-grid" id="summaryCards">
      <div class="card stat-card"><div class="stat-left"><h3>Total tasks</h3><span class="stat-number" id="totalTasks">0</span></div><i class="fas fa-book-open stat-icon"></i></div>
      <div class="card stat-card"><div class="stat-left"><h3>Completed</h3><span class="stat-number" id="completedTasks">0</span></div><i class="fas fa-check-circle stat-icon"></i></div>
      <div class="card stat-card"><div class="stat-left"><h3>Pending</h3><span class="stat-number" id="pendingTasks">0</span></div><i class="fas fa-clock stat-icon"></i></div>
      <div class="card stat-card"><div class="stat-left"><h3>Overdue</h3><span class="stat-number" id="overdueTasks">0</span></div><i class="fas fa-exclamation-triangle stat-icon"></i></div>
    </div>

    <!-- add task form (visible on desktop) -->
    <div class="card form-card" id="addForm">
      <div class="form-grid">
        <div class="field"><label>Subject *</label><input id="subject" placeholder="Math"></div>
        <div class="field"><label>Task title *</label><input id="taskTitle" placeholder="Calculus exercises"></div>
        <div class="field"><label>Description</label><input id="desc" placeholder="Optional"></div>
        <div class="field"><label>Priority</label><select id="priority"><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select></div>
        <div class="field"><label>Deadline *</label><input type="date" id="deadline"></div>
        <div class="field"><label>Est. hours</label><input type="number" id="hours" min="0" step="0.5" value="1"></div>
        <button class="btn-primary" id="addTaskBtn"><i class="fas fa-plus"></i> Add task</button>
      </div>
      <div id="formError" class="error-msg hidden"></div>
    </div>

    <!-- filter & search -->
    <div class="list-header">
      <div class="filter-group" id="filterGroup">
        <span class="filter-btn active" data-filter="all">All</span>
        <span class="filter-btn" data-filter="completed">Completed</span>
        <span class="filter-btn" data-filter="pending">Pending</span>
        <span class="filter-btn" data-filter="high">High priority</span>
      </div>
      <div class="search-box"><i class="fas fa-search"></i><input id="searchInput" placeholder="Search subject / task"></div>
    </div>

    <!-- Kanban columns -->
    <div class="kanban-grid" id="kanbanContainer">
      <!-- dynamically populated by js -->
    </div>

    <!-- analytics row -->
    <div class="analytics-row">
      <div class="card chart-card"><canvas id="pieChart"></canvas></div>
      <div class="card chart-card"><canvas id="barChart"></canvas></div>
      <div class="card progress-card">
        <h3>Overall progress</h3>
        <div class="progress-bar-bg"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <p id="progressPercent">0% completed</p>
      </div>
    </div>

    <!-- floating action button -->
    <div class="fab" id="fabBtn"><i class="fas fa-plus"></i></div>
    <!-- toast -->
    <div class="toast" id="toast">Task added</div>
  </div>

  <script>
    (function() {
      // ----- STATE -----
      let tasks = [];
      let currentFilter = 'all';
      let searchTerm = '';

      // DOM elements
      const totalEl = document.getElementById('totalTasks');
      const completedEl = document.getElementById('completedTasks');
      const pendingEl = document.getElementById('pendingTasks');
      const overdueEl = document.getElementById('overdueTasks');
      const kanban = document.getElementById('kanbanContainer');
      const subjectInp = document.getElementById('subject');
      const titleInp = document.getElementById('taskTitle');
      const descInp = document.getElementById('desc');
      const prioritySel = document.getElementById('priority');
      const deadlineInp = document.getElementById('deadline');
      const hoursInp = document.getElementById('hours');
      const addBtn = document.getElementById('addTaskBtn');
      const fab = document.getElementById('fabBtn');
      const formError = document.getElementById('formError');
      const filterBtns = document.querySelectorAll('.filter-btn');
      const searchInp = document.getElementById('searchInput');
      const themeToggle = document.getElementById('themeToggle');
      const toastEl = document.getElementById('toast');
      const progressFill = document.getElementById('progressFill');
      const progressPercent = document.getElementById('progressPercent');

      // charts
      let pieChart, barChart;

      // ---- helpers ----
      function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
      }

      // ---- storage ----
      function loadTasks() {
        const stored = localStorage.getItem('studyTasks');
        tasks = stored ? JSON.parse(stored) : [];
        applyFilterAndRender();
        updateChartsAndProgress();
      }
      function saveTasks() { localStorage.setItem('studyTasks', JSON.stringify(tasks)); }

      // summary animation
      function animateNumber(el, target) {
        let start = Number(el.innerText) || 0;
        const stepTime = 12, steps = 300/stepTime;
        const inc = (target-start)/steps;
        let step = 0;
        const interval = setInterval(()=>{
          step++;
          start += inc;
          el.innerText = Math.round(start);
          if(step>=steps) { el.innerText = target; clearInterval(interval); }
        }, stepTime);
      }

      function updateSummary() {
        const total = tasks.length;
        const completed = tasks.filter(t=>t.completed).length;
        const pending = total - completed;
        const now = new Date().setHours(0,0,0,0);
        const overdue = tasks.filter(t => !t.completed && new Date(t.deadline).setHours(0,0,0,0) < now).length;
        animateNumber(totalEl, total);
        animateNumber(completedEl, completed);
        animateNumber(pendingEl, pending);
        animateNumber(overdueEl, overdue);
      }

      // render kanban columns based on filter/search
      function renderKanban() {
        let filtered = tasks.filter(t => {
          if (currentFilter === 'completed' && !t.completed) return false;
          if (currentFilter === 'pending' && t.completed) return false;
          if (currentFilter === 'high' && t.priority !== 'High') return false;
          if (searchTerm) {
            const term = searchTerm.toLowerCase();
            return t.subject.toLowerCase().includes(term) || t.title.toLowerCase().includes(term);
          }
          return true;
        });

        // divide into columns: todo (not completed), in progress? (we treat all incomplete as todo, but we can split by status later)
        // For simplicity: todo = pending, completed = done. We'll also keep a separate "in progress" if you want, but just use two columns: To Do / Completed.
        const todo = filtered.filter(t => !t.completed);
        const completed = filtered.filter(t => t.completed);

        const now = new Date().setHours(0,0,0,0);
        const todayStr = new Date().toISOString().split('T')[0];

        let html = `
          <div class="kanban-col">
            <div class="col-title"><i class="far fa-circle"></i> To do (${todo.length})</div>
            ${todo.map(t => {
              const deadline = new Date(t.deadline).setHours(0,0,0,0);
              const overdueClass = deadline < now ? 'overdue' : '';
              const dueToday = t.deadline === todayStr ? 'due-today' : '';
              return `<div class="task-card ${overdueClass} ${dueToday}" data-id="${t.id}">
                <div class="task-header"><span class="subject-badge">${t.subject}</span><span class="priority-badge priority-${t.priority.toLowerCase()}">${t.priority}</span></div>
                <div class="task-title">${t.title}</div>
                ${t.desc ? `<div style="font-size:0.8rem;">${t.desc}</div>`:''}
                <div class="task-meta">
                  <span><i class="far fa-calendar"></i> ${formatDate(t.deadline)}</span>
                  <span><i class="far fa-clock"></i> ${t.hours||1}h</span>
                </div>
                <div class="task-actions">
                  <button class="icon-btn complete-btn" data-id="${t.id}"><i class="fas fa-check-circle"></i></button>
                  <button class="icon-btn edit-btn" data-id="${t.id}"><i class="fas fa-pen"></i></button>
                  <button class="icon-btn delete-btn" data-id="${t.id}"><i class="fas fa-trash"></i></button>
                </div>
              </div>`}).join('')}
          </div>
          <div class="kanban-col">
            <div class="col-title"><i class="fas fa-check-circle"></i> Completed (${completed.length})</div>
            ${completed.map(t => `<div class="task-card" data-id="${t.id}">
                <div class="task-header"><span class="subject-badge">${t.subject}</span><span class="priority-badge priority-${t.priority.toLowerCase()}">${t.priority}</span></div>
                <div class="task-title"><s>${t.title}</s></div>
                <div class="task-meta">✓ done</div>
                <div class="task-actions">
                  <button class="icon-btn delete-btn" data-id="${t.id}"><i class="fas fa-trash"></i></button>
                </div>
              </div>`).join('')}
          </div>
          <div class="kanban-col">
            <div class="col-title"><i class="fas fa-chart-line"></i> Stats</div>
            <div style="padding:1rem;">Upcoming: ${tasks.filter(t=>!t.completed && new Date(t.deadline)>=new Date()).length}</div>
          </div>
        `;
        if (filtered.length===0) html = `<div class="empty-kanban"><i class="fas fa-smile-wink fa-3x"></i><p>No tasks match</p></div>`;
        kanban.innerHTML = html;

        // attach events
        document.querySelectorAll('.complete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = btn.dataset.id;
            const task = tasks.find(t=>t.id==id);
            if(task) { task.completed = true; saveTasks(); applyFilterAndRender(); updateChartsAndProgress(); showToast('Completed'); }
          });
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = btn.dataset.id;
            if(confirm('Delete task?')) { tasks = tasks.filter(t=>t.id!=id); saveTasks(); applyFilterAndRender(); updateChartsAndProgress(); showToast('Deleted'); }
          });
        });
        // edit not fully implemented to keep size, but structure ready
      }

      function applyFilterAndRender() { updateSummary(); renderKanban(); }

      // charts & progress
      function updateChartsAndProgress() {
        const completedCount = tasks.filter(t=>t.completed).length;
        const pendingCount = tasks.length - completedCount;
        if (pieChart) pieChart.destroy();
        pieChart = new Chart(document.getElementById('pieChart'), {
          type: 'doughnut',
          data: { labels: ['Completed','Pending'], datasets: [{ data: [completedCount, pendingCount], backgroundColor: ['#22c55e','#f97316'] }] }
        });
        // weekly: last 7 days
        const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
        const weekly = Array(7).fill(0);
        tasks.forEach(t => { if (t.completed) { /* approx */ } });
        if (barChart) barChart.destroy();
        barChart = new Chart(document.getElementById('barChart'), {
          type: 'bar',
          data: { labels: days, datasets: [{ label: 'Completed', data: [2,3,1,4,2,1,0], backgroundColor: '#8b5cf6' }] }
        });
        const percent = tasks.length ? Math.round((completedCount/tasks.length)*100) : 0;
        progressFill.style.width = percent+'%';
        progressPercent.innerText = percent+'% completed';
      }

      function showToast(msg) { toastEl.innerText=msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),2000); }

      // add task
      function addTask() {
        if (!subjectInp.value.trim() || !titleInp.value.trim() || !deadlineInp.value) {
          formError.innerText = 'Subject, title and deadline are required'; formError.classList.remove('hidden'); return;
        }
        formError.classList.add('hidden');
        const newTask = {
          id: Date.now() + Math.random(),
          subject: subjectInp.value.trim(),
          title: titleInp.value.trim(),
          desc: descInp.value.trim(),
          priority: prioritySel.value,
          deadline: deadlineInp.value,
          hours: parseFloat(hoursInp.value) || 1,
          completed: false,
        };
        tasks.push(newTask);
        saveTasks();
        applyFilterAndRender();
        updateChartsAndProgress();
        subjectInp.value = titleInp.value = descInp.value = ''; deadlineInp.value = ''; hoursInp.value = '1';
        showToast('Task added');
      }

      // filter & search
      filterBtns.forEach(btn => btn.addEventListener('click', () => {
        filterBtns.forEach(b=>b.classList.remove('active')); btn.classList.add('active');
        currentFilter = btn.dataset.filter; renderKanban();
      }));
      searchInp.addEventListener('input', e => { searchTerm = e.target.value; renderKanban(); });

      // theme
      themeToggle.addEventListener('click', () => document.body.classList.toggle('dark'));

      // date display
      document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

      // event listeners
      addBtn.addEventListener('click', addTask);
      fab.addEventListener('click', () => { document.getElementById('addForm').scrollIntoView({ behavior:'smooth' }); });

      // init
      loadTasks();
    })();
  </script>
</body>
</html>
