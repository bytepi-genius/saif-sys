<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Chemistry Universe · Interactive Periodic & Molecular Explorer</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', 'Poppins', sans-serif;
      background: #050814;
      color: #e2e8f0;
    }

    /* Loading overlay */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #050814;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 1s;
    }
    .atom-loader {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #00f5ff;
      border-top-color: #7c3aed;
      animation: spin 1s infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* UI Panels - Glassmorphism */
    #main-panel {
      position: absolute;
      top: 2rem;
      left: 2rem;
      background: rgba(5, 10, 25, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 245, 255, 0.3);
      border-radius: 32px;
      padding: 1.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 40px #00f5ff40;
      z-index: 20;
      pointer-events: none;
    }

    #main-panel h1 {
      margin: 0;
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00f5ff, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #main-panel p {
      margin: 0.3rem 0 0;
      color: #94a3b8;
    }

    /* AI Assistant Panel */
    #ai-panel {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      width: 360px;
      background: rgba(8, 15, 30, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid #7c3aed;
      border-radius: 40px;
      padding: 2rem;
      box-shadow: 0 30px 60px #00000080, 0 0 60px #7c3aed80;
      transform: translateX(450px);
      transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
      z-index: 30;
      border-left: 6px solid #00f5ff;
    }

    #ai-panel.visible {
      transform: translateX(0);
    }

    #ai-title {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 1.8rem;
      font-weight: 700;
      color: #00f5ff;
      margin-bottom: 1rem;
    }

    #ai-content {
      min-height: 120px;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .mode-toggle {
      display: flex;
      gap: 0.5rem;
      background: #0f172a;
      border-radius: 60px;
      padding: 0.3rem;
      margin-bottom: 1.5rem;
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 0.5rem;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    .mode-btn.active {
      background: #7c3aed;
      color: white;
    }

    /* Controls Panel */
    #controls-panel {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      background: rgba(5, 10, 25, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid #00f5ff;
      border-radius: 60px;
      padding: 0.8rem 1.5rem;
      display: flex;
      gap: 1rem;
      z-index: 25;
    }

    .control-btn {
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      transition: 0.2s;
    }

    .control-btn:hover {
      background: #00f5ff20;
      color: #00f5ff;
    }

    #search-box {
      position: absolute;
      top: 2rem;
      right: 2rem;
      background: rgba(5, 10, 25, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid #7c3aed;
      border-radius: 60px;
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      z-index: 30;
    }

    #search-box input {
      background: transparent;
      border: none;
      color: white;
      font-size: 1rem;
      outline: none;
      width: 200px;
    }

    /* Visualization mode buttons */
    #viz-modes {
      position: absolute;
      top: 8rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 28;
    }

    .viz-btn {
      background: rgba(5, 10, 25, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid #00f5ff;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
      width: 140px;
      text-align: left;
    }

    .viz-btn:hover, .viz-btn.active {
      background: #00f5ff;
      color: #050814;
      border-color: #7c3aed;
    }

    .tooltip {
      position: absolute;
      background: rgba(0, 20, 40, 0.95);
      backdrop-filter: blur(4px);
      color: white;
      padding: 1rem 1.8rem;
      border-radius: 40px;
      font-size: 1rem;
      border: 1px solid #00f5ff;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 100;
      box-shadow: 0 0 40px #00f5ff;
      line-height: 1.6;
    }

    /* Periodic table mini panel */
    #periodic-legend {
      position: absolute;
      top: 2rem;
      right: 24rem;
      background: rgba(5, 10, 25, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 30px;
      padding: 1rem;
      border: 1px solid #7c3aed;
      z-index: 26;
      font-size: 0.8rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.3rem 0;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    @media (max-width: 900px) {
      #main-panel { top: 1rem; left: 1rem; padding: 1rem; }
      #main-panel h1 { font-size: 1.8rem; }
      #ai-panel { width: 280px; }
    }
  </style>
</head>
<body>
  <div id="loading"><div class="atom-loader"></div></div>

  <!-- UI Overlays -->
  <div id="main-panel">
    <h1>⚛️ Chemistry Universe</h1>
    <p>Molecules · Periodic Table · AI Explorer</p>
  </div>

  <div id="ai-panel">
    <div id="ai-title"><i class="fas fa-robot"></i> AI Assistant</div>
    <div class="mode-toggle" id="ai-mode-toggle">
      <button class="mode-btn active" data-mode="beginner">Beginner</button>
      <button class="mode-btn" data-mode="advanced">Advanced</button>
    </div>
    <div id="ai-content">Click any element or molecule to explore...</div>
    <button id="voice-btn" class="control-btn" style="width:100%;"><i class="fas fa-volume-up"></i> Listen</button>
  </div>

  <div id="controls-panel">
    <button class="control-btn" id="reset-camera"><i class="fas fa-camera"></i> Reset</button>
    <button class="control-btn" id="toggle-rotate"><i class="fas fa-sync-alt"></i> Auto</button>
    <button class="control-btn" id="toggle-sound"><i class="fas fa-volume-up"></i> Sound</button>
  </div>

  <div id="search-box">
    <i class="fas fa-search"></i>
    <input type="text" id="search-input" placeholder="Search element or molecule...">
  </div>

  <div id="viz-modes">
    <button class="viz-btn active" data-mode="ball">Ball & Stick</button>
    <button class="viz-btn" data-mode="spacefill">Space-Fill</button>
    <button class="viz-btn" data-mode="wireframe">Wireframe</button>
    <button class="viz-btn" data-mode="orbit">Electron Orbit</button>
  </div>

  <div id="periodic-legend">
    <div class="legend-item"><span class="color-dot" style="background:#ff6b6b;"></span> Alkali metals</div>
    <div class="legend-item"><span class="color-dot" style="background:#4ecdc4;"></span> Noble gases</div>
    <div class="legend-item"><span class="color-dot" style="background:#45b7d1;"></span> Transition metals</div>
    <div class="legend-item"><span class="color-dot" style="background:#96ceb4;"></span> Halogens</div>
    <div class="legend-item"><span class="color-dot" style="background:#ffeaa7;"></span> Lanthanides</div>
    <div class="legend-item"><span class="color-dot" style="background:#fab1a0;"></span> Actinides</div>
  </div>

  <div class="tooltip" id="tooltip" style="opacity:0;">Tooltip</div>

  <!-- Import maps -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/",
        "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { GlitchPass } from 'three/addons/postprocessing/GlitchPass.js';
    import gsap from 'gsap';

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050814);
    scene.fog = new THREE.FogExp2(0x050814, 0.0015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(20, 8, 25);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.body.appendChild(renderer.domElement);

    // --- Controls ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enableZoom = true;
    controls.maxPolarAngle = Math.PI / 2;
    controls.target.set(0, 2, 0);

    // --- Lighting ---
    const ambient = new THREE.AmbientLight(0x404060);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 15, 7);
    dirLight.castShadow = true;
    dirLight.receiveShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const pointLight1 = new THREE.PointLight(0x4f46e5, 2, 40);
    pointLight1.position.set(-4, 5, 5);
    scene.add(pointLight1);
    
    const pointLight2 = new THREE.PointLight(0x00f5ff, 2, 40);
    pointLight2.position.set(5, 3, -4);
    scene.add(pointLight2);

    // --- Nebula particles (moving gradient effect) ---
    const particleGeo = new THREE.BufferGeometry();
    const particleCount = 3000;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      positions[i*3] = (Math.random() - 0.5) * 120;
      positions[i*3+1] = (Math.random() - 0.5) * 80;
      positions[i*3+2] = (Math.random() - 0.5) * 120;
      
      const color = new THREE.Color().lerpColors(
        new THREE.Color(0x4f46e5), 
        new THREE.Color(0x00f5ff), 
        Math.random()
      );
      colors[i*3] = color.r;
      colors[i*3+1] = color.g;
      colors[i*3+2] = color.b;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const particleMat = new THREE.PointsMaterial({ size: 0.2, vertexColors: true, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // --- Animated cyber grid floor ---
    const gridHelper = new THREE.GridHelper(40, 40, 0x00f5ff, 0x7c3aed);
    gridHelper.position.y = -1;
    scene.add(gridHelper);

    // --- Post-processing (Bloom + Glow) ---
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.1;
    bloomPass.strength = 1.5;
    bloomPass.radius = 0.6;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- Data Stores ---
    const molecules = [];
    const periodicElements = [];

    // Element data (simplified for demo)
    const elementData = {
      'H': { name: 'Hydrogen', mass: '1.008', category: 'alkali', config: '1s¹', reactivity: 'Highly reactive', uses: 'Fuel, rocket propellant' },
      'He': { name: 'Helium', mass: '4.0026', category: 'noble', config: '1s²', reactivity: 'Inert', uses: 'Balloons, cryogenics' },
      'Li': { name: 'Lithium', mass: '6.94', category: 'alkali', config: '[He] 2s¹', reactivity: 'Very reactive', uses: 'Batteries' },
      'C': { name: 'Carbon', mass: '12.011', category: 'nonmetal', config: '[He] 2s² 2p²', reactivity: 'Variable', uses: 'Organic chemistry' },
      'N': { name: 'Nitrogen', mass: '14.007', category: 'nonmetal', config: '[He] 2s² 2p³', reactivity: 'Inert', uses: 'Fertilizer' },
      'O': { name: 'Oxygen', mass: '16.00', category: 'nonmetal', config: '[He] 2s² 2p⁴', reactivity: 'Oxidizer', uses: 'Respiration' },
      'Ne': { name: 'Neon', mass: '20.18', category: 'noble', config: '[He] 2s² 2p⁶', reactivity: 'Inert', uses: 'Neon signs' }
    };

    // Create Periodic Table (3D grid)
    const symbols = ['H','He','Li','C','N','O','Ne']; // sample
    const startX = -6;
    const startY = 4;
    symbols.forEach((sym, i) => {
      const row = Math.floor(i / 4);
      const col = i % 4;
      const pos = new THREE.Vector3(startX + col * 3, startY - row * 3, 0);
      
      const boxGeo = new THREE.BoxGeometry(1.2, 1.2, 0.3);
      const boxMat = new THREE.MeshPhongMaterial({
        color: elementData[sym]?.category === 'alkali' ? 0xff6b6b :
               elementData[sym]?.category === 'noble' ? 0x4ecdc4 : 0x45b7d1,
        emissive: 0x111122,
        transparent: true,
        opacity: 0.9
      });
      const tile = new THREE.Mesh(boxGeo, boxMat);
      tile.position.copy(pos);
      tile.userData = { type: 'element', symbol: sym, name: elementData[sym]?.name, mass: elementData[sym]?.mass, category: elementData[sym]?.category };
      
      // Add text using canvas (simplified - we'll use sprite)
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px Inter';
      ctx.fillText(sym, 10, 40);
      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(0.8, 0.8, 0.8);
      sprite.position.set(0, 0.2, 0.3);
      tile.add(sprite);
      
      scene.add(tile);
      periodicElements.push(tile);
    });

    // Create Molecules
    function createMolecule(name, pos, color) {
      const group = new THREE.Group();
      
      if (name === 'H₂O') {
        const O = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32), new THREE.MeshPhongMaterial({ color: 0xff4444, emissive: 0x330000 }));
        O.position.set(0, 0, 0);
        group.add(O);
        const H1 = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32), new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x222222 }));
        H1.position.set(0.9, 0.6, 0);
        group.add(H1);
        const H2 = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32), new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x222222 }));
        H2.position.set(0.9, -0.6, 0);
        group.add(H2);
      } else if (name === 'CO₂') {
        const C = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32), new THREE.MeshPhongMaterial({ color: 0x666666 }));
        C.position.set(0,0,0);
        group.add(C);
        const O1 = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32), new THREE.MeshPhongMaterial({ color: 0xff6666 }));
        O1.position.set(1.4, 0, 0);
        group.add(O1);
        const O2 = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32), new THREE.MeshPhongMaterial({ color: 0xff6666 }));
        O2.position.set(-1.4, 0, 0);
        group.add(O2);
      } else if (name === 'DNA') {
        // simplified helix
        for (let i = 0; i < 10; i++) {
          const sphere1 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16), new THREE.MeshPhongMaterial({ color: 0x4f46e5 }));
          sphere1.position.set(Math.sin(i)*0.8, i*0.8, Math.cos(i)*0.8);
          group.add(sphere1);
          const sphere2 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16), new THREE.MeshPhongMaterial({ color: 0xec4899 }));
          sphere2.position.set(-Math.sin(i)*0.8, i*0.8, -Math.cos(i)*0.8);
          group.add(sphere2);
        }
      } else {
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32), new THREE.MeshPhongMaterial({ color: color, emissive: 0x111133 }));
        group.add(sphere);
      }

      group.position.copy(pos);
      group.userData = { name, type: 'molecule', formula: name, info: `${name} molecule` };
      return group;
    }

    const molNames = ['H₂O', 'CO₂', 'NH₃', 'CH₄', 'C₆H₆', 'DNA'];
    const molColors = [0x00f5ff, 0x7c3aed, 0xff6b6b, 0x4ecdc4, 0xffbe0b, 0xfb5607];
    const molRadius = 12;
    molNames.forEach((name, i) => {
      const angle = (i / molNames.length) * Math.PI * 2;
      const pos = new THREE.Vector3(
        Math.cos(angle) * molRadius,
        Math.sin(angle * 2) * 2 + 2,
        Math.sin(angle) * molRadius
      );
      const mol = createMolecule(name, pos, molColors[i]);
      scene.add(mol);
      molecules.push(mol);
    });

    // --- Interaction (Raycaster) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById('tooltip');
    let hoveredObj = null;

    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([...molecules, ...periodicElements], true);

      if (intersects.length > 0) {
        const hit = intersects[0].object.parent || intersects[0].object;
        if (hit.userData.name || hit.userData.symbol) {
          tooltip.style.opacity = 1;
          tooltip.style.left = event.clientX + 15 + 'px';
          tooltip.style.top = event.clientY - 80 + 'px';
          
          if (hit.userData.type === 'element') {
            tooltip.innerHTML = `<b>${hit.userData.symbol} - ${hit.userData.name}</b><br>Atomic mass: ${hit.userData.mass}<br>Category: ${hit.userData.category}`;
          } else {
            tooltip.innerHTML = `<b>${hit.userData.name}</b><br>${hit.userData.formula}`;
          }

          if (hoveredObj !== hit) {
            if (hoveredObj) gsap.to(hoveredObj.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
            gsap.to(hit.scale, { x: 1.2, y: 1.2, z: 1.2, duration: 0.3 });
            hoveredObj = hit;
          }
        }
      } else {
        tooltip.style.opacity = 0;
        if (hoveredObj) {
          gsap.to(hoveredObj.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
          hoveredObj = null;
        }
      }
    }

    function onClick(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([...molecules, ...periodicElements], true);
      
      if (intersects.length > 0) {
        const hit = intersects[0].object.parent || intersects[0].object;
        
        // Cinematic camera zoom
        gsap.to(camera.position, {
          x: hit.position.x + 3,
          y: hit.position.y + 2,
          z: hit.position.z + 5,
          duration: 1.5,
          ease: "power2.inOut"
        });
        gsap.to(controls.target, {
          x: hit.position.x,
          y: hit.position.y,
          z: hit.position.z,
          duration: 1.5
        });

        // Update AI panel
        let aiText = '';
        if (hit.userData.type === 'element') {
          const el = elementData[hit.userData.symbol] || { name: hit.userData.name, config: '...', uses: '...' };
          aiText = `⚛️ ${el.name} (${hit.userData.symbol})\n\nElectron configuration: ${el.config}\nReactivity: ${el.reactivity}\nReal-world uses: ${el.uses}`;
        } else {
          aiText = `🧪 ${hit.userData.name}\n\nMolecular geometry: Varies\nBond angles: ~104.5° (for water)\nHybridization: sp³\nApplications: Solvent, life support`;
        }
        document.getElementById('ai-content').innerText = aiText;
        document.getElementById('ai-panel').classList.add('visible');
      }
    }

    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('click', onClick);

    // --- UI Controls ---
    document.getElementById('reset-camera').addEventListener('click', () => {
      gsap.to(camera.position, { x: 20, y: 8, z: 25, duration: 1.5 });
      gsap.to(controls.target, { x: 0, y: 2, z: 0, duration: 1.5 });
    });

    document.getElementById('toggle-rotate').addEventListener('click', (btn) => {
      controls.autoRotate = !controls.autoRotate;
      btn.target.innerHTML = controls.autoRotate ? '<i class="fas fa-pause"></i> Pause' : '<i class="fas fa-play"></i> Auto';
    });

    // Voice output
    document.getElementById('voice-btn').addEventListener('click', () => {
      const text = document.getElementById('ai-content').innerText;
      const utterance = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(utterance);
    });

    // Search
    document.getElementById('search-input').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      [...molecules, ...periodicElements].forEach(obj => {
        const name = (obj.userData.name || obj.userData.symbol || '').toLowerCase();
        obj.visible = name.includes(term);
      });
    });

    // Visualization modes (simplified)
    document.querySelectorAll('.viz-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.viz-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.dataset.mode;
        // In a full implementation, you'd change materials
      });
    });

    // Hide loading after 2 sec
    setTimeout(() => {
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => document.getElementById('loading').style.display = 'none', 1000);
    }, 2000);

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      // Animate molecules
      molecules.forEach((mol, i) => {
        mol.rotation.y += 0.01;
        mol.rotation.x += 0.005;
        mol.position.y += Math.sin(Date.now() * 0.002 + i) * 0.002;
      });

      // Animate periodic tiles
      periodicElements.forEach((el, i) => {
        el.rotation.y += 0.005;
        el.position.y += Math.sin(Date.now() * 0.003 + i) * 0.002;
      });

      particles.rotation.y += 0.0001;

      controls.update();
      composer.render();
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
