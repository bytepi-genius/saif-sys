<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMI • HEALTH CALCULATOR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-gradient-1: #f5f7fa;
            --bg-gradient-2: #c3cfe2;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --accent-color: #3498db;
            --shadow: 0 20px 40px -15px rgba(0,0,0,0.2);
            --underweight: #3498db;
            --normal: #2ecc71;
            --overweight: #f39c12;
            --obese: #e74c3c;
            --input-bg: #f8f9fa;
            --border-color: #e0e0e0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, var(--bg-gradient-1), var(--bg-gradient-2));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }

        /* Animated background */
        .shape {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.1), rgba(46, 204, 113, 0.1));
            filter: blur(60px);
            z-index: 0;
            animation: float 20s infinite alternate;
        }

        .shape-1 {
            top: -100px;
            left: -100px;
            animation: float 25s infinite alternate;
        }

        .shape-2 {
            bottom: -100px;
            right: -100px;
            background: linear-gradient(135deg, rgba(241, 196, 15, 0.1), rgba(231, 76, 60, 0.1));
            animation: float 30s infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 3rem;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.3);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        /* Unit Toggle */
        .unit-toggle {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(0,0,0,0.05);
            padding: 0.5rem;
            border-radius: 3rem;
        }

        .unit-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.8rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .unit-btn.active {
            background: var(--card-bg);
            color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Input Section */
        .input-section {
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .input-icon {
            color: var(--accent-color);
            font-size: 1.2rem;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 2rem;
            padding: 0.5rem 1.5rem;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            padding: 0.5rem 0;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .input-unit {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 600;
        }

        /* Button Group */
        .button-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            flex: 1;
            background: var(--card-bg);
            border: none;
            color: var(--text-primary);
            padding: 1rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary:hover {
            background: var(--border-color);
            transform: translateY(-2px);
        }

        /* Result Section */
        .result-section {
            text-align: center;
            padding: 2rem;
            background: rgba(255,255,255,0.5);
            border-radius: 2rem;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
            transition: all 0.5s ease;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .bmi-value {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .bmi-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .health-status {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .health-message {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* BMI Gauge */
        .gauge-container {
            margin-bottom: 2rem;
        }

        .gauge-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .gauge-bar {
            height: 10px;
            background: linear-gradient(90deg, 
                var(--underweight) 0%, 
                var(--underweight) 18.5%, 
                var(--normal) 18.5%, 
                var(--normal) 24.9%, 
                var(--overweight) 24.9%, 
                var(--overweight) 29.9%, 
                var(--obese) 29.9%, 
                var(--obese) 100%);
            border-radius: 5px;
            position: relative;
            margin-bottom: 0.5rem;
        }

        .gauge-indicator {
            position: absolute;
            width: 4px;
            height: 20px;
            background: var(--text-primary);
            border-radius: 2px;
            transform: translateX(-50%);
            top: -5px;
            transition: left 0.3s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        .gauge-value {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* BMI Chart */
        .bmi-chart {
            background: rgba(255,255,255,0.5);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .chart-title {
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .chart-item {
            text-align: center;
            padding: 0.5rem;
            border-radius: 1rem;
            font-size: 0.8rem;
        }

        .chart-item.underweight { background: rgba(52, 152, 219, 0.2); color: var(--underweight); }
        .chart-item.normal { background: rgba(46, 204, 113, 0.2); color: var(--normal); }
        .chart-item.overweight { background: rgba(243, 156, 18, 0.2); color: var(--overweight); }
        .chart-item.obese { background: rgba(231, 76, 60, 0.2); color: var(--obese); }

        .chart-range {
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .chart-category {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        /* Last Result */
        .last-result {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            padding: 1rem;
            background: rgba(255,255,255,0.3);
            border-radius: 2rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 1rem;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .container { padding: 1.5rem; }
            .title { font-size: 2rem; }
            .bmi-value { font-size: 3rem; }
            .chart-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- Background shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="container">
        <div class="header">
            <div class="title">BMI CALCULATOR</div>
            <div class="subtitle">KNOW YOUR HEALTH</div>
        </div>

        <!-- Unit Toggle -->
        <div class="unit-toggle">
            <button class="unit-btn active" onclick="setUnit('metric')" id="metricBtn">⚖️ Metric</button>
            <button class="unit-btn" onclick="setUnit('imperial')" id="imperialBtn">📏 Imperial</button>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <!-- Weight Input -->
            <div class="input-group">
                <div class="input-label">
                    <span class="input-icon">⚖️</span>
                    <span id="weightLabel">Weight (kg)</span>
                </div>
                <div class="input-wrapper">
                    <input type="number" id="weight" placeholder="Enter weight" step="0.1" min="1" max="300">
                    <span class="input-unit" id="weightUnit">kg</span>
                </div>
            </div>

            <!-- Height Input -->
            <div class="input-group">
                <div class="input-label">
                    <span class="input-icon">📏</span>
                    <span id="heightLabel">Height (cm)</span>
                </div>
                <div class="input-wrapper">
                    <input type="number" id="height" placeholder="Enter height" step="0.1" min="50" max="250">
                    <span class="input-unit" id="heightUnit">cm</span>
                </div>
            </div>
        </div>

        <!-- Button Group -->
        <div class="button-group">
            <button class="btn btn-primary" onclick="calculateBMI()">
                <span>📊</span> Calculate
            </button>
            <button class="btn btn-secondary" onclick="resetCalculator()">
                <span>🔄</span> Reset
            </button>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="result-section" style="display: none;">
            <div class="bmi-value" id="bmiValue">0.0</div>
            <div class="bmi-label">YOUR BMI</div>
            <div class="health-status" id="healthStatus">-</div>
            <div class="health-message" id="healthMessage">-</div>
        </div>

        <!-- BMI Gauge -->
        <div id="gaugeContainer" class="gauge-container" style="display: none;">
            <div class="gauge-labels">
                <span>18.5</span>
                <span>24.9</span>
                <span>29.9</span>
            </div>
            <div class="gauge-bar">
                <div class="gauge-indicator" id="gaugeIndicator" style="left: 0%;"></div>
            </div>
            <div class="gauge-value" id="gaugeValue">-</div>
        </div>

        <!-- BMI Chart -->
        <div class="bmi-chart">
            <div class="chart-title">📊 BMI Categories</div>
            <div class="chart-grid">
                <div class="chart-item underweight">
                    <div class="chart-range">&lt; 18.5</div>
                    <div class="chart-category">Underweight</div>
                </div>
                <div class="chart-item normal">
                    <div class="chart-range">18.5 - 24.9</div>
                    <div class="chart-category">Normal</div>
                </div>
                <div class="chart-item overweight">
                    <div class="chart-range">25 - 29.9</div>
                    <div class="chart-category">Overweight</div>
                </div>
                <div class="chart-item obese">
                    <div class="chart-range">≥ 30</div>
                    <div class="chart-category">Obese</div>
                </div>
            </div>
        </div>

        <!-- Last Result -->
        <div id="lastResult" class="last-result" style="display: none;"></div>

        <div class="footer">
            ⚕️ Consult a doctor for professional medical advice
        </div>
    </div>

    <script>
        // ========== GLOBAL VARIABLES ==========
        let currentUnit = 'metric';
        let lastBMI = localStorage.getItem('lastBMI');

        // DOM Elements
        const resultSection = document.getElementById('resultSection');
        const gaugeContainer = document.getElementById('gaugeContainer');
        const bmiValue = document.getElementById('bmiValue');
        const healthStatus = document.getElementById('healthStatus');
        const healthMessage = document.getElementById('healthMessage');
        const gaugeIndicator = document.getElementById('gaugeIndicator');
        const gaugeValue = document.getElementById('gaugeValue');
        const lastResult = document.getElementById('lastResult');
        const weightInput = document.getElementById('weight');
        const heightInput = document.getElementById('height');
        const weightLabel = document.getElementById('weightLabel');
        const heightLabel = document.getElementById('heightLabel');
        const weightUnit = document.getElementById('weightUnit');
        const heightUnit = document.getElementById('heightUnit');
        const metricBtn = document.getElementById('metricBtn');
        const imperialBtn = document.getElementById('imperialBtn');

        // Show last result if exists
        if (lastBMI) {
            lastResult.style.display = 'block';
            lastResult.innerHTML = `📌 Last calculated BMI: ${lastBMI}`;
        }

        // ========== UNIT TOGGLE ==========
        function setUnit(unit) {
            currentUnit = unit;
            
            // Update active button
            metricBtn.classList.remove('active');
            imperialBtn.classList.remove('active');
            
            if (unit === 'metric') {
                metricBtn.classList.add('active');
                weightLabel.textContent = 'Weight (kg)';
                heightLabel.textContent = 'Height (cm)';
                weightUnit.textContent = 'kg';
                heightUnit.textContent = 'cm';
                
                // Update placeholders
                weightInput.placeholder = 'Enter weight in kg';
                heightInput.placeholder = 'Enter height in cm';
                weightInput.min = '1';
                weightInput.max = '300';
                heightInput.min = '50';
                heightInput.max = '250';
            } else {
                imperialBtn.classList.add('active');
                weightLabel.textContent = 'Weight (lbs)';
                heightLabel.textContent = 'Height (in)';
                weightUnit.textContent = 'lbs';
                heightUnit.textContent = 'in';
                
                // Update placeholders
                weightInput.placeholder = 'Enter weight in lbs';
                heightInput.placeholder = 'Enter height in inches';
                weightInput.min = '2';
                weightInput.max = '700';
                heightInput.min = '20';
                heightInput.max = '100';
            }
            
            // Clear inputs
            weightInput.value = '';
            heightInput.value = '';
            hideResults();
        }

        // ========== BMI CALCULATION ==========
        function calculateBMI() {
            if (!validateInputs()) return;

            let weight = parseFloat(weightInput.value);
            let height = parseFloat(heightInput.value);
            let bmi;

            if (currentUnit === 'metric') {
                // Convert height from cm to m
                height = height / 100;
                bmi = weight / (height * height);
            } else {
                // Imperial formula: (weight in lbs * 703) / (height in inches)²
                bmi = (weight * 703) / (height * height);
            }

            // Round to 1 decimal
            bmi = Math.round(bmi * 10) / 10;
            
            // Display result
            displayResult(bmi);
            
            // Save to localStorage
            localStorage.setItem('lastBMI', bmi);
            lastResult.style.display = 'block';
            lastResult.innerHTML = `📌 Last calculated BMI: ${bmi}`;
            
            // Animate result
            animateResult();
        }

        function validateInputs() {
            const weight = weightInput.value.trim();
            const height = heightInput.value.trim();

            if (!weight || !height) {
                showError('Please enter both weight and height');
                return false;
            }

            const weightNum = parseFloat(weight);
            const heightNum = parseFloat(height);

            if (isNaN(weightNum) || isNaN(heightNum)) {
                showError('Please enter valid numbers');
                return false;
            }

            if (currentUnit === 'metric') {
                if (weightNum < 1 || weightNum > 300) {
                    showError('Weight must be between 1-300 kg');
                    return false;
                }
                if (heightNum < 50 || heightNum > 250) {
                    showError('Height must be between 50-250 cm');
                    return false;
                }
            } else {
                if (weightNum < 2 || weightNum > 700) {
                    showError('Weight must be between 2-700 lbs');
                    return false;
                }
                if (heightNum < 20 || heightNum > 100) {
                    showError('Height must be between 20-100 inches');
                    return false;
                }
            }

            return true;
        }

        function showError(message) {
            // Simple alert for now
            alert(message);
        }

        // ========== DISPLAY RESULT ==========
        function displayResult(bmi) {
            // Show result sections
            resultSection.style.display = 'block';
            gaugeContainer.style.display = 'block';
            
            // Update BMI value with animation
            bmiValue.textContent = bmi.toFixed(1);
            
            // Determine category
            let category, message, color;
            
            if (bmi < 18.5) {
                category = 'Underweight';
                message = 'You are underweight. Consider gaining healthy weight.';
                color = 'var(--underweight)';
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                category = 'Normal';
                message = 'You have a healthy weight. Keep it up!';
                color = 'var(--normal)';
            } else if (bmi >= 25 && bmi <= 29.9) {
                category = 'Overweight';
                message = 'You are overweight. Consider a balanced diet and exercise.';
                color = 'var(--overweight)';
            } else {
                category = 'Obese';
                message = 'You are in the obese range. Consult a doctor for guidance.';
                color = 'var(--obese)';
            }
            
            // Update health status
            healthStatus.textContent = category;
            healthStatus.style.color = color;
            healthMessage.textContent = message;
            
            // Update gauge
            updateGauge(bmi);
            
            // Change result section border color
            resultSection.style.border = `2px solid ${color}`;
        }

        function updateGauge(bmi) {
            // Calculate gauge position (max 40 for gauge range)
            let position;
            if (bmi < 18.5) {
                position = (bmi / 18.5) * 25; // 0-25% for underweight
            } else if (bmi <= 24.9) {
                position = 25 + ((bmi - 18.5) / 6.4) * 25; // 25-50% for normal
            } else if (bmi <= 29.9) {
                position = 50 + ((bmi - 25) / 4.9) * 25; // 50-75% for overweight
            } else {
                position = Math.min(75 + ((bmi - 30) / 10) * 25, 100); // 75-100% for obese
            }
            
            gaugeIndicator.style.left = position + '%';
            gaugeValue.textContent = `Your BMI: ${bmi.toFixed(1)}`;
        }

        // ========== RESET FUNCTION ==========
        function resetCalculator() {
            // Clear inputs
            weightInput.value = '';
            heightInput.value = '';
            
            // Hide results
            hideResults();
            
            // Add reset animation
            document.querySelector('.container').style.animation = 'slideUp 0.3s ease';
            setTimeout(() => {
                document.querySelector('.container').style.animation = '';
            }, 300);
        }

        function hideResults() {
            resultSection.style.display = 'none';
            gaugeContainer.style.display = 'none';
        }

        // ========== ANIMATION ==========
        function animateResult() {
            // Bounce animation for BMI value
            bmiValue.style.animation = 'bounce 0.5s ease';
            setTimeout(() => {
                bmiValue.style.animation = '';
            }, 500);
        }

        // Add bounce animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes bounce {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.2); }
            }
        `;
        document.head.appendChild(style);

        // ========== ENTER KEY SUPPORT ==========
        weightInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') calculateBMI();
        });
        
        heightInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') calculateBMI();
        });

        // ========== INPUT VALIDATION ==========
        weightInput.addEventListener('input', function() {
            if (this.value < 0) this.value = 1;
        });
        
        heightInput.addEventListener('input', function() {
            if (this.value < 0) this.value = 1;
        });
    </script>
</body>
</html>
