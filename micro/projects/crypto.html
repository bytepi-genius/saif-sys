<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYPTO • TRACKER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Theme variables */
        :root {
            --bg-gradient-1: #06142E;
            --bg-gradient-2: #0B2447;
            --panel-bg: rgba(10, 25, 50, 0.45);
            --card-bg: rgba(10, 25, 50, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #b0d4f0;
            --accent-color: #00E5FF;
            --profit-color: #00ff88;
            --loss-color: #ff4d4d;
            --border-glow: rgba(0, 229, 255, 0.5);
            --shadow-neon: 0 0 20px #00E5FF;
            --control-bg: rgba(0, 20, 40, 0.7);
        }

        /* Light theme */
        [data-theme="light"] {
            --bg-gradient-1: #E8F0F2;
            --bg-gradient-2: #B8D8E3;
            --panel-bg: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-primary: #2C3E50;
            --text-secondary: #34495E;
            --accent-color: #3498DB;
            --border-glow: rgba(52, 152, 219, 0.5);
            --shadow-neon: 0 0 20px #3498DB;
            --control-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, var(--bg-gradient-1), var(--bg-gradient-2));
            transition: all 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: var(--accent-color);
            border-radius: 50%;
            opacity: 0.2;
            pointer-events: none;
            animation: floatParticle 15s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(-100vh) translateX(0); opacity: 0; }
            50% { opacity: 0.3; }
            100% { transform: translateY(100vh) translateX(50px); opacity: 0; }
        }

        /* Sticky Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 1rem 2rem;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 10px var(--accent-color));
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn:hover {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
            transform: scale(1.05);
        }

        .last-updated {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Search and Filter Section */
        .search-section {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
        }

        .search-input {
            width: 100%;
            background: var(--control-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 1rem 1rem 1rem 3rem;
            border-radius: 2rem;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            box-shadow: var(--shadow-neon);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem 1.5rem;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stats-info {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .stat-value {
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .refresh-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .refresh-btn:hover {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            box-shadow: var(--shadow-neon);
            transform: rotate(180deg);
        }

        /* Crypto Grid */
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        /* Crypto Card */
        .crypto-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2rem;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .crypto-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: var(--shadow-neon);
        }

        .crypto-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .crypto-card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .coin-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            padding: 2px;
            box-shadow: var(--shadow-neon);
        }

        .coin-info {
            flex: 1;
        }

        .coin-name {
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .coin-symbol {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .favorite-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .favorite-btn.active {
            color: #FFD700;
            text-shadow: 0 0 10px #FFD700;
        }

        .card-body {
            margin-bottom: 1rem;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.5rem;
        }

        .current-price {
            color: var(--text-primary);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .price-change {
            font-size: 1rem;
            font-weight: 600;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            transition: all 0.3s ease;
        }

        .price-change.positive {
            color: var(--profit-color);
            background: rgba(0, 255, 136, 0.1);
        }

        .price-change.negative {
            color: var(--loss-color);
            background: rgba(255, 77, 77, 0.1);
        }

        .price-change.flash {
            animation: flash 0.5s ease;
        }

        @keyframes flash {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(1); }
        }

        .market-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .detail-item {
            text-align: center;
            padding: 0.5rem;
            background: rgba(255,255,255,0.05);
            border-radius: 1rem;
        }

        .detail-label {
            color: var(--text-secondary);
            font-size: 0.7rem;
        }

        .detail-value {
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Loading Skeleton */
        .skeleton-card {
            background: var(--card-bg);
            border-radius: 2rem;
            padding: 1.5rem;
            animation: skeletonPulse 1.5s infinite;
        }

        .skeleton-line {
            height: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 1rem;
            margin: 0.5rem 0;
        }

        .skeleton-line.short { width: 60%; }
        .skeleton-line.medium { width: 80%; }
        .skeleton-line.long { width: 100%; }

        @keyframes skeletonPulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 3rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--accent-color);
            color: var(--bg-gradient-1);
            transform: rotate(90deg);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .modal-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            padding: 5px;
        }

        .modal-title {
            color: var(--text-primary);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .modal-symbol {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .modal-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .modal-stat {
            background: rgba(255,255,255,0.05);
            border-radius: 1.5rem;
            padding: 1rem;
            text-align: center;
        }

        .modal-stat-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .modal-stat-value {
            color: var(--text-primary);
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* Mini Chart */
        .mini-chart {
            background: rgba(255,255,255,0.05);
            border-radius: 1.5rem;
            padding: 1rem;
            margin-top: 1rem;
        }

        .chart-title {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 100px;
        }

        .chart-bar {
            flex: 1;
            background: var(--accent-color);
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin: 2rem 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-container { flex-direction: column; align-items: stretch; }
            .nav-controls { justify-content: center; }
            .search-row { flex-direction: column; }
            .filter-buttons { justify-content: center; }
            .stats-bar { flex-direction: column; }
            .stats-info { justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- Particles -->
    <div id="particles"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">📊</span>
                <span class="logo-text">CryptoTracker</span>
            </div>
            <div class="nav-controls">
                <button class="nav-btn" onclick="toggleCurrency()" id="currencyBtn">
                    <span>💰</span> USD
                </button>
                <button class="nav-btn" onclick="toggleTheme()" id="themeBtn">
                    <span>🌙</span> Dark
                </button>
                <div class="last-updated" id="lastUpdated"></div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-row">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search by name or symbol..." oninput="filterCoins()">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="sortCoins('market_cap_desc')" id="sortDefault">📊 Default</button>
                    <button class="filter-btn" onclick="sortCoins('price_desc')" id="sortPriceHigh">💰 Price ↑</button>
                    <button class="filter-btn" onclick="sortCoins('price_asc')" id="sortPriceLow">💰 Price ↓</button>
                    <button class="filter-btn" onclick="sortCoins('gainers')" id="sortGainers">📈 Gainers</button>
                    <button class="filter-btn" onclick="sortCoins('losers')" id="sortLosers">📉 Losers</button>
                </div>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stats-info">
                <div class="stat">
                    <div class="stat-label">TOTAL COINS</div>
                    <div class="stat-value" id="totalCoins">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">MARKET CAP</div>
                    <div class="stat-value" id="totalMarketCap">$0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">24h VOLUME</div>
                    <div class="stat-value" id="totalVolume">$0</div>
                </div>
            </div>
            <button class="refresh-btn" onclick="manualRefresh()" id="refreshBtn">↻</button>
        </div>

        <!-- Crypto Grid -->
        <div class="crypto-grid" id="cryptoGrid">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Loading Skeleton (shown initially) -->
        <div id="skeletonLoader" style="display: block;">
            <div class="crypto-grid">
                ${Array(12).fill(0).map(() => `
                    <div class="skeleton-card">
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                        <div class="skeleton-line long"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                `).join('')}
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            ⚡ Real-time data from CoinGecko • Updated every 30 seconds
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // ========== GLOBAL VARIABLES ==========
        let cryptoData = [];
        let filteredData = [];
        let favorites = JSON.parse(localStorage.getItem('cryptoFavorites')) || [];
        let currentCurrency = 'usd';
        let currentTheme = 'dark';
        let autoRefreshInterval;
        let previousPrices = {};

        // DOM Elements
        const cryptoGrid = document.getElementById('cryptoGrid');
        const skeletonLoader = document.getElementById('skeletonLoader');
        const searchInput = document.getElementById('searchInput');
        const lastUpdatedEl = document.getElementById('lastUpdated');
        const totalCoinsEl = document.getElementById('totalCoins');
        const totalMarketCapEl = document.getElementById('totalMarketCap');
        const totalVolumeEl = document.getElementById('totalVolume');
        const currencyBtn = document.getElementById('currencyBtn');
        const themeBtn = document.getElementById('themeBtn');

        // Particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = 10 + Math.random() * 20 + 's';
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        // ========== API FUNCTIONS ==========
        async function fetchCryptoData() {
            try {
                showLoading(true);
                
                const response = await fetch(
                    'https://api.coingecko.com/api/v3/coins/markets?' + 
                    'vs_currency=' + currentCurrency + 
                    '&order=market_cap_desc' + 
                    '&per_page=20' + 
                    '&page=1' + 
                    '&sparkline=true' + 
                    '&price_change_percentage=24h'
                );
                
                if (!response.ok) throw new Error('Failed to fetch data');
                
                const data = await response.json();
                
                // Store previous prices for comparison
                data.forEach(coin => {
                    if (previousPrices[coin.id]) {
                        coin.price_change = coin.current_price - previousPrices[coin.id];
                    }
                    previousPrices[coin.id] = coin.current_price;
                });
                
                cryptoData = data;
                filteredData = [...data];
                
                updateStats();
                renderCryptoList();
                updateLastUpdated();
                
                showLoading(false);
                
            } catch (error) {
                console.error('Error fetching crypto data:', error);
                cryptoGrid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                        <div style="color: var(--loss-color); font-size: 2rem; margin-bottom: 1rem;">⚠️</div>
                        <div style="color: var(--text-primary); font-size: 1.2rem;">Failed to load data</div>
                        <button class="nav-btn" onclick="fetchCryptoData()" style="margin-top: 1rem;">Try Again</button>
                    </div>
                `;
                showLoading(false);
            }
        }

        // ========== RENDERING ==========
        function renderCryptoList() {
            if (!filteredData.length) {
                cryptoGrid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                        <div style="color: var(--text-secondary); font-size: 2rem;">🔍</div>
                        <div style="color: var(--text-primary); font-size: 1.2rem;">No coins found</div>
                    </div>
                `;
                return;
            }

            cryptoGrid.innerHTML = filteredData.map(coin => {
                const priceChange = coin.price_change_percentage_24h;
                const changeClass = priceChange >= 0 ? 'positive' : 'negative';
                const changeArrow = priceChange >= 0 ? '↑' : '↓';
                const isFavorite = favorites.includes(coin.id);
                
                // Check if price changed
                const priceFlash = coin.price_change ? 'flash' : '';
                
                return `
                    <div class="crypto-card" onclick="showCoinDetails('${coin.id}')">
                        <div class="card-header">
                            <img src="${coin.image}" alt="${coin.name}" class="coin-logo" onerror="this.src='https://via.placeholder.com/40'">
                            <div class="coin-info">
                                <div class="coin-name">${coin.name}</div>
                                <div class="coin-symbol">${coin.symbol.toUpperCase()}</div>
                            </div>
                            <button class="favorite-btn ${isFavorite ? 'active' : ''}" onclick="toggleFavorite('${coin.id}', event)">
                                ${isFavorite ? '★' : '☆'}
                            </button>
                        </div>
                        <div class="card-body">
                            <div class="price-row">
                                <span class="current-price">${formatCurrency(coin.current_price)}</span>
                                <span class="price-change ${changeClass} ${priceFlash}">
                                    ${changeArrow} ${Math.abs(priceChange).toFixed(2)}%
                                </span>
                            </div>
                            <div class="market-details">
                                <div class="detail-item">
                                    <div class="detail-label">Market Cap</div>
                                    <div class="detail-value">${formatLargeNumber(coin.market_cap)}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Volume</div>
                                    <div class="detail-value">${formatLargeNumber(coin.total_volume)}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showLoading(show) {
            if (show) {
                skeletonLoader.style.display = 'block';
                cryptoGrid.style.display = 'none';
            } else {
                skeletonLoader.style.display = 'none';
                cryptoGrid.style.display = 'grid';
            }
        }

        // ========== UTILITY FUNCTIONS ==========
        function formatCurrency(value) {
            if (!value) return '$0';
            
            if (currentCurrency === 'usd') {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(value);
            } else {
                return new Intl.NumberFormat('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(value * 83); // Approximate USD to INR conversion
            }
        }

        function formatLargeNumber(num) {
            if (!num) return '$0';
            if (num >= 1e12) return '$' + (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return '$' + (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return '$' + (num / 1e6).toFixed(2) + 'M';
            return '$' + num.toLocaleString();
        }

        function updateLastUpdated() {
            const now = new Date();
            lastUpdatedEl.textContent = `Last updated: ${now.toLocaleTimeString()}`;
        }

        function updateStats() {
            totalCoinsEl.textContent = cryptoData.length;
            
            const totalMarketCap = cryptoData.reduce((sum, coin) => sum + coin.market_cap, 0);
            totalMarketCapEl.textContent = formatLargeNumber(totalMarketCap);
            
            const totalVolume = cryptoData.reduce((sum, coin) => sum + coin.total_volume, 0);
            totalVolumeEl.textContent = formatLargeNumber(totalVolume);
        }

        // ========== FILTER AND SORT ==========
        function filterCoins() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            if (!searchTerm) {
                filteredData = [...cryptoData];
            } else {
                filteredData = cryptoData.filter(coin => 
                    coin.name.toLowerCase().includes(searchTerm) ||
                    coin.symbol.toLowerCase().includes(searchTerm)
                );
            }
            
            renderCryptoList();
        }

        function sortCoins(type) {
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = {
                'market_cap_desc': 'sortDefault',
                'price_desc': 'sortPriceHigh',
                'price_asc': 'sortPriceLow',
                'gainers': 'sortGainers',
                'losers': 'sortLosers'
            }[type];
            document.getElementById(activeBtn).classList.add('active');
            
            // Sort data
            switch(type) {
                case 'price_desc':
                    filteredData.sort((a, b) => b.current_price - a.current_price);
                    break;
                case 'price_asc':
                    filteredData.sort((a, b) => a.current_price - b.current_price);
                    break;
                case 'gainers':
                    filteredData.sort((a, b) => b.price_change_percentage_24h - a.price_change_percentage_24h);
                    break;
                case 'losers':
                    filteredData.sort((a, b) => a.price_change_percentage_24h - b.price_change_percentage_24h);
                    break;
                default:
                    filteredData.sort((a, b) => b.market_cap - a.market_cap);
            }
            
            renderCryptoList();
        }

        // ========== FAVORITES ==========
        function toggleFavorite(coinId, event) {
            event.stopPropagation();
            
            const index = favorites.indexOf(coinId);
            if (index === -1) {
                favorites.push(coinId);
            } else {
                favorites.splice(index, 1);
            }
            
            localStorage.setItem('cryptoFavorites', JSON.stringify(favorites));
            renderCryptoList();
        }

        // ========== MODAL ==========
        async function showCoinDetails(coinId) {
            try {
                const response = await fetch(`https://api.coingecko.com/api/v3/coins/${coinId}`);
                const coin = await response.json();
                
                const modalContent = document.getElementById('modalContent');
                const priceChange24h = coin.market_data.price_change_percentage_24h;
                
                // Generate mini chart data (simulated)
                const chartData = Array(7).fill(0).map(() => Math.random() * 100);
                const maxChart = Math.max(...chartData);
                
                modalContent.innerHTML = `
                    <div class="modal-header">
                        <img src="${coin.image.large}" alt="${coin.name}" class="modal-logo">
                        <div>
                            <div class="modal-title">${coin.name}</div>
                            <div class="modal-symbol">${coin.symbol.toUpperCase()}</div>
                        </div>
                    </div>
                    
                    <div class="modal-stats">
                        <div class="modal-stat">
                            <div class="modal-stat-label">Current Price</div>
                            <div class="modal-stat-value">${formatCurrency(coin.market_data.current_price[currentCurrency])}</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">24h Change</div>
                            <div class="modal-stat-value" style="color: ${priceChange24h >= 0 ? 'var(--profit-color)' : 'var(--loss-color)'}">
                                ${priceChange24h >= 0 ? '↑' : '↓'} ${Math.abs(priceChange24h).toFixed(2)}%
                            </div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">Market Cap</div>
                            <div class="modal-stat-value">${formatLargeNumber(coin.market_data.market_cap[currentCurrency])}</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">Volume</div>
                            <div class="modal-stat-value">${formatLargeNumber(coin.market_data.total_volume[currentCurrency])}</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">Circulating Supply</div>
                            <div class="modal-stat-value">${(coin.market_data.circulating_supply / 1e6).toFixed(2)}M</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">All Time High</div>
                            <div class="modal-stat-value">${formatCurrency(coin.market_data.ath[currentCurrency])}</div>
                        </div>
                    </div>
                    
                    <div class="mini-chart">
                        <div class="chart-title">7 Day Price Trend (Simulated)</div>
                        <div class="chart-bars">
                            ${chartData.map(value => `
                                <div class="chart-bar" style="height: ${(value / maxChart) * 100}%"></div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                document.getElementById('modal').style.display = 'flex';
                
            } catch (error) {
                console.error('Error fetching coin details:', error);
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // ========== SETTINGS ==========
        function toggleCurrency() {
            currentCurrency = currentCurrency === 'usd' ? 'inr' : 'usd';
            currencyBtn.innerHTML = `<span>💰</span> ${currentCurrency.toUpperCase()}`;
            fetchCryptoData();
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            themeBtn.innerHTML = currentTheme === 'dark' ? '<span>🌙</span> Dark' : '<span>☀️</span> Light';
        }

        function manualRefresh() {
            document.getElementById('refreshBtn').style.animation = 'rotate 0.5s ease';
            setTimeout(() => {
                document.getElementById('refreshBtn').style.animation = '';
            }, 500);
            fetchCryptoData();
        }

        // Add rotate animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes rotate {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);

        // ========== AUTO REFRESH ==========
        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(fetchCryptoData, 30000);
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // Initialize
        fetchCryptoData();
        startAutoRefresh();
    </script>
</body>
</html>
